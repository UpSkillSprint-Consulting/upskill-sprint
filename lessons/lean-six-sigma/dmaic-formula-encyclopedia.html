<body>
  <main class="loader-card" id="loader-card" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Loading the DMAIC Formula Encyclopedia</h1>
    <p>Preparing the searchable equations and interactive study tools.</p>
  </main>
  <noscript>This interactive lesson requires JavaScript. Enable JavaScript and reload the page.</noscript>

  <script>
  (async function loadLesson() {
    const assetRoot = '/assets/lessons/dmaic-formula-encyclopedia/';
    const partNames = ['part-1.txt', 'part-2.txt', 'part-3.txt', 'part-4.txt'];

    function decodeBase64(value) {
      const binary = atob(value.replace(/\s+/g, ''));
      return Uint8Array.from(binary, function (character) {
        return character.charCodeAt(0);
      });
    }

    async function gunzip(bytes) {
      if (typeof window.DecompressionStream === 'function') {
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        return new Response(stream).text();
      }

      const fflate = await import('https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js');
      return fflate.strFromU8(fflate.gunzipSync(bytes));
    }

    try {
      const responses = await Promise.all(partNames.map(async function (partName) {
        const response = await fetch(assetRoot + partName + '?v=pr166-v2', { cache: 'no-cache' });
        if (!response.ok) {
          throw new Error('Unable to load ' + partName + ' (' + response.status + ')');
        }
        return response.text();
      }));

      let lessonHTML = await gunzip(decodeBase64(responses.join('')));

      const lesson = new DOMParser().parseFromString(lessonHTML, 'text/html');
      const dataScript = Array.from(lesson.scripts).find(script =>
        !script.src && script.textContent.includes('const formulas = ['));
      const applicationMarker = 'const root = document.getElementById("formulaRoot");';
      const applicationStart = dataScript && dataScript.textContent.indexOf(applicationMarker);
      if (!dataScript || applicationStart < 0) {
        throw new Error('The formula data package has an unsupported structure.');
      }
      // Retain the complete, authoritative data array; replace the legacy renderer.
      // Its render-on-every-keystroke handlers and independent theme must not run.
      dataScript.textContent = dataScript.textContent.slice(0, applicationStart);
      lesson.querySelectorAll('script[src*="mathjax"]').forEach(script => script.remove());
      lesson.title = 'DMAIC Formula Encyclopedia | UpSkill Sprint Consulting';
      lesson.body.classList.add('dmaic-encyclopedia-page');
      const styles = lesson.createElement('link');
      styles.rel = 'stylesheet'; styles.href = '/dmaic-encyclopedia-fixes.css?v=3';
      lesson.head.append(styles);
      const controlStyles = lesson.createElement('link');
      controlStyles.rel = 'stylesheet'; controlStyles.href = '/dmaic-encyclopedia-controls.css?v=1';
      lesson.head.append(controlStyles);
      const controller = lesson.createElement('script');
      controller.src = '/dmaic-encyclopedia-fixes.js?v=2';
      lesson.body.append(controller);
      lessonHTML = '<!DOCTYPE html>\n' + lesson.documentElement.outerHTML;

      document.open();
      document.write(lessonHTML);
      document.close();
    } catch (error) {
      console.error(error);
      const card = document.getElementById('loader-card');
      card.innerHTML = '<h1>The lesson could not be loaded</h1><p>Please refresh the page. If the issue continues, return to the <a href="/lessons#lean-six-sigma">Lean Six Sigma lesson library</a>.</p>';
    }
  }());
  </script>
