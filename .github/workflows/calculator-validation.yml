name: Engineering calculator validation
on:
  pull_request:
    paths:
      - 'tools/engineering-statistics-calculator.html'
      - 'tools/calculator-manual.html'
      - 'tools/calculator-assets/**'
      - 'tests/calculator-*.test.js'
      - 'tests/helpers/calculator-browser.js'
      - 'tests/fixtures/calculator-*.json'
      - '.github/workflows/calculator-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calculator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: node --test tests/calculator-*.test.js
