name: Apply requested Signal or Noise continuous scrolling
on:
  push:
    branches: [fix/signal-noise-lesson-guide-alignment]
    paths: [.github/workflows/apply-signal-noise-continuous-scroll.yml]
permissions:
  contents: write
jobs:
  apply-reviewed-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/signal-noise-lesson-guide-alignment
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply exact reviewed source patch to the existing PR branch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, zlib, hashlib, subprocess, re
          inputs = {
            'lessons/lean-six-sigma/signal-or-noise-arl-nelson-rules-control-limit-design.html': 'e9f709c3e35632147e3e56591bbaee083caf742693fda72226d4fdb4f72847ba',
            'tests/signal-noise-lesson.test.js': 'a27e8ca11f72d839824371e6686afca5932cbc7d8c1146954cefa7cc0df3c69f',
            'scripts/validate-signal-noise.cjs': '8797a5863ca14b470c13837f82bd6b79502ba482a0c56b0816c4205d9e8d13c2'
          }
          for name, expected in inputs.items():
            assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, name
          transport = subprocess.check_output(['git','show','99aac98bf9a625cd4ab670caf819a92b8339a210:.github/workflows/apply-signal-noise-continuous-scroll.yml'],text=True)
          encoded = re.search("encoded = '''(.*?)'''",transport,re.S).group(1)
          encoded = encoded.replace('mI48nciOeagh','mI48nciOagh')
          patch = zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '9d788500d7193405a5f908e865be9d14a7e7f298812660def4aef16e5d711551'
          subprocess.run(['git','apply','--unidiff-zero','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--unidiff-zero','-'],input=patch,check=True)
          outputs = {
            'lessons/lean-six-sigma/signal-or-noise-arl-nelson-rules-control-limit-design.html': '622c505d6e355d78070c086ac93d38baf8ef1ae2da4006ee6c0b6d211931297b',
            'tests/signal-noise-lesson.test.js': '64e2d832ce2f8f06de347e9339d28c2cb0fdb119654b5f773309b02089025876',
            'scripts/validate-signal-noise.cjs': '1f235e2d902700aa1981f16db1c0b5d811f50d4d421b15c24d5d20185df8b727'
          }
          for name, expected in outputs.items():
            assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, name
          PY
          node --test tests/signal-noise-lesson.test.js
          node --check scripts/validate-signal-noise.cjs
          git diff --check
          git config user.name BigErnie
          git config user.email BigErnie@users.noreply.github.com
          git add lessons/lean-six-sigma/signal-or-noise-arl-nelson-rules-control-limit-design.html tests/signal-noise-lesson.test.js scripts/validate-signal-noise.cjs
          git commit -m "Use continuous lesson scrolling and remove SPC module label"
          git push origin HEAD:fix/signal-noise-lesson-guide-alignment
