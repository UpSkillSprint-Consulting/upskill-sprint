name: Exam UX accessibility
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exam-ux-accessibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: '.node-version', cache: npm}
      - run: npm ci
      - name: Segment 17 focused and cumulative regressions
        run: |
          node --check test-bank-ux-accessibility.js
          node --check scripts/exam-reliability/run-segment17-browser.cjs
          node --test --test-concurrency=1 \
            tests/test-bank-segment17-ux-accessibility.test.js \
            tests/test-bank-segment16-new-only-allocation.test.js \
            tests/test-bank-segment15-session-handoff.test.js \
            tests/test-bank-segment14-incremental-sync.test.js \
            tests/test-bank-segment13-timing.test.js \
            tests/test-bank-segment12-session-lifecycle.test.js \
            tests/test-bank-analytics-dashboard.test.js
          npm test
          git diff --check
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: '.node-version', cache: npm}
      - run: npm ci
      - name: Install pinned test-only accessibility tools
        run: |
          npm install --prefix /tmp/segment17-tools --ignore-scripts --save-exact playwright@1.57.0 axe-core@4.10.3
          /tmp/segment17-tools/node_modules/.bin/playwright install --with-deps ${{ matrix.engine }}
      - name: Responsive, keyboard, accessibility-tree and WCAG 2.2 AA checks
        run: node scripts/exam-reliability/run-segment17-browser.cjs
        env:
          SEG17_PLAYWRIGHT_PATH: /tmp/segment17-tools/node_modules/playwright
          SEG17_AXE_PATH: /tmp/segment17-tools/node_modules/axe-core/axe.min.js
          SEG17_ENGINE: ${{ matrix.engine }}
  gate:
    name: Segment 17 acceptance gate
    if: always()
    needs: [node, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject any failed, skipped, cancelled, or incomplete lane
        env:
          NODE_RESULT: ${{ needs.node.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$NODE_RESULT" = success
          test "$BROWSER_RESULT" = success
