name: Student browser assessment

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'test-bank*.js'
      - 'test-bank.html'
      - 'netlify/edge-functions/test-bank-mobile-picker.js'
      - 'scripts/student-review-*'
      - 'tests/test-bank-student-*.test.js'
      - '.github/workflows/test-bank-student-audit.yml'

permissions:
  contents: read

concurrency:
  group: student-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  student-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Check updated retake test syntax
        run: |
          node --check tests/test-bank-retake-configuration.test.js
          node --check tests/test-bank-retake-dummy-user-stress.test.js
      - name: Test corrective actions
        run: node --test tests/test-bank-student-*.test.js
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Collect focused layout diagnostics
        run: |
          mkdir -p student-audit-evidence
          node scripts/student-review-server.mjs > student-audit-evidence/layout-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/test-bank -o /dev/null && break || sleep 1; done
          set -o pipefail
          python -u scripts/student-review-layout.py --browser ${{ matrix.browser }} 2>&1 | tee student-audit-evidence/layout.log
      - name: Publish layout diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-layout-${{ matrix.browser }}
          path: student-audit-evidence/layout*
          if-no-files-found: ignore
          retention-days: 14
      - name: Validate complete student journeys
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/student-review-server.mjs > student-audit-evidence/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/test-bank -o /dev/null && break || sleep 1; done
          set -o pipefail
          python -u scripts/student-review-storage.py --browser ${{ matrix.browser }} 2>&1 | tee student-audit-evidence/storage.log
          python -u scripts/student-review-browser.py --browser ${{ matrix.browser }} 2>&1 | tee student-audit-evidence/browser.log
          python -u scripts/student-review-sets.py --browser ${{ matrix.browser }} 2>&1 | tee student-audit-evidence/sets.log
      - name: Upload student assessment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-assessment-${{ matrix.browser }}
          path: student-audit-evidence
          retention-days: 14
