name: Segment 09 verified object assembly
on: pull_request
permissions:
  contents: read
jobs:
  objects:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/segment-09-canonical-grading'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Store two validated guard blobs only; branch updates remain human-reviewed connector actions
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto');
            const m=JSON.parse(fs.readFileSync('.segment09-stage/guard.json','utf8'));
            const {owner,repo}=context.repo;
            const hash=b=>crypto.createHash('sha1').update(Buffer.from('blob '+b.length+'\0')).update(b).digest('hex');
            if(m.baseTree!=='848b14e337552c39fbc847c7d9dc366f77a8096c'||m.expectedTree!=='27761a0f652c441b8a6ad05a369cbff031d664d1')throw new Error('Unexpected reviewed manifest');
            const allowed=['test-bank-analytics-dashboard.js','tests/test-bank-segment09-grading.test.js'];
            if(m.files.length!==2)throw new Error('Unexpected paths');
            const result=[];
            for(const entry of m.files){
              if(!allowed.includes(entry.path))throw new Error('Unexpected path');
              const before=await github.rest.git.getBlob({owner,repo,file_sha:entry.before});
              let data=Buffer.from(before.data.content,'base64');
              if(hash(data)!==entry.before)throw new Error('Before hash mismatch');
              for(const [lo,hi,text] of entry.edits.slice().reverse()){
                if(!Number.isInteger(lo)||lo<0||hi<lo||hi>data.length)throw new Error('Bad edit');
                data=Buffer.concat([data.subarray(0,lo),Buffer.from(text,'utf8'),data.subarray(hi)]);
              }
              if(hash(data)!==entry.after)throw new Error('After hash mismatch');
              const stored=await github.rest.git.createBlob({owner,repo,content:data.toString('base64'),encoding:'base64'});
              if(stored.data.sha!==entry.after)throw new Error('Stored hash mismatch');
              result.push({path:entry.path,sha:entry.after});
            }
            fs.mkdirSync('/tmp/segment09-objects',{recursive:true});
            fs.writeFileSync('/tmp/segment09-objects/result.json',JSON.stringify({status:'verified',blobs:result,writes:'unreferenced blobs only; no tree/ref/commit changes'},null,2));
      - uses: actions/upload-artifact@v4
        with:
          name: segment09-objects
          path: /tmp/segment09-objects
          retention-days: 2
