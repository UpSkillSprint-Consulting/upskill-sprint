name: Exam session handoff
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exam-session-handoff-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: '.node-version', cache: npm}
      - run: npm ci
      - name: Segment 15 focused and cumulative regressions
        run: |
          node --check test-bank-session-handoff.js
          node --check test-bank-incremental-sync-policy.js
          node --check scripts/exam-reliability/run-segment15-database.cjs
          node --check scripts/exam-reliability/run-segment15-browser.cjs
          node --test --test-concurrency=1 \
            tests/test-bank-segment15-session-handoff.test.js \
            tests/test-bank-segment14-incremental-sync.test.js \
            tests/test-bank-segment14-sync-policy.test.js \
            tests/test-bank-segment13-timing.test.js \
            tests/test-bank-segment12-session-lifecycle.test.js \
            tests/test-bank-learning-events.test.js \
            tests/test-bank-account-sync.test.js
          npm test
          git diff --check
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: segment15_ci_only, POSTGRES_DB: segment03_test}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: '.node-version', cache: npm}
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply full schema and cumulative database suite
        run: node scripts/exam-reliability/run-database.cjs
        env:
          SEG03_ALLOW_DISPOSABLE_DB: '1'
          SEG03_DB_URL: postgresql://postgres:segment15_ci_only@127.0.0.1:5432/segment03_test
      - name: Segment 15 checkpoint, takeover, RLS, deadline and race checks
        run: node scripts/exam-reliability/run-segment15-database.cjs
        env:
          SEG03_ALLOW_DISPOSABLE_DB: '1'
          SEG03_DB_URL: postgresql://postgres:segment15_ci_only@127.0.0.1:5432/segment03_test
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: chromium-desktop, engine: chromium, mobile: '0'}
          - {profile: webkit-phone, engine: webkit, mobile: '1'}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: '.node-version', cache: npm}
      - run: npm ci
      - name: Install pinned test-only browser driver
        run: npm install --prefix /tmp/segment15-tools --ignore-scripts --save-exact playwright@1.57.0
      - run: /tmp/segment15-tools/node_modules/.bin/playwright install --with-deps ${{ matrix.engine }}
      - name: Run two-browser handoff acceptance
        run: node scripts/exam-reliability/run-segment15-browser.cjs
        env:
          SEG15_PLAYWRIGHT_PATH: /tmp/segment15-tools/node_modules/playwright
          SEG15_ENGINE: ${{ matrix.engine }}
          SEG15_MOBILE: ${{ matrix.mobile }}
  gate:
    name: Segment 15 acceptance gate
    if: always()
    needs: [node, database, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject any failed, skipped, cancelled, or incomplete lane
        env:
          NODE_RESULT: ${{ needs.node.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$NODE_RESULT" = success
          test "$DATABASE_RESULT" = success
          test "$BROWSER_RESULT" = success
