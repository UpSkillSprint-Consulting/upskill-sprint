name: Deliver verified PR165 final repairs
on:
  push:
    branches: ['fix/pr165-final-review-defects']
    paths: ['.github/workflows/pr165-final-fixes-deliver.yml']
permissions:
  contents: write
  actions: read
  pull-requests: write
concurrency:
  group: pr165-final-repair-delivery
  cancel-in-progress: false
jobs:
  deliver:
    if: github.ref == 'refs/heads/fix/pr165-final-review-defects'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Resolve only the successfully verified clean repair candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr165-final-delivery"
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, re, subprocess, time, urllib.request, zipfile
          repo = 'UpSkillSprint-Consulting/upskill-sprint'
          api = 'https://api.github.com/repos/' + repo
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr165-final-delivery'
          baseline = '962bf6e85bb72ef1ce7247239709f39665120d46'
          source_commit = '0ac2a833342bb2dc0325ed328befc9c71ced6482'
          run_id = 34049497305
          def get(path):
              req = urllib.request.Request(api + path, headers={'Authorization':'Bearer ' + os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'})
              return urllib.request.urlopen(req, timeout=45).read()
          run = json.loads(get('/actions/runs/' + str(run_id)))
          assert run['head_sha'] == source_commit and run['head_branch'] == 'fix/pr165-final-review-defects'
          for attempt in range(24):
              if run['status'] == 'completed': break
              time.sleep(15)
              run = json.loads(get('/actions/runs/' + str(run_id)))
          assert run['status'] == 'completed' and run['conclusion'] == 'success', 'Original verification has not passed; no PR write permitted'
          (out / 'original-verification-run.json').write_text(json.dumps(run, indent=2))
          workflow = subprocess.check_output(['git','show',source_commit + ':.github/workflows/pr165-final-fixes.yml'], text=True)
          branches = set(re.findall(r'git push origin HEAD:refs/heads/([A-Za-z0-9_./-]+)', workflow))
          artifact_commits = set()
          manifests = []
          artifacts = json.loads(get('/actions/runs/' + str(run_id) + '/artifacts?per_page=100'))['artifacts']
          assert artifacts, 'Original verification evidence missing'
          for artifact in artifacts:
              if artifact['expired']: continue
              assert artifact['size_in_bytes'] < 25000000, 'Unexpected verification archive size'
              packed = get('/actions/artifacts/' + str(artifact['id']) + '/zip')
              archive = zipfile.ZipFile(io.BytesIO(packed))
              for entry in archive.infolist():
                  if entry.is_dir(): continue
                  name = pathlib.PurePosixPath(entry.filename).name
                  if name in ('commit.txt','candidate-commit.txt'):
                      value = archive.read(entry).decode().strip()
                      if re.fullmatch(r'[0-9a-f]{40}', value): artifact_commits.add(value)
                  if name == 'verified-files.json':
                      data = json.loads(archive.read(entry))
                      if isinstance(data, dict): manifests.append(data)
              (out / ('original-verification-' + str(artifact['id']) + '.zip')).write_bytes(packed)
          candidates = set(artifact_commits)
          for branch in branches:
              assert branch not in ('main','audit/mbb-set2-batch02','fix/pr165-final-review-defects')
              ref = json.loads(get('/git/ref/heads/' + branch))
              candidates.add(ref['object']['sha'])
          assert len(candidates) == 1, 'Cannot uniquely resolve verified repair commit'
          candidate = candidates.pop()
          assert candidate != baseline and re.fullmatch(r'[0-9a-f]{40}', candidate)
          subprocess.run(['git','fetch','origin',candidate], check=True)
          subprocess.run(['git','merge-base','--is-ancestor',baseline,candidate], check=True)
          changed = subprocess.check_output(['git','diff','--name-only',baseline,candidate], text=True).splitlines()
          assert changed and not any(p.startswith('.github/') for p in changed), 'Helper files must not enter PR'
          assert not any(p.startswith(('supabase/','netlify/functions/')) or p in ('package.json','package-lock.json') for p in changed), 'Unexpected persistence/dependency scope'
          subprocess.run(['git','checkout','--detach',candidate], check=True)
          checked = {}
          for manifest in manifests:
              for name, expected in manifest.items():
                  path = pathlib.PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts
                  if isinstance(expected, dict): expected = expected.get('after') or expected.get('sha256')
                  assert isinstance(expected,str) and re.fullmatch(r'[0-9a-f]{64}',expected), 'Unrecognized verification manifest'
                  actual = hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
                  assert actual == expected, 'Verified-file mismatch: ' + name
                  checked[name] = actual
          assert checked and set(changed) <= set(checked), 'Unverified candidate paths'
          subprocess.run(['git','diff','--check',baseline,candidate], check=True)
          node = "const fs=require('fs'),vm=require('vm');let c={};c.window=c;vm.createContext(c);vm.runInContext(fs.readFileSync(process.argv[1],'utf8'),c);console.log(JSON.stringify(c.MBB_SET2));"
          before_file = out / 'baseline-bank.js'
          before_file.write_bytes(subprocess.check_output(['git','show',baseline+':test-bank-mbb-set2.js']))
          before = json.loads(subprocess.check_output(['node','-e',node,str(before_file)],text=True))
          after = json.loads(subprocess.check_output(['node','-e',node,'test-bank-mbb-set2.js'],text=True))
          assert len(before) == len(after) == 175
          for a,b in zip(before,after):
              for field in ('qid','stem','options','answer'):
                  assert a[field] == b[field], 'Unexpected content/key change: ' + a['qid'] + ' ' + field
          assert next(q for q in after if q['qid']=='mbb:set-2:original-150')['answer'] == 3
          result = {'baseline':baseline,'candidate':candidate,'originalVerificationRun':run_id,'verifiedFiles':checked,'changedFiles':changed,'questionsPreserved':175,'answerKeysPreserved':175,'q150Answer':'D'}
          (out / 'candidate.json').write_text(json.dumps(result,indent=2))
          print(json.dumps({'candidate':candidate,'verifiedFiles':len(checked),'changedFiles':len(changed),'preservedQuestionKeys':175},indent=2))
          PY
      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci | tee "$RUNNER_TEMP/pr165-final-delivery/dependencies.log"
      - name: Rerun the complete repository test suite
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 tests/*.test.js | tee "$RUNNER_TEMP/pr165-final-delivery/full-tests.log"
      - name: Fast-forward only PR165 and confirm the resulting ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, urllib.request
          repo = 'UpSkillSprint-Consulting/upskill-sprint'
          api = 'https://api.github.com/repos/' + repo
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr165-final-delivery'
          proof = json.loads((out/'candidate.json').read_text())
          assert os.environ['GITHUB_REF'] == 'refs/heads/fix/pr165-final-review-defects'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip() == proof['candidate']
          text = (out/'full-tests.log').read_text()
          counts = {}
          for key in ('tests','pass','fail','cancelled','skipped'):
              matches = re.findall(r'^# '+key+r' (\d+)\s*$',text,re.M)
              assert len(matches) == 1, 'Missing complete test summary: '+key
              counts[key] = int(matches[0])
          assert counts['tests'] >= 1389 and counts['pass'] == counts['tests']
          assert counts['fail'] == counts['cancelled'] == counts['skipped'] == 0
          for name,expected in proof['verifiedFiles'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == expected
          def call(path,method='GET',body=None):
              req = urllib.request.Request(api+path,data=json.dumps(body).encode() if body is not None else None,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              return json.loads(urllib.request.urlopen(req,timeout=45).read())
          pr = call('/pulls/165')
          assert pr['state']=='open' and not pr['merged'] and pr['base']['ref']=='main'
          assert pr['head']['ref']=='audit/mbb-set2-batch02' and pr['head']['repo']['full_name']==repo
          current = pr['head']['sha']
          if current == proof['baseline']:
              call('/git/refs/heads/audit/mbb-set2-batch02','PATCH',{'sha':proof['candidate'],'force':False})
          elif current != proof['candidate']:
              comparison = call('/compare/'+proof['candidate']+'...'+current)
              assert comparison['status']=='ahead' and comparison['behind_by']==0, 'PR changed independently; preserve it'
              assert all(f['filename'].startswith('docs/') for f in comparison.get('files',[])), 'New application changes require separate validation'
          final = call('/pulls/165')
          ref = call('/git/ref/heads/audit/mbb-set2-batch02')
          assert ref['object']['sha'] in (proof['candidate'],current)
          proof.update({'fullSuite':counts,'deliveredHead':ref['object']['sha'],'pr':165,'merged':final['merged'],'workflowRun':int(os.environ['GITHUB_RUN_ID'])})
          assert proof['merged'] is False
          (out/'publication.json').write_text(json.dumps(proof,indent=2))
          message = ('Final-validation repair delivery confirmed. The tested clean repair commit `'+proof['candidate']+'` is included in PR #165. '+str(counts['pass'])+'/'+str(counts['tests'])+' full-repository tests passed in this delivery run, with zero failures, cancellations or skips. All '+str(len(proof['verifiedFiles']))+' candidate-file hashes matched the original successful repair-verification artifact. All 175 question IDs, stems, choices and answer indices were preserved, including Q150=D. This delivers the prepared decimal-safe/idempotent feedback, complete similar-practice evidence, explicit rationale-field support and corrected metadata. Human review and live acceptance remain separate. No main merge, automatic approval, production deployment or historical-score rewrite was performed. Verification: https://github.com/'+repo+'/actions/runs/'+os.environ['GITHUB_RUN_ID'])
          response = call('/issues/165/comments','POST',{'body':message})
          (out/'pr-comment.json').write_text(json.dumps(response,indent=2))
          print(json.dumps({'pr':165,'head':proof['deliveredHead'],'fullSuite':counts,'merged':False},indent=2))
          PY
      - name: Preserve delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr165-final-repair-delivery-proof
          path: ${{ runner.temp }}/pr165-final-delivery/
          retention-days: 14
