name: Inspect prepared MBB Batch 2 payload
on:
  push:
    branches: ['audit/mbb-set2-batch02']
    paths: ['.github/workflows/mbb-batch02-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/mbb-set2-batch02'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Decode and inspect transport only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mbb2-inspection"
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'mbb2-inspection'
          paths=sorted(pathlib.Path('.github/mbb2-transport').glob('part-*.b64'))
          assert len(paths)==7
          parts=[p.read_text().strip() for p in paths]
          print('Part lengths:', [len(x) for x in parts])
          raw=base64.b64decode(''.join(parts), validate=True)
          print('Compressed SHA256:',hashlib.sha256(raw).hexdigest())
          data=gzip.decompress(raw)
          (out/'payload.json').write_bytes(data)
          payload=json.loads(data)
          print('Top-level type:',type(payload).__name__)
          if isinstance(payload,dict):
              for key,value in payload.items():
                  print('KEY',key,'TYPE',type(value).__name__,'SIZE',len(str(value)))
              if 'manifest' in payload: print('MANIFEST',json.dumps(payload['manifest'],indent=2))
              if 'files' in payload:
                  files=payload['files']
                  print('FILES',list(files) if isinstance(files,dict) else [x.get('path', '?') for x in files])
          print('Decoded SHA256:',hashlib.sha256(data).hexdigest())
          PY
      - name: Preserve inspection package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mbb2-payload-inspection
          path: ${{ runner.temp }}/mbb2-inspection/
          retention-days: 3
