name: MBB Set 3 Batch 7 audit
on:
  pull_request:
    paths:
      - 'test-bank*.js'
      - 'test-bank.html'
      - 'tests/test-bank-mbb-set3-batch7*'
      - 'tests/helpers/test-bank-durable-learning.js'
      - 'scripts/audit-mbb-set3-batch7.mjs'
      - '.github/workflows/mbb-set3-batch7-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mbb-set3-batch7-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Independent calculations, all-option grading, references, fallback and traversal
        run: |
          mkdir -p audit-results-batch7
          git rev-parse HEAD > audit-results-batch7/tested-commit.txt
          set -o pipefail
          node --test --test-concurrency=1 tests/test-bank-mbb-set3-batch7*.test.js tests/test-bank-mbb-set3.test.js | tee audit-results-batch7/batch7-tests.txt
      - name: Complete repository regression
        run: timeout 900 node --test --test-concurrency=2 tests/*.test.js > audit-results-batch7/full-regression.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mbb-set3-batch7-regression
          path: audit-results-batch7
          retention-days: 14
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        layout: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright @axe-core/playwright
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Open, answer and reopen every question, five visuals and corrected references
        env:
          AUDIT_ENGINE: ${{ matrix.engine }}
          AUDIT_LAYOUT: ${{ matrix.layout }}
        run: |
          mkdir -p audit-results-batch7
          git rev-parse HEAD > audit-results-batch7/tested-commit.txt
          node scripts/audit-mbb-set3-batch7.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mbb-set3-batch7-${{ matrix.engine }}-${{ matrix.layout }}
          path: audit-results-batch7
          retention-days: 14
