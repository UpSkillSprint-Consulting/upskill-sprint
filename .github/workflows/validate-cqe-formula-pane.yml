name: Validate CQE formula pane

on:
  push:
    branches:
      - fix/cqe-context-aware-formula-pane
    paths:
      - test-bank.html
      - test-bank-formulas.js
      - test-bank-cre-formulas.js
      - tests/test-bank-formula-pane.test.js
      - tests/test-bank-formula-pane-exhaustive.test.js
      - tests/test-bank-formula-pane-modes.test.js
      - tests/test-bank-cre-formula-pane.test.js
      - .github/workflows/validate-cqe-formula-pane.yml
  pull_request:
    branches:
      - main
    paths:
      - test-bank.html
      - test-bank-formulas.js
      - test-bank-cre-formulas.js
      - tests/test-bank-formula-pane.test.js
      - tests/test-bank-formula-pane-exhaustive.test.js
      - tests/test-bank-formula-pane-modes.test.js
      - tests/test-bank-cre-formula-pane.test.js
      - .github/workflows/validate-cqe-formula-pane.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate JavaScript syntax
        run: |
          node --check test-bank-formulas.js
          node --check test-bank-cre-formulas.js
      - name: Run focused CQE formula-pane tests
        run: node --test tests/test-bank-formula-pane.test.js
      - name: Run CRE formula-pane tests
        run: node --test tests/test-bank-cre-formula-pane.test.js
      - name: Run exhaustive CQE formula-pane tests
        run: node --test tests/test-bank-formula-pane-exhaustive.test.js
      - name: Run CQE session-mode and recovery tests
        run: node --test tests/test-bank-formula-pane-modes.test.js
