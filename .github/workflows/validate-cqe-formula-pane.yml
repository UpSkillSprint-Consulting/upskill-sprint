name: Validate CQE formula pane

on:
  push:
    branches:
      - fix/cqe-context-aware-formula-pane
    paths:
      - test-bank.html
      - test-bank-formulas.js
      - tests/test-bank-formula-pane.test.js
      - .github/workflows/validate-cqe-formula-pane.yml
  pull_request:
    branches:
      - main
    paths:
      - test-bank.html
      - test-bank-formulas.js
      - tests/test-bank-formula-pane.test.js
      - .github/workflows/validate-cqe-formula-pane.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate JavaScript syntax
        run: node --check test-bank-formulas.js
      - name: Run CQE formula-pane integration tests
        run: node --test tests/test-bank-formula-pane.test.js
      - name: Run repository suite for regression visibility
        continue-on-error: true
        run: npm test
      - name: Explain known baseline failures
        if: always()
        run: |
          echo "The CQE formula-pane syntax and focused integration tests are required to pass."
          echo "The full repository suite is informational because main currently contains unrelated Minitab lesson metadata/controller-tag failures."
