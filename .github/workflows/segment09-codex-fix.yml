name: Segment 09 Codex finding repair
on:
  push:
    branches: [fix/segment-09-canonical-grading]
permissions:
  contents: write
jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[segment09-fixbot]')"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/segment-09-canonical-grading
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply complete historical pin validation and regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('test-bank-versioning.js')
          s=p.read_text()
          marker="  /* Historical presentation is read-only. Unknown legacy policy is not today's\n"
          assert s.count(marker)==1
          helper="""  function checkedReference(value) {
            const v=value;
            requireValue(v&&v.codec===1&&v.contractVersion===SCHEMA,'Unsupported historical version reference');
            requireValue(typeof v.sessionId==='string'&&v.sessionId.length>0&&typeof v.examId==='string'&&v.examId.length>0&&typeof v.setId==='string'&&v.setId.length>0,'Missing historical version identity');
            for(const key of ['configVersion','bankVersion','blueprintVersion','configurationDigest'])requireValue(typeof v[key]==='string'&&/^[a-f0-9]{64}$/.test(v[key]),'Missing or invalid historical '+key);
            for(const key of ['gradingPolicyVersion','masteryPolicyVersion','timingPolicyVersion'])requireValue(typeof v[key]==='string'&&v[key].length>0,'Missing historical '+key);
            requireValue(MODES.includes(v.mode)&&v.mode!=='review','Invalid historical session mode');
            requireValue(Number.isSafeInteger(v.expectedLength)&&v.expectedLength>0&&v.expectedLength<=200,'Invalid historical expected length');
            requireValue(v.siteTargetBps===null||Number.isInteger(v.siteTargetBps)&&v.siteTargetBps>=0&&v.siteTargetBps<=10000,'Invalid historical site target');
            requireValue(typeof v.timed==='boolean'&&typeof v.startedAt==='string'&&!Number.isNaN(Date.parse(v.startedAt)),'Invalid historical timing identity');
            if(v.timed) {
              requireValue(Number.isSafeInteger(v.limitSeconds)&&v.limitSeconds>0&&v.limitSeconds<=86400&&typeof v.deadlineAt==='string'&&!Number.isNaN(Date.parse(v.deadlineAt)),'Invalid historical deadline');
              requireValue(Date.parse(v.deadlineAt)-Date.parse(v.startedAt)===v.limitSeconds*1000,'Historical deadline differs from pinned limit');
            } else requireValue(v.limitSeconds===null&&v.deadlineAt===null,'Untimed historical session has a deadline');
            return v;
          }
          """
          s=s.replace(marker,helper+marker,1)
          line="      const v=entry.versionPin||null, g=entry.grading||null;\n"
          assert s.count(line)==1
          s=s.replace(line,line+"      if(v)checkedReference(v);\n",1)
          old="      if(v)requireValue(v.codec===1&&v.contractVersion===SCHEMA&&v.gradingPolicyVersion==='single-select-v1'&&Number.isSafeInteger(v.expectedLength)&&v.expectedLength>0,'Unsupported historical grading policy');"
          assert s.count(old)==1
          s=s.replace(old,"      if(v)requireValue(v.gradingPolicyVersion==='single-select-v1','Unsupported historical grading policy');",1)
          old="        if(g.resultId!=null)requireValue(v&&typeof v.sessionId==='string'&&g.resultId===v.sessionId+':original','Original result identity mismatch');"
          assert s.count(old)==1
          s=s.replace(old,"        requireValue(v&&g.resultId===v.sessionId+':original','Original result identity mismatch');",1)
          old="        if(g.pinDigest!=null&&v&&v.pinDigest!=null)requireValue(g.pinDigest===v.pinDigest,'Original pin digest mismatch');"
          assert s.count(old)==1
          s=s.replace(old,"        requireValue(typeof g.pinDigest==='string'&&/^[a-f0-9]{64}$/.test(g.pinDigest),'Missing original pin digest');",1)
          p.write_text(s)

          p=Path('tests/test-bank-segment09-grading.test.js')
          s=p.read_text()
          needle="test('09 complete original groups survive cache compaction; incomplete evidence does not become a 100% score',()=>{\n"
          assert s.count(needle)==1
          addition="""test('09 truncated or unbound version references cannot qualify as pinned examinations',()=>{
            const base=attempt(fixture({count:165}));
            assert.equal(V.assessAttempt(base,'cssbb').eligible,true);
            const fields=['sessionId','examId','setId','configVersion','bankVersion','blueprintVersion','configurationDigest','gradingPolicyVersion','masteryPolicyVersion','timingPolicyVersion','startedAt'];
            for(const field of fields){const x=plain(base);delete x.versionPin[field];const g=V.assessAttempt(x,'cssbb');assert.equal(g.available,false,field);assert.equal(g.eligible,false,field);assert.notEqual(g.provenance,'pinned',field);assert.ok(g.diagnostic,field);}
            const codex=plain(base);codex.versionPin={codec:1,contractVersion:'1.0.0',gradingPolicyVersion:'single-select-v1',expectedLength:165,siteTargetBps:7000,mode:'exam',timed:true};
            const rejected=V.assessAttempt(codex,'cssbb');assert.equal(rejected.available,false);assert.equal(rejected.eligible,false);assert.notEqual(rejected.provenance,'pinned');
            for(const mutate of [a=>delete a.grading.pinDigest,a=>a.grading.pinDigest='f'.repeat(63),a=>a.grading.resultId='foreign:original']){const x=plain(base);mutate(x);const g=V.assessAttempt(x,'cssbb');assert.equal(g.available,false);assert.equal(g.eligible,false);assert.notEqual(g.provenance,'pinned');}
          });
          """
          s=s.replace(needle,addition+needle,1)
          p.write_text(s)
          PY
      - name: Run focused regression
        run: node --test --test-concurrency=1 tests/test-bank-segment09-grading.test.js
      - name: Commit reviewed repair and remove helper workflow
        shell: bash
        run: |
          git config user.name upskillsprint-agent
          git config user.email skillsprintconsulting@gmail.com
          git rm .github/workflows/segment09-codex-fix.yml
          git add test-bank-versioning.js tests/test-bank-segment09-grading.test.js
          git diff --cached --check
          git commit -m "fix(grading): reject incomplete historical pins [segment09-fixbot]"
          git push origin HEAD:fix/segment-09-canonical-grading
