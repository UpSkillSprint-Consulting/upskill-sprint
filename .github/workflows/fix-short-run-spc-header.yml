name: Fix short-run SPC header

on:
  pull_request:
    branches:
      - main
    types:
      - ready_for_review

permissions:
  contents: write

jobs:
  fix-header:
    if: github.head_ref == 'agent/add-short-run-spc-lesson'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-short-run-spc-lesson

      - name: Remove duplicate link and repair theme control
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lessons/lean-six-sigma/short-run-spc-control-charts.html')
          html = path.read_text(encoding='utf-8')

          css = '    .lesson-sitebar .back-link { font-size: 0.88rem; font-weight: 600; text-decoration: none; }\n'
          old = '''    <div class="header-actions">
                <a class="back-link" href="/lessons#lean-six-sigma">Back to Lean Six Sigma</a>
                <label for="mnav-check" class="mobile-menu-btn" aria-label="Open menu">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"></path></svg>
                </label>
                <div class="theme-control" aria-label="Colour theme">
                  <button type="button" class="theme-toggle" data-theme-toggle="true" role="switch" aria-checked="false" aria-label="Switch colour theme">Light / Dark</button>
                </div>
              </div>'''
          new = '''    <div class="header-actions">
                <label for="mnav-check" class="mobile-menu-btn" aria-label="Open menu">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"></path></svg>
                </label>
                <div class="theme-control" aria-label="Colour theme">
                  <svg class="theme-icon theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
                  </svg>
                  <button type="button" class="theme-toggle" data-theme-toggle="true" role="switch" aria-checked="false" aria-label="Switch to dark mode" title="Switch to dark mode">
                    <span class="sr-only">Toggle dark and light mode</span>
                  </button>
                  <svg class="theme-icon theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                  </svg>
                </div>
              </div>'''

          if old not in html:
              raise SystemExit('Expected original header markup was not found.')

          html = html.replace(css, '', 1)
          html = html.replace(old, new, 1)
          path.write_text(html, encoding='utf-8')

          header = html.split('<header class="site lesson-sitebar">', 1)[1].split('</header>', 1)[0]
          assert 'Back to Lean Six Sigma' not in header
          assert 'Light / Dark' not in header
          assert 'theme-icon-sun' in header and 'theme-icon-moon' in header
          assert '<span class="sr-only">Toggle dark and light mode</span>' in header
          assert html.count('Back to Lean Six Sigma') == 2
          print('Header link removed and standard theme control installed.')
          PY

      - name: Commit the corrected lesson
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-short-run-spc-header.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lessons/lean-six-sigma/short-run-spc-control-charts.html .github/workflows/fix-short-run-spc-header.yml
          git commit -m 'fix: simplify lesson header theme control'
          git push origin HEAD:agent/add-short-run-spc-lesson
