name: Segment 09 review object staging
on:
  pull_request:
permissions:
  contents: read
jobs:
  stage-reviewed-objects:
    if: github.head_ref == 'fix/segment-09-canonical-grading' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: '.node-version', cache: npm}
      - run: npm ci
      - name: Apply reviewed transformations to disposable checkout only
        run: |
          python - <<'PY'
          from pathlib import Path
          r=Path('.')
          p=r/'test-bank-versioning.js';s=p.read_text();s=s.replace('function assessAttempt(entry) {','function assessAttempt(entry, expectedExamId) {')
          s=s.replace("['abandoned','in_progress','paused','finalizing'].includes(entry.state)","['created','in_progress','paused','finalizing','abandoned','cancelled','canceled'].includes(entry.state)")
          a="      const v=entry.versionPin||null, g=entry.grading||null;\n"
          b=a+"""      if(expectedExamId!=null) {
                  requireValue(typeof expectedExamId==='string'&&expectedExamId.length>0,'Invalid historical exam scope');
                  if(entry.examId!=null)requireValue(entry.examId===expectedExamId,'Historical exam scope mismatch');
                  if(v&&v.examId!=null)requireValue(v.examId===expectedExamId,'Pinned exam scope mismatch');
                }
                if(v&&v.sessionId!=null) {
                  requireValue(typeof v.sessionId==='string'&&v.sessionId.length>0,'Invalid historical session identity');
                  if(entry.id!=null)requireValue(entry.id===v.sessionId,'Historical session identity mismatch');
                  if(entry.sessionId!=null)requireValue(entry.sessionId===v.sessionId,'Historical session identity mismatch');
                }
                if(v&&v.examId!=null&&entry.examId!=null)requireValue(v.examId===entry.examId,'Historical exam identity mismatch');
          """
          assert s.count(a)==1;s=s.replace(a,b)
          a="      if(g) {\n        requireValue(v&&g.schemaVersion"
          b="""      if(g) {
                  if(g.resultId!=null)requireValue(v&&typeof v.sessionId==='string'&&g.resultId===v.sessionId+':original','Original result identity mismatch');
                  if(g.pinDigest!=null&&v&&v.pinDigest!=null)requireValue(g.pinDigest===v.pinDigest,'Original pin digest mismatch');
                  requireValue(v&&g.schemaVersion"""
          assert s.count(a)==1;s=s.replace(a,b);p.write_text(s)
          p=r/'test-bank-analytics-dashboard.js';s=p.read_text();assert s.count('window.__TBVersions.assessAttempt(entry)')==4;s=s.replace('window.__TBVersions.assessAttempt(entry)','window.__TBVersions.assessAttempt(entry,examId())');p.write_text(s)
          p=r/'scripts/exam-reliability/run-browser.cjs';s=p.read_text()
          s=s.replace("await page.waitForFunction(()=>window.__TB && window.__TBLearning && document.body.classList.contains('auth-ready'));\n  await page.evaluate(async()=>{await __TBLearning.sync('fixture-ready');await new Promise(r=>setTimeout(r,0));});", """await page.waitForFunction(()=>window.__TB && window.__TBLearning && window.__TBAccountSync && window.__TBRetakeConfiguration && document.body.classList.contains('auth-ready'));
            // Both startup hydrators can schedule browse replacement. Finish their real
            // promises and enhancement frames before interacting; do not retry lost clicks.
            await page.evaluate(async()=>{
              const account=await __TBAccountSync.syncAfterCurrent('fixture-ready');
              if(account&&account.error)throw new Error('Synthetic account hydration failed');
              await __TBLearning.sync('fixture-ready');
              await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
            });""")
          a='async function quick(page,exam){';start=s.index(a);end=s.index('\nasync function main()',start)
          s=s[:start]+'''async function quick(page,exam){
            await page.locator('.tb-tile[data-exam="'+exam+'"]').click();
            await page.evaluate(()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r))));
            await page.locator('[data-count="quick"][data-n="10"]').click();
            await page.waitForFunction(()=>document.querySelector('[data-count="quick"][data-n="10"]')?.getAttribute('aria-pressed')==='true');
            await page.locator('[data-mode="quick"]').click();
            await page.locator('.tb-quiz').waitFor();
            assert.equal(await page.locator('.tb-navcell').count(),10,'Selected ten-item plan must exist before grading');
            const answer=await page.evaluate(e=>{const id=document.querySelector('.tb-quiz').dataset.questionId;return __TBQuestionRegistry.find(e,id).answer;},exam);
            await page.locator('[data-opt="'+answer+'"]').click();
            await page.locator('.tb-navcell').last().click();
            await page.locator('[data-submit]').click();
            await page.locator('.tb-resverd').waitFor();
            assert.match(await page.locator('.tb-resverd').innerText(),/1 of 10 correctly/);
          }'''+s[end:];p.write_text(s)
          p=r/'docs/exam-reliability/SEGMENT-09-GRADING.md';s=p.read_text()+'''
          ## Final review safeguards

          Historical assessment also checks supplied session/result identity, optional pin digest and the analytics certification scope. A completed flag cannot override created, cancelled, paused, abandoned or finalizing state. These checks withhold inconsistent derived history without changing original ledger evidence or the grading wire schema.

          The Firefox trace from framework run 34289938696 recorded a twenty-item plan in a test that requested ten, before any score assertion. The browser fixture now waits for both actual startup hydration promises and enhancement frames, verifies the selected count, and checks the ten-item plan before answering. It retains the original result, blank, history and synchronization assertions and does not retry a missed click. This is an explicit test setup prerequisite, not a claim that all early-hydration user interactions or physical-device behavior have been qualified.

          Grading CI retains the exact tested commit/tree, file fingerprints, scoped source archive and logs. Source fingerprints make later continuation independent of a stale local checkout. No credentials, production learner data or font files are added to the review evidence.
          ''';p.write_text(s)
          p=r/'.github/workflows/exam-grading.yml';p.write_text(p.read_text().replace('tests/test-bank-segment09-grading.test.js','tests/test-bank-segment09-*.test.js'))
          p=r/'tests/test-bank-segment09-identity.test.js';p.write_text('''\
          'use strict';
          const test=require('node:test'),assert=require('node:assert/strict');
          const V=require('../test-bank-versioning.js');
          const {makeSandbox}=require('./helpers/segment01-sandbox.cjs');
          const copy=x=>JSON.parse(JSON.stringify(x));
          function original(examId='cssbb') {
            const q={qid:examId+':s09:identity',sub:'one',stem:'Synthetic identity fixture',options:['A','B'],answer:0};
            const exam={questions:1,minutes:1,pass:70,sets:{1:[q]},bok:[{domain:'domain',subs:[{id:'one',name:'Original domain',w:1}]}]};
            const catalog=V.createExamCatalog(examId,exam,{source:'synthetic scope fixture'});
            const pin=V.pin({examId,sessionId:'identity-'+examId,questions:[q],setId:'1',mode:'exam',timed:true,limitSeconds:60,startedAt:Date.UTC(2026,8,8)},exam,catalog);
            const grading=V.grade(pin,[{question:q,selected:0}]);
            return {id:pin.sessionId,examId,total:1,correct:1,mode:'exam',timed:true,completed:true,at:Date.UTC(2026,8,8),versionPin:V.reference(pin),grading};
          }
          test('09 saved result identity cannot be attached to a different session or certification',()=>{
            const base=original();assert.equal(V.assessAttempt(base,'cssbb').eligible,true);
            for(const change of [x=>x.id='foreign',x=>x.sessionId='foreign',x=>x.examId='cqe',x=>x.grading.resultId='foreign:original',x=>x.versionPin.sessionId='foreign']) {
              const x=copy(base);change(x);const before=JSON.stringify(x),view=V.assessAttempt(x,'cssbb');
              assert.equal(view.available,false);assert.equal(view.eligible,false);assert.ok(view.diagnostic);assert.equal(JSON.stringify(x),before);
            }
            assert.equal(V.assessAttempt(original('mbb'),'cssbb').available,false);
            const x=copy(base);x.versionPin.pinDigest='different';assert.equal(V.assessAttempt(x).available,false);
          });
          test('09 a completed flag cannot override a created, cancelled or nonterminal state',()=>{
            const a=original();for(const state of ['created','in_progress','paused','finalizing','abandoned','cancelled','canceled']) {
              const g=V.assessAttempt({...a,state});assert.equal(g.available,false,state);assert.equal(g.eligible,false,state);
            }
            assert.equal(V.assessAttempt({...a,state:'expired',completedReason:'timed-out'}).eligible,true);
          });
          test('09 certification-scoped analytics withhold a valid grade stored under the wrong certification',()=>{
            const s=makeSandbox();['test-bank-question-registry.js','test-bank-adaptive-mastery.js','test-bank-adaptive-mastery-hardening.js','test-bank-analytics-dashboard.js'].forEach(s.load);
            const valid=original(),foreign=original('mbb');s.setExamData({attempts:[valid,foreign]});
            const before=s.localStorage.getItem('tb-adaptive-mastery-v1');
            assert.equal(s.context.__TBAnalyticsDashboard.examAttemptSeries().length,1);
            const trend=s.context.__TBAnalyticsDashboard.sessionTrend();
            assert.equal(trend.filter(x=>x.available).length,1);
            assert.equal(trend.filter(x=>!x.available&&x.scorePercent===null).length,1);
            assert.equal(s.localStorage.getItem('tb-adaptive-mastery-v1'),before);
          });
          ''')
          Path('.stage09').mkdir()
          PY
      - name: Validate staged source and independent grading cases
        run: |
          set -o pipefail
          node --check test-bank-versioning.js
          node --check scripts/exam-reliability/run-browser.cjs
          node --test --test-concurrency=2 tests/test-bank-segment09-*.test.js | tee .stage09/tests.log
      - name: Store validated blobs only; never update a commit or branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'JS'
          const fs=require('node:fs'),crypto=require('node:crypto'),assert=require('node:assert/strict');
          const entries=[['.github/workflows/exam-grading.yml','5d72a2ddb1e2537d145d4878c833d458db0a8adc'],['docs/exam-reliability/SEGMENT-09-GRADING.md','abb9507e9585cd5f02cb4a789caf1afaf5e89c7f'],['scripts/exam-reliability/run-browser.cjs','e0d013c59792e3e91a960ba94b15c4c5b816df48'],['test-bank-analytics-dashboard.js','5ed8138314f32b20771fb714058a76aff91cba66'],['test-bank-versioning.js','074042fd0b0343b175742901a7c770328c884b42'],['tests/test-bank-segment09-identity.test.js','62078771104b4c5f15e9d4a6b34d8159bc7b300a']];
          (async()=>{const results=[];for(const [path,expected]of entries){const data=fs.readFileSync(path);const sha=crypto.createHash('sha1').update(Buffer.concat([Buffer.from('blob '+data.length+'\0'),data])).digest('hex');assert.equal(sha,expected);const response=await fetch('https://api.github.com/repos/UpSkillSprint-Consulting/upskill-sprint/git/blobs',{method:'POST',headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({content:data.toString('base64'),encoding:'base64'})});if(!response.ok)throw Error('Blob storage rejected: '+response.status);const blob=await response.json();assert.equal(blob.sha,expected);results.push({path,sha,mode:'100644',type:'blob'});}fs.writeFileSync('.stage09/blobs.json',JSON.stringify(results,null,2));})().catch(e=>{console.error(e.message);process.exitCode=1;});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: segment09-reviewed-objects
          path: .stage09
          include-hidden-files: true
          retention-days: 2
