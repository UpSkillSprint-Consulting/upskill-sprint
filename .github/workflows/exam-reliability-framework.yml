name: Exam reliability framework
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exam-framework-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: '.node-version', cache: npm}
      - run: npm ci
      - run: node scripts/exam-reliability/run-node.cjs
      - if: always()
        run: node scripts/exam-reliability/run-mutations.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seg03-node-${{ github.run_id }}
          path: .segment03-results
          include-hidden-files: true
          retention-days: 30
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: segment03_ci_only, POSTGRES_DB: segment03_test}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: '.node-version', cache: npm}
      - run: npm ci
      - name: Verify preinstalled PostgreSQL client
        run: psql --version
      - run: node scripts/exam-reliability/run-database.cjs
        env:
          SEG03_ALLOW_DISPOSABLE_DB: '1'
          SEG03_DB_URL: postgresql://postgres:segment03_ci_only@127.0.0.1:5432/segment03_test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seg03-database-${{ github.run_id }}
          path: .segment03-results
          include-hidden-files: true
          retention-days: 30
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: chromium-desktop, engine: chromium}
          - {profile: firefox-desktop, engine: firefox}
          - {profile: webkit-phone, engine: webkit}
          - {profile: webkit-tablet, engine: webkit}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: '.node-version', cache: npm}
      - run: npm ci
      - name: Install pinned test-only browser driver outside application dependency tree
        run: npm install --prefix /tmp/segment03-tools --ignore-scripts --save-exact playwright@1.57.0
      - name: Install browser and host dependencies
        run: |
          sudo sed -i 's/^deb /# deb /' /etc/apt/sources.list.d/google-chrome.list 2>/dev/null || true
          /tmp/segment03-tools/node_modules/.bin/playwright install --with-deps ${{ matrix.engine }}
      - run: node scripts/exam-reliability/run-browser.cjs
        env:
          SEG03_BROWSER_PROFILE: ${{ matrix.profile }}
          SEG03_PLAYWRIGHT_PATH: /tmp/segment03-tools/node_modules/playwright
      - name: Preserve exact test tool resolution
        if: always()
        run: mkdir -p .segment03-results && cp /tmp/segment03-tools/package-lock.json .segment03-results/tools-${{ matrix.profile }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seg03-browser-${{ matrix.profile }}-${{ github.run_id }}
          path: .segment03-results
          include-hidden-files: true
          retention-days: 30
  gate:
    name: Segment 03 cumulative gate
    if: always()
    needs: [node, database, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: '.node-version'}
      - uses: actions/download-artifact@v4
        with:
          pattern: seg03-*-${{ github.run_id }}
          path: .segment03-results
          merge-multiple: true
      - name: Reject failed or skipped jobs, including infrastructure failures
        env:
          NODE_RESULT: ${{ needs.node.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$NODE_RESULT" = success && test "$DATABASE_RESULT" = success && test "$BROWSER_RESULT" = success
      - run: node scripts/exam-reliability/check-gate.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seg03-complete-evidence-${{ github.run_id }}
          path: .segment03-results
          include-hidden-files: true
          retention-days: 30
