name: Apply reviewed live simulation slider repair
on:
  push:
    branches: [fix/signal-noise-lesson-guide-alignment]
    paths: [.github/workflows/apply-signal-noise-slider-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'UpSkillSprint-Consulting/upskill-sprint' && github.ref == 'refs/heads/fix/signal-noise-lesson-guide-alignment'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/signal-noise-lesson-guide-alignment
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply hash-verified source patch and regression tests
        shell: bash
        run: |
          python - <<'PY'
          import base64,zlib,hashlib,subprocess
          from pathlib import Path
          expected={'lessons/lean-six-sigma/signal-or-noise-arl-nelson-rules-control-limit-design.html':'622c505d6e355d78070c086ac93d38baf8ef1ae2da4006ee6c0b6d211931297b','tests/signal-noise-lesson.test.js':'64e2d832ce2f8f06de347e9339d28c2cb0fdb119654b5f773309b02089025876','scripts/validate-signal-noise.cjs':'1f235e2d902700aa1981f16db1c0b5d811f50d4d421b15c24d5d20185df8b727'}
          for path,digest in expected.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path+' changed since review'
          encoded=''
          patch=zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest()=='38c7c25ffaade631d9ba27ce5887822790239812c6b512291f41759b8b91b8c4'
          subprocess.run(['git','apply','--check','--unidiff-zero','-'],input=patch,check=True)
          subprocess.run(['git','apply','--unidiff-zero','-'],input=patch,check=True)
          PY
          node --check scripts/validate-signal-noise.cjs
          node --test tests/signal-noise-lesson.test.js tests/signal-noise-simulation.test.js
          git diff --check
          git config user.name BigErnie
          git config user.email BigErnie@users.noreply.github.com
          git add lessons/lean-six-sigma/signal-or-noise-arl-nelson-rules-control-limit-design.html tests/signal-noise-lesson.test.js tests/signal-noise-simulation.test.js scripts/validate-signal-noise.cjs
          git commit -m "Make Points to simulate redraw live and guard Run/Clear against pending frames"
          git push origin HEAD:fix/signal-noise-lesson-guide-alignment
