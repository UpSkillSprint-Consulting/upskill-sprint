name: Verify rebuilt PR165 Batch 6
on:
  push:
    branches: ['audit/pr165-batch6-publish']
    paths: ['.github/workflows/pr165-b6-rebuilt.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Verify transport and apply to exact PR baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b6-proof"
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,subprocess
          assert os.environ['GITHUB_REF']=='refs/heads/audit/pr165-batch6-publish'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'b6-proof'
          parts=[pathlib.Path(f'.github/b6-rebuilt-{i}.txt').read_text().strip() for i in range(1,5)]
          assert [len(p) for p in parts]==[16000,16000,16000,688]
          packed=base64.b64decode(''.join(parts),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='90340b4a710839b9e8eba1d8845545d79f50f147d344e01c06e2f00ed06e16bf'
          raw=lzma.decompress(packed)
          assert hashlib.sha256(raw).hexdigest()=='e22c7e4a9255c6debe8f31f28475511f33ba7e64222e141558b53018e4048ba4'
          p=json.loads(raw); assert p['baseline']=='25d47ccfd57b6b4ae49c322650148fac5008caad'
          assert len(p['manifest'])==26
          for name in p['manifest']:
              n=pathlib.PurePosixPath(name)
              assert not n.is_absolute() and '..' not in n.parts and not name.startswith('.github/')
          (out/'payload.json').write_bytes(raw)
          subprocess.run(['git','checkout','--detach',p['baseline']],check=True)
          for name,h in p['manifest'].items():
              f=pathlib.Path(name); actual=hashlib.sha256(f.read_bytes()).hexdigest() if f.exists() else None
              assert actual==h['before'],f'Baseline changed: {name}'
          patch=out/'change.patch';patch.write_text(p['patch'],newline='')
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          for key in ['bankRecipe','wireRecipe']:
              f=out/(key+'.cjs');f.write_text(p[key]);subprocess.run(['node',str(f)],check=True)
          PY
      - name: Install locked dependencies
        run: npm ci
      - name: Regenerate assets and verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-mbb160-assets.mjs | tee "$RUNNER_TEMP/b6-proof/regeneration.log"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'b6-proof';p=json.loads((out/'payload.json').read_text())
          proof={}
          for name,h in p['manifest'].items():
              actual=hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
              assert actual==h['after'],f'Candidate hash mismatch: {name}'
              proof[name]=actual
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())<=set(p['manifest'])
          (out/'verified-files.json').write_text(json.dumps(proof,indent=2))
          print('26/26 candidate file hashes match')
          PY
          git diff --check
      - name: Targeted MBB and feedback regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 tests/*mbb*.test.js tests/*feedback*.test.js | tee "$RUNNER_TEMP/b6-proof/regression.log"
      - name: Commit verified paths to candidate only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'b6-proof';p=json.loads((out/'payload.json').read_text())
          log=(out/'regression.log').read_text()
          for s in ['# tests 302','# pass 302','# fail 0','# cancelled 0','# skipped 0']: assert s in log,s
          subprocess.run(['git','add','--',*p['manifest']],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==set(p['manifest'])
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==p['baseline']
          PY
          git config user.name 'upskillsprint-agent'
          git config user.email 'skillsprintconsulting@gmail.com'
          git commit -m 'fix: restore MBB Batch 6 audit and correct Q150 answer key'
          git push origin HEAD:refs/heads/audit/pr165-b6-rebuilt-candidate
          git rev-parse HEAD > "$RUNNER_TEMP/b6-proof/commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr165-b6-rebuilt-proof
          path: |
            ${{ runner.temp }}/b6-proof/verified-files.json
            ${{ runner.temp }}/b6-proof/regression.log
            ${{ runner.temp }}/b6-proof/regeneration.log
            ${{ runner.temp }}/b6-proof/commit.txt
          retention-days: 14
