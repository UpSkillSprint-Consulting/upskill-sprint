name: Integrate and validate MBB Set 3 Batch 5
on:
  push:
    branches: ['automation/mbb-set3-batch5']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mbb-set3-batch5-polish
  cancel-in-progress: true
jobs:
  integrate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair shared-renderer compatibility without changing question content
        run: |
          git fetch origin audit/mbb-set3-batch1-q001-q025
          test "$(git rev-parse FETCH_HEAD)" = '2d4307bbb248363ca3313b1db0d93cc12bb887f5'
          git checkout --detach FETCH_HEAD
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test-bank.html');s=p.read_text();old="    if(!chart)return '';\n    var inner='';"
          new="""    if(!chart)return '';
              // Rich chart schemas retain an exact numerical alternative. Legacy-only
              // consumers must not reinterpret them as an older chart schema or invent
              // placeholder curves. The full player uses its scoped graphical renderer.
              if(chart.evidence && Array.isArray(chart.evidence.columns) && Array.isArray(chart.evidence.rows)){
                var ev=chart.evidence, title=ev.title||chart.title||'Chart data';
                return '<div class="tb-chart-evidence-fallback"><p>'+esc(chart.altText||'')+'</p>'+
                  '<p>Numerical chart evidence. Scroll horizontally when needed.</p>'+
                  '<div role="region" tabindex="0" aria-label="'+esc(title)+'" style="max-width:100%;overflow-x:auto">'+
                  '<table class="tb-q-data-table"><caption>'+esc(title)+'</caption><thead><tr>'+
                  ev.columns.map(function(c){return '<th scope="col">'+esc(c)+'</th>';}).join('')+
                  '</tr></thead><tbody>'+ev.rows.map(function(row){return '<tr>'+row.map(function(cell,i){
                    return i===0?'<th scope="row">'+esc(cell)+'</th>':'<td>'+esc(cell)+'</td>';
                  }).join('')+'</tr>';}).join('')+'</tbody></table></div></div>';
              }
              var inner='';"""
          assert s.count(old)==1;p.write_text(s.replace(old,new))
          PY
          cat > tests/test-bank-mbb-set3-batch5-fallback.test.js <<'JS'
          'use strict';
          const test=require('node:test'),assert=require('node:assert/strict'),fs=require('node:fs'),path=require('node:path');
          const {JSDOM,VirtualConsole}=require('jsdom');
          const root=path.join(__dirname,'..'),read=p=>fs.readFileSync(path.join(root,p),'utf8');
          async function withPage(run){
            let html=read('test-bank.html');
            for(const file of ['test-bank-mbb-set1.js','test-bank-mbb-set2.js','test-bank-mbb-set3.js'])
              html=html.replace('<script src="/'+file+'"></script>','<script>'+read(file)+'</script>');
            const errors=[],observers=[],vc=new VirtualConsole();vc.on('jsdomError',e=>errors.push(e.message));
            const dom=new JSDOM(html,{url:'https://upskillsprint.com/test-bank.html',runScripts:'dangerously',pretendToBeVisual:true,virtualConsole:vc,beforeParse(w){
              w.HTMLElement.prototype.scrollIntoView=function(){};
              const Native=w.MutationObserver;w.MutationObserver=class extends Native{constructor(cb){super(cb);observers.push(this);}};
            }});
            try{await new Promise(resolve=>dom.window.addEventListener('load',resolve));await run(dom.window);assert.deepEqual(errors,[]);}
            finally{observers.forEach(o=>o.disconnect());dom.window.close();}
          }
          test('Batch 5 numerical alternatives remain exact and accessible without the optional graphical module',()=>withPage(w=>{
            assert.equal(w.__MBBSet3Batch5UI,undefined);
            const items=w.__TB.EXAMS.mbb.sets[3].slice(100,125).filter(q=>q.chart&&q.chart.evidence);assert.equal(items.length,8);
            for(const q of items){
              const rendered=w.__TB.renderQuestionChart(q.chart),host=w.document.createElement('div');host.innerHTML=rendered;
              assert.doesNotMatch(rendered,/NaN|undefined|<svg/);assert.equal(host.querySelector('caption').textContent,q.chart.evidence.title);
              assert.equal(host.querySelectorAll('thead th[scope="col"]').length,q.chart.evidence.columns.length);
              const rows=Array.from(host.querySelectorAll('tbody tr'),r=>Array.from(r.children,c=>c.textContent));
              assert.deepEqual(rows,JSON.parse(JSON.stringify(q.chart.evidence.rows)).map(r=>r.map(String)));
              assert.ok(host.querySelector('[role="region"][tabindex="0"]'));assert.equal(host.querySelectorAll('tbody th[scope="row"]').length,rows.length);
            }
            const q=items[0],unsafe={...q.chart,evidence:{...q.chart.evidence,title:'<script>not executable</script>'}};
            assert.match(w.__TB.renderQuestionChart(unsafe),/&lt;script/);
          }));
          test('The normal player still uses all eight graphical Batch 5 visuals, not their degraded-mode tables alone',()=>withPage(w=>{
            w.eval(read('test-bank-mbb-set3-batch5-ui.js'));
            const items=w.__TB.EXAMS.mbb.sets[3].slice(100,125).filter(q=>q.chart&&q.chart.evidence);assert.equal(items.length,8);
            for(const q of items)for(const review of [false,true]){
              const rendered=w.__TB.renderQuestionContent(q,review);
              assert.match(rendered,/mbbs3b5-question/);assert.match(rendered,/<svg/);assert.doesNotMatch(rendered,/tb-chart-evidence-fallback|NaN|undefined/);
              assert.ok(rendered.includes(q.chart.evidence.title));
            }
          }));
          JS
          node --check tests/test-bank-mbb-set3-batch5-fallback.test.js
      - name: Commit repair to PR170 only; no merge or deployment
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-bank.html tests/test-bank-mbb-set3-batch5-fallback.test.js
          git diff --cached --check
          git commit -m 'fix: preserve statistical evidence in legacy and degraded chart rendering'
          git push origin HEAD:refs/heads/audit/mbb-set3-batch1-q001-q025
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Export exact revised workspace
        run: |
          mkdir -p /tmp/mbb5-workspace
          git rev-parse HEAD > /tmp/mbb5-workspace/commit.txt
          git archive --format=tar HEAD | gzip > /tmp/mbb5-workspace/repository.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: mbb-set3-batch5-workspace
          path: /tmp/mbb5-workspace
          retention-days: 14
  regression:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Independent calculations, shared-renderer compatibility and all-option grading
        run: |
          mkdir -p audit-results-batch5
          git rev-parse HEAD > audit-results-batch5/tested-commit.txt
          set -o pipefail
          node --test --test-concurrency=1 tests/test-bank-mbb-set3-batch5*.test.js tests/test-bank-mbb-set3.test.js | tee audit-results-batch5/batch5-tests.txt
      - name: Complete repository regression
        run: timeout 900 node --test --test-concurrency=2 tests/*.test.js > audit-results-batch5/full-regression.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mbb-set3-batch5-regression
          path: audit-results-batch5
          retention-days: 14
  browsers:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        layout: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright @axe-core/playwright
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Answer and reopen all 25 items and inspect all nine statistical visuals
        env:
          AUDIT_ENGINE: ${{ matrix.engine }}
          AUDIT_LAYOUT: ${{ matrix.layout }}
        run: |
          mkdir -p audit-results-batch5
          git rev-parse HEAD > audit-results-batch5/tested-commit.txt
          node scripts/audit-mbb-set3-batch5.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mbb-set3-batch5-${{ matrix.engine }}-${{ matrix.layout }}
          path: audit-results-batch5
          retention-days: 14
