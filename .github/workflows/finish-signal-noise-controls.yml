name: Finish Signal or Noise control contrast
on:
  push:
    branches: ['fix/signal-noise-lesson-guide-alignment']
    paths: ['.github/workflows/finish-signal-noise-controls.yml']
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/signal-noise-lesson-guide-alignment
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Preserve content while restoring visible control boundaries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lessons/lean-six-sigma/signal-or-noise-arl-nelson-rules-control-limit-design.html')
          s=p.read_text()
          old='html[data-theme="dark"] #quiz .lesson-kicker { color:#67d4df; }'
          new='html[data-theme="dark"] #lesson-content input[type="range"] { background:#738ca8 !important; }\nhtml[data-theme="dark"] #lesson-content select { border-color:#738ca8 !important; }\n'+old
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          p=Path('scripts/validate-signal-noise.cjs')
          s=p.read_text()
          old=" return [...document.querySelectorAll(selectors)].filter(e=>e.getClientRects().length&&e.textContent.trim()).map(e=>({id:e.id,cls:e.className,text:e.textContent.slice(0,60),ratio:ratio(rgb(getComputedStyle(e).color),bg(e))})).filter(x=>x.ratio<4.49);"
          new=""" const failures=[...document.querySelectorAll(selectors)].filter(e=>e.getClientRects().length&&e.textContent.trim()).map(e=>({id:e.id,cls:e.className,text:e.textContent.slice(0,60),ratio:ratio(rgb(getComputedStyle(e).color),bg(e))})).filter(x=>x.ratio<4.49);
           for(const e of document.querySelectorAll('#lesson-content input[type=range],#lesson-content select')){
             if(!e.getClientRects().length)continue;
             const c=getComputedStyle(e),border=e.tagName==='SELECT';
             const control=rgb(border?c.borderTopColor:c.backgroundColor);
             const contrast=ratio(control,bg(e.parentElement));
             if(contrast<2.99)failures.push({id:e.id,type:'control-boundary',ratio:contrast});
             if(border){const inner=ratio(control,bg(e));if(inner<2.99)failures.push({id:e.id,type:'inner-control-boundary',ratio:inner});}
           }
           return failures;"""
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          node --test tests/signal-noise-lesson.test.js
          node --check scripts/validate-signal-noise.cjs
          git diff --check
          git config user.name BigErnie
          git config user.email BigErnie@users.noreply.github.com
          git add lessons/lean-six-sigma/signal-or-noise-arl-nelson-rules-control-limit-design.html scripts/validate-signal-noise.cjs
          git commit -m "Restore dark lesson slider tracks and select boundaries with contrast regression coverage"
          git push origin HEAD:fix/signal-noise-lesson-guide-alignment
