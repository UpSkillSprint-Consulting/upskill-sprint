name: Prepare Segment 04 membership refinement
on:
  pull_request:
permissions:
  contents: read
jobs:
  prepare:
    if: github.event.pull_request.number == 173 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/segment-04-question-identity'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const assert = require('node:assert/strict');
            const crypto = require('node:crypto');
            const repo = {owner:context.repo.owner,repo:context.repo.repo};
            const edits = [
              {path:'test-bank-question-registry.js',before:"if (setId !== 'bank' && memberships.get(id).indexOf(setId) < 0)",after:"if (location !== 'bank' && memberships.get(id).indexOf(setId) < 0)",old:'fdc34961b2801ac30039be1398c4fbd5e88dae9d',sha:'d20a8fc123c938fdacf534ba84503818dad9e759'},
              {path:'tests/test-bank-segment04-identity.test.js',before:"  exam.sets[2].push(rows[0]);assert.ok(codes(api.validate('cssbb')).includes('DUPLICATE_MEMBERSHIP'));",after:"  exam.sets.bank=[rows[0]];assert.equal(api.validate('cssbb').valid,true);\n  assert.deepEqual(plain(api.membershipsFor('cssbb',rows[0].qid)),['1','2','bank'],'A set named bank is distinct from the bank mirror');\n  exam.sets[2].push(rows[0]);assert.ok(codes(api.validate('cssbb')).includes('DUPLICATE_MEMBERSHIP'));",old:'4f22acf5dd66d0583fb83057dbdf973720e5e7f3',sha:'edab8531b313c180b93295348876623ce9350825'}
            ];
            const hash = text => {const b=Buffer.from(text);return crypto.createHash('sha1').update(Buffer.from('blob '+b.length+'\0')).update(b).digest('hex');};
            const entries=[];
            for(const edit of edits) {
              const source=fs.readFileSync(edit.path,'utf8');
              assert.equal(hash(source),edit.old);
              assert.equal(source.split(edit.before).length,2);
              const content=source.replace(edit.before,edit.after);
              assert.equal(hash(content),edit.sha);
              const result=await github.rest.git.createBlob({...repo,content,encoding:'utf-8'});
              assert.equal(result.data.sha,edit.sha);
              entries.push({path:edit.path,sha:edit.sha});
            }
            const record={parent:context.payload.pull_request.head.sha,entries,refsUpdated:false};
            fs.writeFileSync('/tmp/segment04-membership.json',JSON.stringify(record,null,2)+'\n');
            core.info(JSON.stringify(record));
            // Only immutable blobs were created. The connector separately verifies
            // them and advances the feature branch; no ref or main write occurs here.
      - uses: actions/upload-artifact@v4
        with:
          name: segment04-membership-${{ github.run_id }}
          path: /tmp/segment04-membership.json
          retention-days: 7
