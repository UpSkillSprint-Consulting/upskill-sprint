name: Integrate and validate MBB Set 3 Batch 6
on:
  push:
    branches: ['automation/mbb-set3-batch6']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mbb-set3-batch6-refinement
  cancel-in-progress: false
jobs:
  integrate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Finalize only the authorized unchanged Batch 6 review head
        run: |
          cp audit-staging/batch6-content.py /tmp/b6-draft.py
          git fetch origin audit/mbb-set3-batch1-q001-q025
          test "$(git rev-parse FETCH_HEAD)" = '7576b905681a40567b619127acbeec06688654f8'
          git checkout --detach FETCH_HEAD
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          ns={};exec(compile(Path('/tmp/b6-draft.py').read_text(),'/tmp/b6-draft.py','exec'),ns)
          drafts={p['number']:p for p in ns['P']};D=Path('docs/audits/mbb-set3-batch06')
          p=Path('test-bank-mbb-set3.js');s=p.read_text();starts=[m.start() for m in re.finditer(r'^  \{$',s,re.M)]
          bank=json.loads(subprocess.check_output(['node','-e',"let c={window:{}};require('vm').runInNewContext(require('fs').readFileSync('test-bank-mbb-set3.js','utf8'),c);console.log(JSON.stringify(c.window.MBB_SET3))"],text=True))
          # Keep a natural length distribution rather than making every key the shorter choice.
          for number in [127,131,133,136,138,142,149]:
              q=bank[number-1];q['options'][q['answer']]=drafts[number]['options'][q['answer']]
          additions={
          'blocks':dict(title='NIST: Randomized block designs',url='https://www.itl.nist.gov/div898/handbook/pri/section3/pri332.htm',locator='5.3.3.2; balanced coverage, within-block comparisons and additive block model'),
          'splitplot':dict(title='Minitab: Create 2-Level Split-Plot Design — All statistics',url='https://support.minitab.com/en-us/minitab/help-and-how-to/statistical-modeling/doe/how-to/factorial/create-factorial-design/create-2-level-split-plot/examine-the-design/all-statistics/',locator='Whole plots, hard-to-change factors, whole-plot replicates and blocks'),
          'dsd-runs':dict(title='Minitab: Available definitive screening designs',url='https://support.minitab.com/en-us/minitab/help-and-how-to/statistical-modeling/doe/supporting-topics/factorial-and-screening-designs/available-definitive-screening-designs/',locator='Single replicate, all continuous factors: 7–8 factors, 17 runs')}
          for number,key in [(148,'splitplot'),(149,'blocks'),(150,'dsd-runs')]:bank[number-1]['auditSources'].append(additions[key])
          rev=json.loads((D/'revisions.json').read_text())
          for row in rev:row['corrected']=bank[row['number']-1]
          (D/'revisions.json').write_text(json.dumps(rev,ensure_ascii=False,indent=2)+'\n')
          src=json.loads((D/'sources.json').read_text());src['sources'].update(additions);(D/'sources.json').write_text(json.dumps(src,ensure_ascii=False,indent=2)+'\n')
          replacement=''.join('  '+json.dumps(q,ensure_ascii=False,indent=2).replace('\n','\n  ')+',\n' for q in bank[125:150])
          updated=s[:starts[125]]+replacement+s[starts[150]:];st=[m.start() for m in re.finditer(r'^  \{$',updated,re.M)]
          assert updated[:st[125]]==s[:starts[125]] and updated[st[150]:]==s[starts[150]:]
          p.write_text(updated)
          test=Path('tests/test-bank-mbb-set3-batch5-fallback.test.js').read_text().replace('Batch 5','Batch 6').replace('Batch5','Batch6').replace('batch5','batch6').replace('mbbs3b5','mbbs3b6').replace('.slice(100,125)','.slice(125,150)').replace('items.length,8','items.length,5').replace('all eight graphical','all five graphical')
          Path('tests/test-bank-mbb-set3-batch6-fallback.test.js').write_text(test)
          p=Path('tests/test-bank-mbb-set3-batch6-audit.test.js');s=p.read_text().replace('assert.ok(longest.length<20)','assert.ok(longest.length>=3 && longest.length<=10)');p.write_text(s)
          PY
          node --check test-bank-mbb-set3.js
          node --check tests/test-bank-mbb-set3-batch6-fallback.test.js
      - run: npm ci
      - name: Recheck revised choices, calculations and both graphical paths
        run: node --test --test-concurrency=1 tests/test-bank-mbb-set3-batch6*.test.js
      - name: Push only reviewed corrections to PR170; no merge or deployment
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-bank-mbb-set3.js tests/test-bank-mbb-set3-batch6*.test.js docs/audits/mbb-set3-batch06/revisions.json docs/audits/mbb-set3-batch06/sources.json
          git diff --cached --check
          git commit -m 'audit: complete Batch 6 choice balancing, source alignment and degraded-rendering checks'
          git push origin HEAD:refs/heads/audit/mbb-set3-batch1-q001-q025
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Export exact workspace
        if: always()
        run: |
          mkdir -p /tmp/mbb6-workspace
          git rev-parse HEAD > /tmp/mbb6-workspace/commit.txt
          tar --exclude=.git --exclude=node_modules -czf /tmp/mbb6-workspace/repository.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mbb-set3-batch6-workspace
          path: /tmp/mbb6-workspace
          retention-days: 14
  regression:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Independent calculations, all-option grading, fallback and full Set 3 traversal
        run: |
          mkdir -p audit-results-batch6
          git rev-parse HEAD > audit-results-batch6/tested-commit.txt
          set -o pipefail
          node --test --test-concurrency=1 tests/test-bank-mbb-set3-batch6*.test.js tests/test-bank-mbb-set3.test.js | tee audit-results-batch6/batch6-tests.txt
      - name: Complete repository regression
        run: timeout 900 node --test --test-concurrency=2 tests/*.test.js > audit-results-batch6/full-regression.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mbb-set3-batch6-regression
          path: audit-results-batch6
          retention-days: 14
  browsers:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        layout: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright @axe-core/playwright
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Answer, reopen and inspect each item and all eight visual questions
        env:
          AUDIT_ENGINE: ${{ matrix.engine }}
          AUDIT_LAYOUT: ${{ matrix.layout }}
        run: |
          mkdir -p audit-results-batch6
          git rev-parse HEAD > audit-results-batch6/tested-commit.txt
          node scripts/audit-mbb-set3-batch6.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mbb-set3-batch6-${{ matrix.engine }}-${{ matrix.layout }}
          path: audit-results-batch6
          retention-days: 14
