name: Import ANOVA one-stop-shop lesson

on:
  push:
    branches:
      - test
    paths:
      - .github/workflows/import-anova-one-stop-shop.yml

permissions:
  contents: write

jobs:
  import-lesson:
    runs-on: ubuntu-latest
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 0
          persist-credentials: true

      - name: Assemble approved lesson
        shell: bash
        run: |
          set -euo pipefail
          cat .import-parts/anova-one-stop-shop/bundle-*.part > /tmp/anova-one-stop-shop.b64
          base64 --decode /tmp/anova-one-stop-shop.b64 > /tmp/anova-one-stop-shop.tar.gz
          echo "fc76b325c9e1f6103ebafc71933a9928002179f868d53e4b99603e1f98c38d31  /tmp/anova-one-stop-shop.tar.gz" | sha256sum --check
          tar -xzf /tmp/anova-one-stop-shop.tar.gz -C .
          echo "6db09109ad9aa2207714d97b634dae359f82625d830abaafab70336f38653f05  lessons/statistics/anova-analysis-one-stop-shop.html" | sha256sum --check

      - name: Register lesson in library and sitemap
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          library_path = Path('chi-square-lesson-library.js')
          library = library_path.read_text(encoding='utf-8')
          marker = "data-anova-analysis-one-stop-shop"
          if marker not in library:
              needle = "  const LESSONS = [\n"
              entry = '''    {
                marker: 'data-anova-analysis-one-stop-shop',
                sectionId: 'statistics',
                path: '/lessons/statistics/anova-analysis-one-stop-shop',
                topic: 'statistics',
                level: 'intermediate',
                interactive: 'true',
                search: 'anova analysis of variance one way two way factorial welch repeated measures ancova manova mancova interaction f statistic p value effect size tukey post hoc excel analysis toolpak minitab statistics',
                meta: '<span>Intermediate</span><span>Interactive</span><span>90–110 min</span><span>Excel + Minitab</span>',
                title: 'ANOVA Analysis: One-Stop Masterclass',
                description: 'Select, calculate, diagnose and interpret one-way, factorial, repeated-measures, ANCOVA, MANOVA and MANCOVA—with Excel and Minitab guidance.'
              },
          '''
              if needle not in library:
                  raise SystemExit('Could not find LESSONS array insertion point')
              library = library.replace(needle, needle + entry, 1)
              library_path.write_text(library, encoding='utf-8')

          sitemap_path = Path('sitemap.xml')
          sitemap = sitemap_path.read_text(encoding='utf-8')
          url = 'https://upskillsprint.com/lessons/statistics/anova-analysis-one-stop-shop'
          if url not in sitemap:
              row = f'  <url><loc>{url}</loc><priority>0.8</priority></url>\n'
              if '</urlset>' not in sitemap:
                  raise SystemExit('Could not find sitemap closing tag')
              sitemap = sitemap.replace('</urlset>', row + '</urlset>', 1)
              sitemap_path.write_text(sitemap, encoding='utf-8')
          PY

      - name: Validate lesson and integrations
        shell: bash
        run: |
          set -euo pipefail
          node --check chi-square-lesson-library.js
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          lesson_path = Path('lessons/statistics/anova-analysis-one-stop-shop.html')
          text = lesson_path.read_text(encoding='utf-8')
          required = [
              '<!DOCTYPE html>',
              'UPSKILLSPRINT_LESSON_META',
              '<main id="lesson-content">',
              '<article class="lesson-wrapper">',
              '<nav class="lesson-toc"',
              'id="learning-objectives"',
              'id="key-concepts"',
              'id="worked-example"',
              'id="practice"',
              'id="quiz"',
              'id="summary"',
              '<footer class="lesson-footer">',
              '/assets/logo-icon.png',
              '/theme.js',
              'data-theme-toggle="true"'
          ]
          missing_required = [item for item in required if item not in text]
          if missing_required:
              raise SystemExit(f'Missing required lesson hooks: {missing_required}')
          if re.search(r'\bonclick\s*=', text, flags=re.I):
              raise SystemExit('Inline onclick handler found')

          class AuditParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.fragment_links = []
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if 'id' in values:
                      self.ids.append(values['id'])
                  href = values.get('href', '')
                  if href.startswith('#') and len(href) > 1:
                      self.fragment_links.append(href[1:])

          parser = AuditParser()
          parser.feed(text)
          duplicates = sorted({value for value in parser.ids if parser.ids.count(value) > 1})
          if duplicates:
              raise SystemExit(f'Duplicate HTML IDs found: {duplicates}')
          missing_fragments = sorted(set(parser.fragment_links) - set(parser.ids))
          if missing_fragments:
              raise SystemExit(f'Broken internal anchors: {missing_fragments}')

          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', text, flags=re.I | re.S)
          if not scripts:
              raise SystemExit('No inline JavaScript found')
          for index, script in enumerate(scripts, 1):
              Path(f'/tmp/anova-inline-{index}.js').write_text(script, encoding='utf-8')

          library = Path('chi-square-lesson-library.js').read_text(encoding='utf-8')
          if 'data-anova-analysis-one-stop-shop' not in library:
              raise SystemExit('Lesson library marker missing')
          if "path: '/lessons/statistics/anova-analysis-one-stop-shop'" not in library:
              raise SystemExit('Lesson library path missing')

          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')
          if 'https://upskillsprint.com/lessons/statistics/anova-analysis-one-stop-shop' not in sitemap:
              raise SystemExit('Sitemap URL missing')

          print(f'Validated {len(parser.ids)} unique IDs, {len(parser.fragment_links)} internal links, and {len(scripts)} inline script block(s).')
          PY
          for script in /tmp/anova-inline-*.js; do node --check "$script"; done

      - name: Commit final lesson files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .import-parts/anova-one-stop-shop
          rm -f .github/workflows/import-anova-one-stop-shop.yml
          git config user.name "upskillsprint-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add ANOVA analysis one-stop-shop lesson"
          git push origin HEAD:test
