name: Apply reviewed MBB Set 3 batch 1 fixes
on:
  push:
    branches: ['automation/mbb-set3-batch1-finalize']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/mbb-set3-batch1-q001-q025
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve test-scroll races without bypassing click actionability
        run: |
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const f='scripts/audit-mbb-set3-batch1.mjs';let s=fs.readFileSync(f,'utf8');
          const anchor='async function geometry(page,selector)';assert.equal(s.split(anchor).length,2);
          const helper=`// Bring the intended control into view, then click normally. This avoids racing
          // Playwright auto-scroll against the player's smooth review navigation in WebKit.
          // No force click, DOM click dispatch, or application event handler is bypassed.
          async function stableClick(locator){
            await locator.evaluate(el=>el.scrollIntoView({behavior:'instant',block:'center',inline:'nearest'}));
            await new Promise(resolve=>setTimeout(resolve,180));
            await locator.click();
          }
          `;
          s=s.replace(anchor,helper+anchor);
          for(const target of ["details.locator('summary')","card.locator('.tb-quality-details summary')","card.locator('[data-report-question]')","box.locator('[data-prepare-report]')"]){const old='await '+target+'.click()';assert.ok(s.includes(old));s=s.replaceAll(old,'await stableClick('+target+')');}
          fs.writeFileSync(f,s);
          NODE
          node --check scripts/audit-mbb-set3-batch1.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audit-mbb-set3-batch1.mjs
          git commit -m 'test: settle WebKit review controls before normal pointer clicks'
          git push origin HEAD:audit/mbb-set3-batch1-q001-q025
      - name: Capture applied source
        if: always()
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          git archive --format=tar HEAD | gzip > evidence/repository.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mbb-set3-finalization-source
          path: evidence
          retention-days: 7
