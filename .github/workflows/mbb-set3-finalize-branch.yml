name: Apply reviewed MBB Set 3 batch 1 fixes
on:
  push:
    branches: ['automation/mbb-set3-batch1-finalize']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/mbb-set3-batch1-q001-q025
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact reviewed changes only
        run: |
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          function edit(f,old,replacement){let s=fs.readFileSync(f,'utf8');assert.equal(s.split(old).length,2,'Unique anchor in '+f);fs.writeFileSync(f,s.replace(old,replacement));}
          edit('test-bank.html',"  function formatNoteFor(e){\n    var plan=setPlan(e,selectedSet),available=activeBank(e).length;", "  function formatNoteFor(e){\n    var plan=setPlan(e,selectedSet),available=activeBank(e).length;\n    if(current==='mbb'&&selectedSet==='3')return 'Set 3 contains '+available+' original practice questions. Its Full Exam uses all '+available+' items at a practice pace of 90 seconds per question. This analytics-heavy practice bank is not a replica of the official ASQ examination format or domain weighting.';");
          edit('test-bank-mbb-set3-batch1-ui.js','document.head.appendChild(style);',`style.textContent+='\n.tb-quiz:has(.mbb3-question) [data-next],.tb-quiz:has(.mbb3-question) [data-submit]{background:#0b5464!important;color:#fff!important}.tb-quiz:has(.mbb3-question) [data-flag].on{background:#7c4a00!important;border-color:#7c4a00!important;color:#fff!important}.mbb3-scroll-hint{font-size:12px;line-height:1.5;color:var(--ink-soft);margin:6px 0 14px}\n';document.head.appendChild(style);`.replace(/\n/g,'\\n').replace("style.textContent+='\\n","style.textContent+='\\n").replace("\\n';document","\\n';document"));
          // The CSS addition above is JavaScript source with escaped newlines, not literal string-line breaks.
          edit('scripts/audit-mbb-set3-batch1.mjs',"await page.locator('#tb-answer-review').waitFor();", "await page.locator('[data-open-review=\"all\"]').click();await page.locator('#tb-answer-review').waitFor();");
          edit('scripts/audit-mbb-set3-batch1.mjs',"assert.ok(await page.locator('#tb-timer').isVisible());", "assert.ok(await page.locator('#tb-timer').isVisible());const clock=await page.locator('#tb-timer').innerText();await page.waitForTimeout(1150);assert.notEqual(await page.locator('#tb-timer').innerText(),clock);");
          edit('scripts/audit-mbb-set3-batch1.mjs',"if(report.failures.length)process.exitCode=1;", "const bad=report.cases.filter(c=>c.geometry&&(c.geometry.pageOverflow||c.geometry.clipped.length||c.geometry.svgText.length||!c.geometry.selectedAnnounced)||(c.rationales&&!c.rationales.every(Boolean))||(c.axe&&c.axe.length));\nif(report.failures.length||report.pageErrors.length||bad.length)process.exitCode=1;\nconsole.log('Recorded quality-gate failures:',bad.length);");
          edit('scripts/audit-mbb-set3-batch1.mjs',"path:path.join(out,label+'-'+theme+'.png')", "path:path.join(out,label+'-'+theme+'.png'),style:'header.site{position:relative!important;top:auto!important}'");
          edit('scripts/audit-mbb-set3-batch1.mjs',"path:path.join(out,engine+'-'+layout+'-q'+String(i+1).padStart(2,'0')+'-review-'+theme+'.png')", "path:path.join(out,engine+'-'+layout+'-q'+String(i+1).padStart(2,'0')+'-review-'+theme+'.png'),style:'header.site{position:relative!important;top:auto!important}'");
          fs.appendFileSync('tests/test-bank-mbb-set3-batch1-audit.test.js',`\ntest('Set 3 overview states the actual practice format rather than inheriting Set 1 copy',()=>{\n const html=fs.readFileSync(path.join(root,'test-bank.html'),'utf8');\n assert.match(html,/selectedSet==='3'\\)return 'Set 3 contains '/);\n assert.match(html,/not a replica of the official ASQ examination format or domain weighting/);\n});\n`);
          NODE
          node --check test-bank-mbb-set3-batch1-ui.js
          node --check scripts/audit-mbb-set3-batch1.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-bank.html test-bank-mbb-set3-batch1-ui.js scripts/audit-mbb-set3-batch1.mjs tests/test-bank-mbb-set3-batch1-audit.test.js
          git commit -m 'fix: readable Batch 1 controls and accurate Set 3 practice format'
          git push origin HEAD:audit/mbb-set3-batch1-q001-q025
      - name: Capture applied source
        if: always()
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          git archive --format=tar HEAD | gzip > evidence/repository.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mbb-set3-finalization-source
          path: evidence
          retention-days: 7
