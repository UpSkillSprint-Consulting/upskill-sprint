name: Apply reviewed MBB Set 3 batch 1 fixes
on:
  push:
    branches: ['automation/mbb-set3-batch1-finalize']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/mbb-set3-batch1-q001-q025
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolate component namespace and expanded metadata contrast
        run: |
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          for(const file of ['test-bank-mbb-set3-batch1-ui.js','scripts/audit-mbb-set3-batch1.mjs','tests/test-bank-mbb-set3-batch1-feedback.test.js']){
            let s=fs.readFileSync(file,'utf8');assert.ok(s.includes('mbb3-'));s=s.replaceAll('mbb3-','mbbs3b1-');
            if(file.endsWith('-ui.js')){
              const anchor='@media(max-width:560px)';assert.equal(s.split(anchor).length,2);
              s=s.replace(anchor,'.tb-review-card:has(.mbbs3b1-question) .tb-quality-details p,.tb-review-card:has(.mbbs3b1-question) .tb-quality-details ul{color:var(--ink)!important}\n'+anchor);
            }
            fs.writeFileSync(file,s);
          }
          NODE
          node --check test-bank-mbb-set3-batch1-ui.js
          node --check scripts/audit-mbb-set3-batch1.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-bank-mbb-set3-batch1-ui.js scripts/audit-mbb-set3-batch1.mjs tests/test-bank-mbb-set3-batch1-feedback.test.js
          git commit -m 'fix: isolate Set 3 table layout from legacy Set 2 styles'
          git push origin HEAD:audit/mbb-set3-batch1-q001-q025
      - name: Capture applied source
        if: always()
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          git archive --format=tar HEAD | gzip > evidence/repository.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mbb-set3-finalization-source
          path: evidence
          retention-days: 7
