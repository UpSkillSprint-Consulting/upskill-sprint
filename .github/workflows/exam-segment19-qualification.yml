name: Exam qualification - Segment 19
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exam-segment19-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node-and-load:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: '.node-version', cache: npm}
      - run: npm ci
      - name: Segment 19 qualification contract and cumulative behavior
        run: |
          node --check scripts/exam-reliability/segment19-qualification.cjs
          node --check scripts/exam-reliability/run-segment19-load.cjs
          node --test --test-concurrency=1 tests/test-bank-segment19-qualification.test.js
          node --test --test-concurrency=1 \
            tests/test-bank-segment18-security-reset.test.js \
            tests/test-bank-segment17-ux-accessibility.test.js \
            tests/test-bank-segment16-new-only-allocation.test.js \
            tests/test-bank-segment15-session-handoff.test.js \
            tests/test-bank-segment14-incremental-sync.test.js \
            tests/test-bank-segment13-timing.test.js \
            tests/test-bank-segment12-session-lifecycle.test.js
          npm test
          git diff --check
      - name: Frozen workload qualification - 10k/100k history and 1k pending operations
        run: node scripts/exam-reliability/run-segment19-load.cjs | tee segment19-load.json
      - name: Production dependency gate
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: segment19-node-load-${{ github.run_id }}
          path: segment19-load.json
          retention-days: 30
  database-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.6
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: segment19_ci_only, POSTGRES_DB: segment03_test}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: '.node-version', cache: npm}
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Fresh install and cumulative database authorization/concurrency
        env:
          SEG03_ALLOW_DISPOSABLE_DB: '1'
          SEG03_DB_URL: postgresql://postgres:segment19_ci_only@127.0.0.1:5432/segment03_test
        run: |
          node scripts/exam-reliability/run-database.cjs
          node scripts/exam-reliability/run-segment14-database.cjs
          node scripts/exam-reliability/run-segment15-database.cjs
          node scripts/exam-reliability/run-segment16-database.cjs
          node scripts/exam-reliability/run-segment18-database.cjs
      - name: Backup and restore the fully migrated disposable database
        env: {PGPASSWORD: segment19_ci_only}
        run: |
          set -euo pipefail
          # Restore into a different clean database in the same disposable cluster.
          # The cumulative restricted-role suite above already verifies grants/RLS.
          # This recovery check deliberately excludes ownership/ACL statements so
          # infrastructure-specific dump ownership cannot mask schema recovery.
          pg_dump -h 127.0.0.1 -U postgres -d segment03_test \
            --format=plain --no-owner --no-privileges > /tmp/segment19.sql
          createdb -h 127.0.0.1 -U postgres segment19_restore
          psql -h 127.0.0.1 -U postgres -d segment19_restore \
            -v ON_ERROR_STOP=1 -f /tmp/segment19.sql
          test "$(psql -h 127.0.0.1 -U postgres -d segment19_restore -Atc "select count(*) from pg_tables where schemaname='public' and tablename in ('test_bank_learning_events','test_bank_progress_devices','test_bank_session_checkpoints','test_bank_data_control')")" = "4"
          for fn in fetch_test_bank_learning_events_incremental_v1 takeover_test_bank_session_v1 reserve_test_bank_new_questions_v2 delete_test_bank_learning_data_v1; do
            test "$(psql -h 127.0.0.1 -U postgres -d segment19_restore -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='$fn'")" -ge "1"
          done
          test "$(psql -h 127.0.0.1 -U postgres -d segment19_restore -Atc "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname in ('test_bank_learning_events','test_bank_progress_devices','test_bank_session_checkpoints','test_bank_data_control') and c.relrowsecurity")" = "4"
          pg_dump -h 127.0.0.1 -U postgres -d segment19_restore --schema-only --no-owner --no-privileges > segment19-restored-schema.sql
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: segment19-database-recovery-${{ github.run_id }}
          path: segment19-restored-schema.sql
          retention-days: 30
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: chromium-desktop, engine: chromium}
          - {profile: firefox-desktop, engine: firefox}
          - {profile: webkit-phone, engine: webkit}
          - {profile: webkit-tablet, engine: webkit}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: '.node-version', cache: npm}
      - run: npm ci
      - run: npm install --prefix /tmp/segment19-tools --ignore-scripts --save-exact playwright@1.57.0
      - run: /tmp/segment19-tools/node_modules/.bin/playwright install --with-deps ${{ matrix.engine }}
      - name: Five-certification real-page browser qualification
        env:
          SEG03_BROWSER_PROFILE: ${{ matrix.profile }}
          SEG03_PLAYWRIGHT_PATH: /tmp/segment19-tools/node_modules/playwright
          SEG03_OUT: .segment19-browser
        run: node scripts/exam-reliability/run-browser.cjs
      - name: Handoff qualification on representative desktop/phone engines
        if: matrix.profile == 'chromium-desktop' || matrix.profile == 'webkit-phone'
        env:
          SEG15_PLAYWRIGHT_PATH: /tmp/segment19-tools/node_modules/playwright
          SEG15_ENGINE: ${{ matrix.engine }}
          SEG15_MOBILE: ${{ matrix.profile == 'webkit-phone' && '1' || '0' }}
        run: node scripts/exam-reliability/run-segment15-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: segment19-browser-${{ matrix.profile }}-${{ github.run_id }}
          path: .segment19-browser
          include-hidden-files: true
          retention-days: 30
  gate:
    name: Segment 19 automated qualification gate
    if: always()
    needs: [node-and-load, database-recovery, browsers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject failed, cancelled, skipped, or incomplete automated qualification
        env:
          NODE_RESULT: ${{ needs.node-and-load.result }}
          DATABASE_RESULT: ${{ needs.database-recovery.result }}
          BROWSER_RESULT: ${{ needs.browsers.result }}
        run: |
          test "$NODE_RESULT" = success
          test "$DATABASE_RESULT" = success
          test "$BROWSER_RESULT" = success
      - run: |
          echo 'Automated Segment 19 qualification passed.'
          echo 'Physical iPhone/iPad/laptop evidence and real WAN/live-production evidence remain separate required release evidence and are not fabricated by this CI gate.'
