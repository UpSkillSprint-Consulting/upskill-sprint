name: Verify PR165 final review repairs
on:
  push:
    branches: ['fix/pr165-final-review-defects']
    paths: ['.github/workflows/pr165-final-fixes.yml']
permissions:
  contents: write
concurrency:
  group: pr165-final-review-repairs
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/fix/pr165-final-review-defects'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Verify saved repairs and exact baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr165-final"
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          assert os.environ['GITHUB_REF'] == 'refs/heads/fix/pr165-final-review-defects'
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr165-final'
          parts = [pathlib.Path(f'.github/pr165-final-fixes-{i}.b64').read_text().strip() for i in range(1,4)]
          assert [len(s) for s in parts] == [10000,10000,6288]
          packed = base64.b64decode(''.join(parts), validate=True)
          assert hashlib.sha256(packed).hexdigest() == 'f6e951a67de758da025fb500ebf174b983f7400ba5f0e30fe01f4986935f99ae'
          raw = lzma.decompress(packed)
          assert hashlib.sha256(raw).hexdigest() == 'a6ce1f0b04e6c382e9ae754fbd49647fd21af5aac6ce5a213f2f6b39fe72359d'
          payload = json.loads(raw)
          extra = json.loads(pathlib.Path('.github/pr165-final-chart-contract.json').read_text())
          assert set(extra['manifest']) == {'tests/test-bank-question-charts.test.js'}
          assert extra['manifest']['tests/test-bank-question-charts.test.js']['after'] == '5d931d8571e28182666e70d1e7c3def9971c414bb01a197d8c07f645a614024c'
          assert len(payload['manifest']) == 20
          payload['manifest'].update(extra['manifest'])
          baseline = '962bf6e85bb72ef1ce7247239709f39665120d46'
          assert payload['baseline'] == baseline
          # Temporary transport/workflow history must not enter the application PR.
          subprocess.run(['git','checkout','--detach',baseline], check=True)
          for name, expected in payload['manifest'].items():
              path = pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and not name.startswith('.github/')
              p = pathlib.Path(name)
              actual = hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
              assert actual == expected['before'], f'Baseline mismatch: {name}'
          for name, patch_text in [('repairs.patch',payload['patch']),('chart-contract.patch',extra['patch'])]:
              patch = out / name
              patch.write_text(patch_text, newline='')
              subprocess.run(['git','apply','--check',str(patch)],check=True)
              subprocess.run(['git','apply',str(patch)],check=True)
          (out / 'manifest.json').write_text(json.dumps(payload['manifest'],indent=2))
          print('Applied 21 explicitly verified repair/test/asset paths.')
          PY
      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci | tee "$RUNNER_TEMP/pr165-final/dependencies.log"
      - name: Regenerate all seven visual packages and verify exact files
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-mbb160-assets.mjs | tee "$RUNNER_TEMP/pr165-final/regeneration.log"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr165-final'
          manifest = json.loads((out / 'manifest.json').read_text())
          verified = {}
          for name, expected in manifest.items():
              actual = hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
              assert actual == expected['after'], f'Regenerated candidate mismatch: {name}'
              verified[name] = actual
              print('MATCH',name,actual)
          (out / 'verified-files.json').write_text(json.dumps(verified,indent=2))
          changed = subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert set(changed) <= set(manifest), changed
          subprocess.run(['git','diff','--check'],check=True)
          PY
      - name: Run full Node 22 regression suite
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 tests/*.test.js | tee "$RUNNER_TEMP/pr165-final/full-regression.log"
      - name: Commit verified repairs to a clean review candidate only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/pr165-final-review-defects'
          test "$(git rev-parse HEAD)" = '962bf6e85bb72ef1ce7247239709f39665120d46'
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr165-final'
          paths = list(json.loads((out / 'manifest.json').read_text()))
          assert len(paths) == 21
          log = (out / 'full-regression.log').read_text()
          for expected in ['# tests 1397','# pass 1397','# fail 0','# cancelled 0','# skipped 0']:
              assert expected in log, expected
          subprocess.run(['git','add','--',*paths],check=True)
          staged = subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(staged) == set(paths), staged
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
          git config user.name 'upskillsprint-agent'
          git config user.email 'skillsprintconsulting@gmail.com'
          git commit -m 'fix: resolve PR165 feedback loops, missing practice evidence and stale metadata'
          git push origin HEAD:refs/heads/fix/pr165-final-review-candidate
          git rev-parse HEAD > "$RUNNER_TEMP/pr165-final/commit.txt"
      - name: Preserve verifiable results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr165-final-defect-repair-verification
          path: |
            ${{ runner.temp }}/pr165-final/manifest.json
            ${{ runner.temp }}/pr165-final/verified-files.json
            ${{ runner.temp }}/pr165-final/dependencies.log
            ${{ runner.temp }}/pr165-final/regeneration.log
            ${{ runner.temp }}/pr165-final/full-regression.log
            ${{ runner.temp }}/pr165-final/commit.txt
          retention-days: 14
