name: Integrate and validate MBB Set 3 Batch 4
on:
  push:
    branches: ['automation/mbb-set3-batch4']
    paths: ['.github/workflows/mbb-set3-batch4-integrate.yml']
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the visually confirmed repair only to the reviewed PR head
        run: |
          git fetch origin audit/mbb-set3-batch1-q001-q025
          test "$(git rev-parse FETCH_HEAD)" = '15a8b840aa514b8a1be0f2dbfd39c5296bb40dc8'
          git checkout --detach FETCH_HEAD
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('test-bank-mbb-set3.js');s=p.read_text()
          old='Cash outlays total $350,000+$40,000+$15,000+$20,000=$425,000.'
          new='Cash outlays total $350,000 + $40,000 + $15,000 + $20,000 = $425,000.'
          assert s.count(old)==1
          starts=[m.start() for m in re.finditer(r'^  \{$',s,re.M)]
          before=s[:starts[75]];after=s[starts[100]:]
          p.write_text(s.replace(old,new))
          t=p.read_text();starts2=[m.start() for m in re.finditer(r'^  \{$',t,re.M)]
          assert t[:starts2[75]]==before and t[starts2[100]:]==after
          for name in ['revisions.json','question-audit-tracker.json']:
              p=Path('docs/audits/mbb-set3-batch04')/name;s=p.read_text();assert old in s;p.write_text(s.replace(old,new))
          p=Path('test-bank-mbb-set3-batch4-ui.js');s=p.read_text();anchor='`;document.head.appendChild(style);';assert s.count(anchor)==1
          s=s.replace(anchor,'.tb-review-card:has(.mbbs3b4-question) .tb-key-point,.tb-review-card:has(.mbbs3b4-question) .tb-exam-trap{overflow-wrap:anywhere;min-width:0}\n'+anchor);p.write_text(s)
          p=Path('scripts/audit-mbb-set3-batch4.mjs');s=p.read_text();assert '.tb-explanation-copy,th,td,dd' in s
          s=s.replace('.tb-explanation-copy,th,td,dd','.tb-explanation-copy,.tb-key-point,.tb-exam-trap,.tb-deep-label,.tb-accuracy-note,th,td,dd')
          old='if(keyboardScroll.needed){await page.waitForTimeout(150);assert.ok(await area.evaluate(e=>e.scrollLeft>0));}'
          new='if(keyboardScroll.needed){await page.waitForTimeout(150);keyboardScroll.moved=await area.evaluate(e=>e.scrollLeft>0);assert.ok(keyboardScroll.moved);}'
          assert s.count(old)==1;s=s.replace(old,new);p.write_text(s)
          PY
          node --check test-bank-mbb-set3.js
          node --check test-bank-mbb-set3-batch4-ui.js
          node --check scripts/audit-mbb-set3-batch4.mjs
      - name: Commit the verified scope to the review branch without merging
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-bank-mbb-set3.js test-bank-mbb-set3-batch4-ui.js scripts/audit-mbb-set3-batch4.mjs docs/audits/mbb-set3-batch04/revisions.json docs/audits/mbb-set3-batch04/question-audit-tracker.json
          git diff --cached --check
          git commit -m 'fix: wrap Q77 learning-point arithmetic and verify all expanded feedback regions'
          git push origin HEAD:refs/heads/audit/mbb-set3-batch1-q001-q025
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/mbb4-workspace
          git rev-parse HEAD > /tmp/mbb4-workspace/commit.txt
          git archive --format=tar HEAD | gzip > /tmp/mbb4-workspace/repository.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: mbb-set3-batch4-workspace
          path: /tmp/mbb4-workspace
          retention-days: 14
  regression:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Independent content, financial, preservation and all-option grading tests
        run: |
          mkdir -p audit-results-batch4
          git rev-parse HEAD > audit-results-batch4/tested-commit.txt
          set -o pipefail
          node --test --test-concurrency=1 tests/test-bank-mbb-set3-batch4-audit.test.js | tee audit-results-batch4/batch4-tests.txt
      - name: Complete repository regression
        run: timeout 900 node --test --test-concurrency=2 tests/*.test.js > audit-results-batch4/full-regression.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mbb-set3-batch4-regression
          path: audit-results-batch4
          retention-days: 14
  browsers:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        layout: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright @axe-core/playwright
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Every item and expanded feedback in both themes; verify both tables
        env:
          AUDIT_ENGINE: ${{ matrix.engine }}
          AUDIT_LAYOUT: ${{ matrix.layout }}
        run: |
          mkdir -p audit-results-batch4
          git rev-parse HEAD > audit-results-batch4/tested-commit.txt
          node scripts/audit-mbb-set3-batch4.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mbb-set3-batch4-${{ matrix.engine }}-${{ matrix.layout }}
          path: audit-results-batch4
          retention-days: 14
