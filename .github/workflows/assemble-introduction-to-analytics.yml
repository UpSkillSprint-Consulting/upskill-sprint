name: Assemble Introduction to Analytics lesson

on:
  push:
    branches:
      - agent/recover-intro-analytics-payload
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  assemble:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/recover-intro-analytics-payload
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "upskillsprint-agent"
          git config user.email "upskillsprint-agent@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Recover complete lesson HTML
        shell: bash
        run: |
          test -f .lesson-build/latest-introduction-to-analytics.html.gz.b64
          mkdir -p lessons/data-analytics
          base64 --decode .lesson-build/latest-introduction-to-analytics.html.gz.b64 | gzip -dc > lessons/data-analytics/introduction-to-analytics.html
          grep -q '<!DOCTYPE html>' lessons/data-analytics/introduction-to-analytics.html
          grep -q '</html>' lessons/data-analytics/introduction-to-analytics.html

      - name: Create lesson visuals
        shell: bash
        run: |
          mkdir -p assets/lessons/introduction-to-analytics
          python3 - <<'PY'
          from pathlib import Path
          lesson = Path('lessons/data-analytics/introduction-to-analytics.html')
          html = lesson.read_text(encoding='utf-8')
          html = html.replace('analytics-ecosystem-nesting.webp', 'analytics-ecosystem-nesting.svg')
          html = html.replace('types-of-analytics.webp', 'types-of-analytics.svg')
          lesson.write_text(html, encoding='utf-8')
          Path('assets/lessons/introduction-to-analytics/analytics-ecosystem-nesting.svg').write_text('''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#f7fafc"/><ellipse cx="600" cy="380" rx="500" ry="330" fill="#ffc45c" stroke="#102a43" stroke-width="6"/><ellipse cx="600" cy="410" rx="400" ry="260" fill="#c58ac5" stroke="#102a43" stroke-width="6"/><ellipse cx="600" cy="445" rx="300" ry="190" fill="#f0df00" stroke="#102a43" stroke-width="6"/><ellipse cx="600" cy="500" rx="210" ry="125" fill="#24b7c0" stroke="#102a43" stroke-width="6"/><g font-family="Arial" font-weight="700" text-anchor="middle" fill="#101828"><text x="600" y="105" font-size="44">Data Science</text><text x="600" y="230" font-size="40">Data Analysis</text><text x="600" y="350" font-size="38">Data Analytics</text><text x="600" y="515" font-size="38">Data Mining</text></g></svg>''', encoding='utf-8')
          Path('assets/lessons/introduction-to-analytics/types-of-analytics.svg').write_text('''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050"><rect width="1400" height="1050" fill="#fff"/><text x="700" y="95" text-anchor="middle" font-family="Arial" font-size="72" font-weight="800" fill="#07152d">Types of Analytics</text><path d="M115 915H1300M115 915V140" stroke="#111" stroke-width="9"/><circle cx="290" cy="720" r="115" fill="#f32218"/><circle cx="535" cy="620" r="115" fill="#ffa000"/><circle cx="850" cy="420" r="125" fill="#20c739"/><circle cx="1090" cy="285" r="125" fill="#1557f0"/><g font-family="Arial" text-anchor="middle" font-size="34" font-weight="800" fill="#fff"><text x="290" y="734">Descriptive</text><text x="535" y="634">Diagnostic</text><text x="850" y="434">Predictive</text><text x="1090" y="299">Prescriptive</text></g></svg>''', encoding='utf-8')
          PY

      - name: Generate poster PDFs
        run: |
          python3 -m pip install --quiet reportlab
          mkdir -p downloads/introduction-to-analytics
          python3 - <<'PY'
          from reportlab.pdfgen import canvas
          from reportlab.lib.pagesizes import landscape, A2
          from reportlab.lib import colors
          from pathlib import Path
          out=Path('downloads/introduction-to-analytics')
          posters=[('wall-poster-1.pdf','Analytics Landscape'),('wall-poster-2.pdf','Analytics Decision Flow'),('wall-poster-3.pdf','Full Lesson Summary'),('wall-poster-4-types-of-analytics.pdf','Types of Analytics')]
          for filename,title in posters:
              c=canvas.Canvas(str(out/filename),pagesize=landscape(A2)); w,h=landscape(A2)
              c.setFillColor(colors.HexColor('#07152d')); c.rect(0,h-150,w,150,fill=1,stroke=0)
              c.setFillColor(colors.white); c.setFont('Helvetica-Bold',42); c.drawString(55,h-78,title)
              c.setFillColor(colors.HexColor('#152238')); c.setFont('Helvetica',24)
              y=h-260
              for line in ['Define the decision.','Validate the data.','Match the method to the question.','Communicate uncertainty.','Act and monitor results.']:
                  c.drawString(120,y,'• '+line); y-=70
              c.save()
          PY

      - name: Register lesson
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('chi-square-lesson-library.js'); text=p.read_text(encoding='utf-8')
          if "marker: 'data-introduction-to-analytics'" not in text:
              entry="""    {
                marker: 'data-introduction-to-analytics',
                sectionId: 'data-analytics',
                path: '/lessons/data-analytics/introduction-to-analytics',
                topic: 'data-analytics',
                level: 'beginner',
                interactive: 'true',
                search: 'introduction analytics data analysis data science descriptive diagnostic predictive prescriptive beginner interactive',
                meta: '<span>Beginner</span><span>Interactive</span><span>32 min</span>',
                title: 'Introduction to Analytics',
                description: 'See how analytics turns raw data into decisions through visual models, an editable manufacturing example, interactive pattern exploration, and four downloadable wall posters.'
              },
          """
              text=text.replace('  const LESSONS = [\n','  const LESSONS = [\n'+entry,1)
              p.write_text(text,encoding='utf-8')
          PY

      - name: Validate and commit
        run: |
          test -s lessons/data-analytics/introduction-to-analytics.html
          grep -q '</html>' lessons/data-analytics/introduction-to-analytics.html
          grep -q 'data-introduction-to-analytics' chi-square-lesson-library.js
          test -s assets/lessons/introduction-to-analytics/analytics-ecosystem-nesting.svg
          test -s assets/lessons/introduction-to-analytics/types-of-analytics.svg
          test -s downloads/introduction-to-analytics/wall-poster-1.pdf
          test -s downloads/introduction-to-analytics/wall-poster-2.pdf
          test -s downloads/introduction-to-analytics/wall-poster-3.pdf
          test -s downloads/introduction-to-analytics/wall-poster-4-types-of-analytics.pdf
          rm -rf .lesson-build
          rm -f .github/workflows/assemble-introduction-to-analytics.yml
          git add -A
          git commit -m "Fix and publish Introduction to Analytics lesson"
          git push origin HEAD:agent/recover-intro-analytics-payload
