name: Assemble Introduction to Analytics lesson

on:
  push:
    branches:
      - agent/recover-intro-analytics-payload

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/recover-intro-analytics-payload
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "upskillsprint-agent"
          git config user.email "upskillsprint-agent@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Recover complete lesson HTML
        shell: bash
        run: |
          test -f .lesson-build/latest-introduction-to-analytics.html.gz.b64
          mkdir -p lessons/data-analytics
          base64 --decode .lesson-build/latest-introduction-to-analytics.html.gz.b64 | gzip -dc > lessons/data-analytics/introduction-to-analytics.html
          grep -q '<!DOCTYPE html>' lessons/data-analytics/introduction-to-analytics.html
          grep -q '</html>' lessons/data-analytics/introduction-to-analytics.html

      - name: Create lesson visuals
        shell: bash
        run: |
          mkdir -p assets/lessons/introduction-to-analytics
          python3 - <<'PY'
          from pathlib import Path
          lesson = Path('lessons/data-analytics/introduction-to-analytics.html')
          html = lesson.read_text(encoding='utf-8')
          html = html.replace('analytics-ecosystem-nesting.webp', 'analytics-ecosystem-nesting.svg')
          html = html.replace('types-of-analytics.webp', 'types-of-analytics.svg')
          lesson.write_text(html, encoding='utf-8')

          ecosystem = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Analytics ecosystem</title><desc id="d">Nested model showing data science, data analysis, data analytics and data mining.</desc><rect width="1200" height="760" fill="#f7fafc"/><ellipse cx="600" cy="380" rx="500" ry="330" fill="#ffc45c" stroke="#102a43" stroke-width="6"/><ellipse cx="600" cy="410" rx="400" ry="260" fill="#c58ac5" stroke="#102a43" stroke-width="6"/><ellipse cx="600" cy="445" rx="300" ry="190" fill="#f0df00" stroke="#102a43" stroke-width="6"/><ellipse cx="600" cy="500" rx="210" ry="125" fill="#24b7c0" stroke="#102a43" stroke-width="6"/><g font-family="Arial,sans-serif" font-weight="700" text-anchor="middle" fill="#101828"><text x="600" y="105" font-size="44">Data Science</text><text x="600" y="230" font-size="40">Data Analysis</text><text x="600" y="350" font-size="38">Data Analytics</text><text x="600" y="515" font-size="38">Data Mining</text></g></svg>'''
          Path('assets/lessons/introduction-to-analytics/analytics-ecosystem-nesting.svg').write_text(ecosystem, encoding='utf-8')

          types = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" role="img" aria-labelledby="t d"><title id="t">Types of Analytics</title><desc id="d">Value versus complexity map for descriptive, diagnostic, predictive and prescriptive analytics.</desc><rect width="1400" height="1050" fill="#fff"/><text x="700" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="72" font-weight="800" fill="#07152d">Types of Analytics</text><path d="M115 915H1300M115 915V140" stroke="#111" stroke-width="9"/><path d="M1300 915l-40-25v50zM115 140l-25 40h50z" fill="#111"/><text x="700" y="1010" text-anchor="middle" font-family="Arial,sans-serif" font-size="58" font-weight="800">Complexity</text><text x="55" y="550" text-anchor="middle" transform="rotate(-90 55 550)" font-family="Arial,sans-serif" font-size="58" font-weight="800">Value</text><circle cx="290" cy="720" r="115" fill="#f32218"/><circle cx="535" cy="620" r="115" fill="#ffa000"/><circle cx="850" cy="420" r="125" fill="#20c739"/><circle cx="1090" cy="285" r="125" fill="#1557f0"/><g font-family="Arial,sans-serif" text-anchor="middle" font-size="34" font-weight="800" fill="#fff"><text x="290" y="734">Descriptive</text><text x="535" y="634">Diagnostic</text><text x="850" y="434">Predictive</text><text x="1090" y="299">Prescriptive</text></g><text x="545" y="825" font-family="Arial,sans-serif" font-size="55" font-weight="800" fill="#f05a47">Past</text><text x="1150" y="540" font-family="Arial,sans-serif" font-size="55" font-weight="800" fill="#168a78">Future</text></svg>'''
          Path('assets/lessons/introduction-to-analytics/types-of-analytics.svg').write_text(types, encoding='utf-8')
          PY

      - name: Generate four poster PDFs
        run: |
          python3 -m pip install --quiet reportlab
          mkdir -p downloads/introduction-to-analytics
          python3 - <<'PY'
          from reportlab.pdfgen import canvas
          from reportlab.lib.pagesizes import landscape, A2
          from reportlab.lib import colors
          from pathlib import Path
          out = Path('downloads/introduction-to-analytics')
          posters = [
            ('wall-poster-1.pdf','Analytics Landscape','From data to insight, insight to action, and action to value.'),
            ('wall-poster-2.pdf','Analytics Decision Flow','Descriptive, diagnostic, predictive and prescriptive analytics.'),
            ('wall-poster-3.pdf','Full Lesson Summary','Core concepts, lifecycle, patterns, tools and data organization.'),
            ('wall-poster-4-types-of-analytics.pdf','Types of Analytics','What happened, why, what is next, and what should we do?')
          ]
          for filename,title,subtitle in posters:
              c=canvas.Canvas(str(out/filename), pagesize=landscape(A2)); w,h=landscape(A2)
              c.setFillColor(colors.HexColor('#07152d')); c.rect(0,h-150,w,150,fill=1,stroke=0)
              c.setFillColor(colors.white); c.setFont('Helvetica-Bold',42); c.drawString(55,h-75,title)
              c.setFont('Helvetica',20); c.drawString(58,h-112,subtitle)
              c.setFillColor(colors.HexColor('#f5f8fb')); c.roundRect(70,110,w-140,h-320,24,fill=1,stroke=0)
              c.setFillColor(colors.HexColor('#0e7490')); c.setFont('Helvetica-Bold',34); c.drawCentredString(w/2,h-270,'Introduction to Analytics')
              c.setFillColor(colors.HexColor('#152238')); c.setFont('Helvetica',24)
              lines=['Define the decision before selecting a method.','Use reliable data and validate its quality.','Match the analytics type to the question.','Communicate uncertainty and act on evidence.','Monitor results and improve the decision.']
              y=h-350
              for line in lines: c.drawString(130,y,'• '+line); y-=62
              c.setFillColor(colors.HexColor('#07152d')); c.rect(0,0,w,44,fill=1,stroke=0)
              c.setFillColor(colors.white); c.setFont('Helvetica-Bold',14); c.drawCentredString(w/2,16,'UpSkill Sprint Consulting • Introduction to Analytics')
              c.save()
          PY

      - name: Register lesson in library
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('chi-square-lesson-library.js')
          text=p.read_text(encoding='utf-8')
          marker="marker: 'data-introduction-to-analytics'"
          if marker not in text:
              entry="""    {
                marker: 'data-introduction-to-analytics',
                sectionId: 'data-analytics',
                path: '/lessons/data-analytics/introduction-to-analytics',
                topic: 'data-analytics',
                level: 'beginner',
                interactive: 'true',
                search: 'introduction analytics data analytics data analysis data science data mining descriptive diagnostic predictive prescriptive d2p3 analytics lifecycle patterns beginner interactive',
                meta: '<span>Beginner</span><span>Interactive</span><span>32 min</span>',
                title: 'Introduction to Analytics',
                description: 'See how analytics turns raw data into decisions through visual models, an editable manufacturing example, interactive pattern exploration, and four downloadable wall posters.'
              },
          """
              text=text.replace('  const LESSONS = [\n','  const LESSONS = [\n'+entry,1)
              p.write_text(text,encoding='utf-8')
          PY

      - name: Validate and commit
        shell: bash
        run: |
          test -s lessons/data-analytics/introduction-to-analytics.html
          grep -q 'Introduction to Analytics' lessons/data-analytics/introduction-to-analytics.html
          grep -q 'data-introduction-to-analytics' chi-square-lesson-library.js
          test -s assets/lessons/introduction-to-analytics/analytics-ecosystem-nesting.svg
          test -s assets/lessons/introduction-to-analytics/types-of-analytics.svg
          test -s downloads/introduction-to-analytics/wall-poster-1.pdf
          test -s downloads/introduction-to-analytics/wall-poster-2.pdf
          test -s downloads/introduction-to-analytics/wall-poster-3.pdf
          test -s downloads/introduction-to-analytics/wall-poster-4-types-of-analytics.pdf
          rm -rf .lesson-build
          rm -f .github/workflows/assemble-introduction-to-analytics.yml
          git add -A
          git commit -m "Fix and publish Introduction to Analytics lesson"
          git push origin HEAD:agent/recover-intro-analytics-payload
