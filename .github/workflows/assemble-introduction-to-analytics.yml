name: Assemble Introduction to Analytics lesson

on:
  push:
    branches:
      - agent/add-introduction-to-analytics-v3-final
    paths:
      - '.github/intro-analytics-payload/**'
      - '.github/workflows/assemble-introduction-to-analytics.yml'

permissions:
  contents: write

concurrency:
  group: assemble-introduction-to-analytics
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-introduction-to-analytics-v3-final
          fetch-depth: 0

      - name: Confirm complete payload
        id: payload
        shell: bash
        run: |
          shopt -s nullglob
          chunks=(.github/intro-analytics-payload/chunk-*)
          echo "count=${#chunks[@]}" >> "$GITHUB_OUTPUT"
          if [ "${#chunks[@]}" -ne 5 ]; then
            echo "Waiting for all 5 payload chunks; found ${#chunks[@]}."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Assemble lesson package
        if: steps.payload.outputs.ready == 'true'
        shell: bash
        run: |
          cat .github/intro-analytics-payload/chunk-* | base64 --decode > /tmp/introduction-to-analytics.tar.gz
          tar -xzf /tmp/introduction-to-analytics.tar.gz -C .
          rm -rf .github/intro-analytics-payload
          rm -f .github/workflows/assemble-introduction-to-analytics.yml

      - name: Commit assembled lesson
        if: steps.payload.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name "upskillsprint-agent"
          git config user.email "upskillsprint-agent@users.noreply.github.com"
          git add -A
          git commit -m "Add complete Introduction to Analytics lesson" || exit 0
          git push origin HEAD:agent/add-introduction-to-analytics-v3-final
