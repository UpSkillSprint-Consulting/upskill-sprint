name: Exam production release - Segment 20

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exam-production-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-contract:
    name: Segment 20 release contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Verify release helper syntax
        run: node --check scripts/exam-reliability/segment20-release.cjs
      - name: Verify Segment 19 + Segment 20 release contracts
        run: node --test --test-concurrency=1 tests/test-bank-segment19-qualification.test.js tests/test-bank-segment20-release.test.js
      - name: Verify production dependency high/critical gate
        run: npm audit --omit=dev --audit-level=high

  cumulative-regression:
    name: Segment 20 cumulative regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test

  preflight-honesty:
    name: Production preflight remains fail-closed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate committed production evidence is internally consistent and fail-closed
        shell: bash
        run: |
          node - <<'NODE'
          const p=require('./docs/exam-reliability/verification/v1/segment20-production-preflight.json');
          const e=require('./docs/exam-reliability/verification/v1/segment20-production-evidence.json');
          if(p.environment!=='production' || e.environment!=='production') throw Error('wrong production evidence environment');
          if(p.status!=='blocked_preflight') throw Error('preflight must remain blocked until production evidence is complete');
          if(p.rating!==null) throw Error('blocked preflight cannot have a rating');
          if(!Array.isArray(p.database?.requiredRepositoryMigrationsMissing) || p.database.requiredRepositoryMigrationsMissing.length!==0) throw Error('production migration rollout must be recorded as complete');
          for(const k of ['trustedClock','incrementalSync','sessionHandoff','newOnlyV2','securityReset']) {
            if(p.database?.capabilities?.[k]!==true || e.database?.capabilities?.[k]!==true) throw Error('missing production capability: '+k);
          }
          if(!Array.isArray(p.database?.migrationVersionsObserved) || !Array.isArray(e.database?.migrationVersions)) throw Error('production migration ledger evidence missing');
          if(JSON.stringify(p.database.migrationVersionsObserved)!==JSON.stringify(e.database.migrationVersions)) throw Error('preflight and production evidence migration ledgers diverge');
          if(p.productionSmoke?.status!=='partial_passed' || p.productionSmoke?.persistentLearnerWrites!==false) throw Error('rollback-only production smoke evidence missing');
          if(e.status!=='partial' || e.releaseCommit!==null) throw Error('partial production evidence cannot claim a release commit');
          if(p.security?.leakedPasswordProtection!==false || e.security?.leakedPasswordProtection!==false) throw Error('hosted Auth risk must not be silently marked fixed');
          if(e.security?.unresolvedReleaseRisks!==1 || e.security?.verifiedAt!==null) throw Error('open hosted Auth risk must remain unverified');
          if(p.segment19?.physicalEvidence!=='pending_physical' || p.segment19?.realNetworkEvidence!=='pending_real_network') throw Error('pending Segment19 evidence must remain explicit');
          if(e.smoke?.checks?.some(x => x.status==='passed')) throw Error('partial rollback-only smoke cannot be promoted to final passed smoke');
          if(e.recovery?.rollbackRunbookVerified!==false || e.recovery?.forwardRecoveryVerified!==false || e.recovery?.backupRestoreVerified!==false) throw Error('recovery must remain pending until verified');
          if(p.observationWindow!=='not_started' || e.observation?.status!=='pending' || e.observation?.startedAt!==null || e.observation?.endedAt!==null) throw Error('observation must not start before external prerequisites pass');
          if(!Array.isArray(p.blockingReasons) || p.blockingReasons.length<4) throw Error('remaining release blockers must stay explicit');
          console.log('Segment 20 production evidence consistency check passed');
          NODE
