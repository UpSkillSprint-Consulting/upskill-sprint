name: Exam version catalog
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exam-version-catalog-${{ github.ref }}
  cancel-in-progress: true
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: '.node-version', cache: npm}
      - run: npm ci
      - name: Rebuild all published versions without modifying the checkout
        run: node scripts/exam-reliability/build-catalog.cjs --check
      - name: Identity, version, payload-budget and immutable history regressions
        run: node --test --test-concurrency=1 tests/test-bank-segment04-identity.test.js tests/test-bank-segment05-versions.test.js
