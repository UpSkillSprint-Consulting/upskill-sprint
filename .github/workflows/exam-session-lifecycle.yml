name: Exam session lifecycle
on:
  pull_request:
    paths:
      - 'test-bank-session-lifecycle.js'
      - 'test-bank-session-lifecycle-finalization.js'
      - 'test-bank-adaptive-mastery-completion-guard.js'
      - 'scripts/exam-reliability/run-session-lifecycle-browser.cjs'
      - 'tests/test-bank-segment12-session-lifecycle.test.js'
      - 'docs/exam-reliability/SEGMENT-12-SESSION-LIFECYCLE.md'
      - '.github/workflows/exam-session-lifecycle.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exam-session-lifecycle-${{ github.ref }}
  cancel-in-progress: true
jobs:
  segment12-node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: '.node-version', cache: npm}
      - run: npm ci
      - name: Syntax and focused lifecycle contract
        run: |
          node --check test-bank-session-lifecycle.js
          node --check test-bank-session-lifecycle-finalization.js
          node --check scripts/exam-reliability/run-session-lifecycle-browser.cjs
          node --test --test-concurrency=1 tests/test-bank-segment12-session-lifecycle.test.js
      - name: Cumulative repository suite
        run: npm test
  segment12-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: chromium-desktop
            engine: chromium
          - profile: webkit-phone
            engine: webkit
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: '.node-version', cache: npm}
      - run: npm ci
      - name: Install pinned test-only browser driver outside app dependencies
        run: npm install --prefix /tmp/segment12-tools --ignore-scripts --save-exact playwright@1.57.0
      - name: Install pinned browser binary
        run: /tmp/segment12-tools/node_modules/.bin/playwright install ${{ matrix.engine }}
      - name: Reload, restore, finalize, and terminal-state acceptance
        run: node scripts/exam-reliability/run-session-lifecycle-browser.cjs
        env:
          SEG12_BROWSER_PROFILE: ${{ matrix.profile }}
          SEG12_PLAYWRIGHT_PATH: /tmp/segment12-tools/node_modules/playwright
