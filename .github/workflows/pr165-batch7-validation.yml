name: PR165 Batch 7 validation workspace
on:
  push:
    branches: ['audit/pr165-batch7-validation']
    paths: ['.github/workflows/pr165-batch7-validation.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 65dc141c42e7208542a704c6eddf29c4ce2cf08e
          persist-credentials: false
      - name: Archive exact tracked source only
        run: |
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/pr165-b7-source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/baseline.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: pr165-b7-source
          path: |
            ${{ runner.temp }}/pr165-b7-source.tar.gz
            ${{ runner.temp }}/baseline.txt
          retention-days: 7
