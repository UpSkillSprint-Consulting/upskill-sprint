name: PR173 headless renderer qualification
on:
  push:
    branches: ['diagnostic/pr173-cpu-renderer-qualification']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {ref: 97b386874371ea3920e769c4f43900e942db00bb, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: '.node-version', cache: npm}
      - name: Reconstruct and verify reviewed source exactly
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs'),zlib=require('node:zlib'),crypto=require('node:crypto'),assert=require('node:assert/strict'),{execFileSync}=require('node:child_process');
            const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
            const repo={owner:context.repo.owner,repo:context.repo.repo};
            const parent='97b386874371ea3920e769c4f43900e942db00bb';
            assert.equal(git('rev-parse','HEAD'),parent);
            assert.equal(git('write-tree'),'45fc49d26f47fc6e11dcc912696c65838b1d90b0');
            const blob=await github.rest.git.getBlob({...repo,file_sha:'49d2fd493161d0ae8a075a82ba0e6db73dabf26b'});
            const patch=zlib.brotliDecompressSync(Buffer.from(Buffer.from(blob.data.content,'base64').toString('utf8'),'base64'));
            assert.equal(crypto.createHash('sha256').update(patch).digest('hex'),'935ad755efa4e80ccef912d840a38e04fb04fd53db8a5f72b0c7a0eb7ffba15e');
            fs.writeFileSync('/tmp/pr173-renderer.patch',patch);
            git('apply','--index','/tmp/pr173-renderer.patch');
            const tree=git('write-tree');assert.equal(tree,'771339bd3c1e361a47ebb7788101635e1d7cae6b');
            const paths=git('diff','--cached','--name-only').split('\n');assert.equal(paths.length,19);
            const entries=[];
            for(const path of paths){const bytes=fs.readFileSync(path);const b=await github.rest.git.createBlob({...repo,content:bytes.toString('base64'),encoding:'base64'});assert.equal(b.data.sha,git('hash-object',path));entries.push({path,mode:'100644',type:'blob',sha:b.data.sha});}
            fs.mkdirSync('/tmp/pr173-renderer',{recursive:true});fs.writeFileSync('/tmp/pr173-renderer/assembly.json',JSON.stringify({parent,tree,entries,refsUpdated:false,scope:'Reviewed working-tree candidate; PR-head qualification follows connector push'},null,2));
            // No ref/main change or deployment; only immutable source blobs.
      - run: npm ci
      - name: Independently failing-before focus tests, engine reuse, evidence and watchdog regressions
        run: node --test --test-concurrency=1 tests/student-audit-*.test.js > /tmp/pr173-renderer/tests.log 2>&1
      - run: node scripts/exam-reliability/build-catalog.cjs --check > /tmp/pr173-renderer/catalogue.json
      - run: npm ci --prefix scripts/student-audit-tools --ignore-scripts
      - run: scripts/student-audit-tools/node_modules/.bin/playwright install --with-deps webkit
      - name: Complete Batch4 WebKit-mobile with rendering policy and all original assertions
        env:
          AUDIT_TOOLS_DIR: ${{ github.workspace }}/scripts/student-audit-tools
          AUDIT_ENGINE: webkit
          AUDIT_LAYOUT: mobile
          AUDIT_SOURCE: candidate-tree-771339bd3c1e361a47ebb7788101635e1d7cae6b
        run: node scripts/run-student-audit.cjs batch4
      - name: Preserve complete evidence, not a partial success
        if: always()
        run: |
          mkdir -p /tmp/pr173-renderer
          if test -d audit-results-batch4; then cp -r audit-results-batch4 /tmp/pr173-renderer/batch4; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: pr173-renderer-qualification, path: /tmp/pr173-renderer, retention-days: 14}
