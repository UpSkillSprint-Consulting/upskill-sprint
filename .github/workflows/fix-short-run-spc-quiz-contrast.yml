name: Fix short-run SPC quiz contrast

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  fix-quiz-contrast:
    if: github.head_ref == 'agent/add-short-run-spc-lesson'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-short-run-spc-lesson

      - name: Repair quiz option contrast
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lessons/lean-six-sigma/short-run-spc-control-charts.html')
          html = path.read_text(encoding='utf-8')
          old = '''    .quiz-option { display: flex; gap: 0.55rem; align-items: flex-start; border: 1px solid var(--line); border-radius: 9px; padding: 0.65rem 0.72rem; margin: 0.45rem 0; cursor: pointer; }
    .quiz-option:hover { background: var(--surface-soft); }
'''
          new = '''    .quiz-option {
      display: flex;
      gap: 0.65rem;
      align-items: flex-start;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 0.72rem 0.8rem;
      margin: 0.48rem 0;
      cursor: pointer;
      background-color: var(--surface-soft) !important;
      color: var(--ink) !important;
      transition: background-color 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
    }
    .quiz-option span { color: inherit !important; }
    .quiz-option input[type="radio"] {
      flex: 0 0 auto;
      margin-top: 0.22rem;
      accent-color: var(--teal);
    }
    .quiz-option:hover {
      background-color: var(--surface-strong) !important;
      border-color: var(--teal);
    }
    .quiz-option:focus-within {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--teal) 24%, transparent);
    }
    .quiz-option:has(input:checked) {
      background-color: var(--surface-strong) !important;
      border-color: var(--teal);
      box-shadow: inset 4px 0 0 var(--teal);
      font-weight: 650;
    }
    html[data-theme="dark"] .quiz-option {
      background-color: #17263a !important;
      color: #f4f7fb !important;
      border-color: #3b4b61;
    }
    html[data-theme="dark"] .quiz-option:hover,
    html[data-theme="dark"] .quiz-option:has(input:checked) {
      background-color: #20344d !important;
      border-color: #2bb7c9;
    }
'''
          if old not in html:
              raise SystemExit('Expected quiz CSS block was not found')
          html = html.replace(old, new, 1)
          path.write_text(html, encoding='utf-8')

          updated = path.read_text(encoding='utf-8')
          assert 'background-color: var(--surface-soft) !important;' in updated
          assert 'html[data-theme="dark"] .quiz-option' in updated
          assert '.quiz-option span { color: inherit !important; }' in updated
          assert old not in updated
          print('Quiz contrast CSS updated successfully.')
          PY

      - name: Commit corrected quiz styles and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .quiz-contrast-trigger
          rm -f .github/workflows/fix-short-run-spc-quiz-contrast.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lessons/lean-six-sigma/short-run-spc-control-charts.html .quiz-contrast-trigger .github/workflows/fix-short-run-spc-quiz-contrast.yml
          git commit -m 'fix: improve quiz option contrast'
          git push origin HEAD:agent/add-short-run-spc-lesson
