name: Finish audited PR 168 presentation

on:
  push:
    branches: ['feat/variance-covariance-correlation-cv-lesson']
    paths: ['.github/workflows/finish-spread-lab-alignment.yml']

permissions:
  contents: write

jobs:
  finish-reviewed-presentation:
    if: github.repository == 'UpSkillSprint-Consulting/upskill-sprint' && github.ref == 'refs/heads/feat/variance-covariance-correlation-cv-lesson'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Capture exact preview difference and apply presentation-only spacing
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, difflib, urllib.request
          p=Path('lessons/statistics/variance-covariance-correlation-and-coefficient-of-variation.html')
          s=p.read_text()
          out=Path('/tmp/spread-lab-finish');out.mkdir()
          assert hashlib.sha1(b'blob '+str(len(s.encode())).encode()+b'\0'+s.encode()).hexdigest()=='774b8a5e62051ea0cc6cd0a67f640f45678e84ea'
          url='https://deploy-preview-168--upskillsprint.netlify.app/lessons/statistics/variance-covariance-correlation-and-coefficient-of-variation'
          preview=urllib.request.urlopen(url,timeout=30).read().decode()
          (out/'preview.html').write_text(preview)
          diff=''.join(difflib.unified_diff(s.splitlines(True),preview.splitlines(True),fromfile='reviewed-source',tofile='netlify-preview'))
          (out/'preview-difference.patch').write_text(diff)
          print(diff)
          s=s.replace("    main.querySelectorAll('.katex-box').forEach(function (box) {", "    document.getElementById('quiz').style.setProperty('--lesson-sl-sitebar-height', height);\n    main.querySelectorAll('.katex-box').forEach(function (box) {")
          css='''/* Keep every diagram label and formula inside its own readable area. */
          #lesson-content .diagram-node .katex-display{margin:0}
          #lesson-content .diagram-node .n-title{line-height:1.2}
          #lesson-content .diagram-node .n-formula .katex{font-size:.9em}
          #lesson-content #diagramSvg text:nth-of-type(odd){transform:translateY(12px);paint-order:stroke;stroke:var(--lesson-sl-card);stroke-width:4px;stroke-linejoin:round}
          #lesson-content #diagramSvg text:nth-of-type(even){transform:translateY(-33px)}
          #quiz-heading{scroll-margin-top:calc(var(--lesson-sl-sitebar-height,73px) + 80px)}
          '''
          s=s.replace('</style>\n</body>',css+'</style>\n</body>')
          assert hashlib.sha1(b'blob '+str(len(s.encode())).encode()+b'\0'+s.encode()).hexdigest()=='079e081311b5d05c408927fe16cc8c09b2ae54d6'
          p.write_text(s)
          (out/'finished-lesson.html').write_text(s)
          PY
      - name: Verify unchanged content and guide regressions
        run: node --test tests/spread-lab-lesson.test.js
      - name: Commit only the verified lesson on the existing PR branch
        run: |
          set -eu
          git diff --check
          git config user.name 'BigErnie'
          git config user.email 'BigErnie@users.noreply.github.com'
          git add -- lessons/statistics/variance-covariance-correlation-and-coefficient-of-variation.html
          test "$(git diff --cached --name-only)" = 'lessons/statistics/variance-covariance-correlation-and-coefficient-of-variation.html'
          git commit -m 'Keep diagram labels clear of borders and preserve quiz anchor clearance'
          git push origin HEAD:refs/heads/feat/variance-covariance-correlation-cv-lesson
          git rev-parse HEAD > /tmp/spread-lab-finish/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spread-lab-finishing-proof
          path: /tmp/spread-lab-finish
          retention-days: 14
