name: Final 175-question student stress test
on:
  push:
    branches: ['automation/mbb-set3-final175']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and apply exact locally tested incremental repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib,subprocess
          text=Path('audit-staging/final175-v2.patch.b64').read_text().replace('alGbobV5TCF','alGbobVTCF').replace('DlNS6Ud4OH4Ok','DlNS6Ud4OHIOk')
          data=gzip.decompress(base64.b64decode(text))
          assert hashlib.sha256(data).hexdigest()=='6c3dc992a8fb5de608b9459a0041440be9934932021f9bff34f3dab23fb3fc3c'
          Path('/tmp/final175-v2.patch').write_bytes(data)
          subprocess.run(['git','apply','--check','--unidiff-zero','/tmp/final175-v2.patch'],check=True)
          subprocess.run(['git','apply','--unidiff-zero','/tmp/final175-v2.patch'],check=True)
          PY
          node --check scripts/stress-mbb-set3-final175.mjs
          node --check scripts/stress-mbb-set3-edge-cases.mjs
          node --check test-bank-feedback-loop.js
          node --check test-bank-deep-feedback.js
      - run: npm ci
      - run: node --test --test-concurrency=1 tests/test-bank-mbb-set3-final-student.test.js
      - name: Commit only to isolated review-test branch
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/stress-mbb-set3-final175.mjs scripts/stress-mbb-set3-edge-cases.mjs test-bank-feedback-loop.js test-bank-deep-feedback.js tests/test-bank-mbb-set3-final-student.test.js
          git diff --cached --check
          git commit -m 'fix: position review controls below header and retain safe practice references'
          git push origin HEAD:refs/heads/automation/mbb-set3-final175
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: final175-staging-diagnostic
          path: audit-staging/final175-v2.patch.b64
  browsers:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            layout: desktop
            axe: '0'
          - engine: chromium
            layout: mobile
            axe: '1'
          - engine: webkit
            layout: desktop
            axe: '0'
          - engine: webkit
            layout: mobile
            axe: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright @axe-core/playwright
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Every question and review, both themes, uninterrupted full exam
        env:
          AUDIT_ENGINE: ${{ matrix.engine }}
          AUDIT_LAYOUT: ${{ matrix.layout }}
          AUDIT_AXE: ${{ matrix.axe }}
          AUDIT_SOURCE: ${{ needs.prepare.outputs.sha }}
        run: |
          mkdir -p audit-results-final175
          git rev-parse HEAD > audit-results-final175/tested-commit.txt
          node scripts/stress-mbb-set3-final175.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final175-${{ matrix.engine }}-${{ matrix.layout }}
          path: audit-results-final175
          retention-days: 14
  mixed:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright @axe-core/playwright
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Mixed outcomes and skipped items, both themes at 320px
        env:
          AUDIT_ENGINE: ${{ matrix.engine }}
          AUDIT_LAYOUT: mobile
          AUDIT_WIDTH: 320
          AUDIT_MIXED: '1'
          AUDIT_SOURCE: ${{ needs.prepare.outputs.sha }}
        run: |
          mkdir -p audit-results-final175
          git rev-parse HEAD > audit-results-final175/tested-commit.txt
          node scripts/stress-mbb-set3-final175.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final175-mixed-${{ matrix.engine }}
          path: audit-results-final175
          retention-days: 14
  edges:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright @axe-core/playwright
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Actual timeout, failed save, 174 correction items and rapid review
        env:
          AUDIT_ENGINE: ${{ matrix.engine }}
          AUDIT_LAYOUT: mobile
          AUDIT_WIDTH: 320
          AUDIT_SOURCE: ${{ needs.prepare.outputs.sha }}
        run: |
          mkdir -p audit-results-final175-edges
          git rev-parse HEAD > audit-results-final175-edges/tested-commit.txt
          node scripts/stress-mbb-set3-edge-cases.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final175-edges-${{ matrix.engine }}
          path: audit-results-final175-edges
          retention-days: 14
  prior-gates:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - batch: 3
            layout: desktop
          - batch: 4
            layout: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright @axe-core/playwright
      - run: npx playwright install --with-deps webkit
      - env:
          AUDIT_ENGINE: webkit
          AUDIT_LAYOUT: ${{ matrix.layout }}
        run: node scripts/audit-mbb-set3-batch${{ matrix.batch }}.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final175-prior-batch${{ matrix.batch }}-webkit-${{ matrix.layout }}
          path: audit-results-batch${{ matrix.batch }}
          retention-days: 14
  regression:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: |
          mkdir -p audit-results-final175-regression
          git rev-parse HEAD > audit-results-final175-regression/tested-commit.txt
          node --test --test-concurrency=1 tests/test-bank-mbb-set3-final-student.test.js 2>&1 | tee audit-results-final175-regression/targeted.log
      - run: node --test --test-concurrency=1 tests/*.test.js 2>&1 | tee audit-results-final175-regression/full.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final175-regression
          path: audit-results-final175-regression
          retention-days: 14
