name: Export final175 reviewed source
on:
  push:
    branches: ['automation/mbb-set3-final175']
    paths: ['.github/workflows/mbb-set3-final175-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          mkdir -p /tmp/final175-source
          git rev-parse HEAD > /tmp/final175-source/commit.txt
          git diff a826d62780928256df12f905501a76a372e803d5 -- . ':!.github/workflows/mbb-set3-final175-probe.yml' ':!audit-staging' > /tmp/final175-source/reviewed.patch
          tar --exclude=.git --exclude=node_modules -czf /tmp/final175-source/repository.tar.gz .
          npm ci
          tar -czf /tmp/final175-source/node-modules.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: final175-reviewed-source
          path: /tmp/final175-source
          retention-days: 14
