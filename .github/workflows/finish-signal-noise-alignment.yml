name: Finish audited Signal or Noise presentation
on:
  push:
    branches: ['fix/signal-noise-lesson-guide-alignment']
    paths: ['.github/workflows/finish-signal-noise-alignment.yml']
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/signal-noise-lesson-guide-alignment
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply exact reviewed source patch only
        shell: bash
        run: |
          python - <<'PY'
          import base64,zlib,hashlib,subprocess,re
          # Immutable, already reviewed patch. This changes three source/test files only.
          prior=subprocess.check_output(['git','show','6ca0ba23e868b3d8e59ced5a4eb7c3c440f660ac:.github/workflows/finish-signal-noise-alignment.yml'],text=True)
          encoded=re.search(r"encoded='([^']+)'",prior).group(1)
          patch=zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest()=='d4114d1acc61fc37e3a99807947db50d695f2856d4c434293cc268c8514c97e5'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          PY
          node --test tests/signal-noise-lesson.test.js
          node --check scripts/validate-signal-noise.cjs
          git diff --check
          git config user.name BigErnie
          git config user.email BigErnie@users.noreply.github.com
          git add lessons/lean-six-sigma/signal-or-noise-arl-nelson-rules-control-limit-design.html tests/signal-noise-lesson.test.js scripts/validate-signal-noise.cjs
          git commit -m "Fix audited contrast, chart clipping, readout precision and keyboard table access"
          git push origin HEAD:fix/signal-noise-lesson-guide-alignment
