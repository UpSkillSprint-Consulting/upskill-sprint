name: Exam New-only allocation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exam-new-only-allocation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: '.node-version', cache: npm}
      - run: npm ci
      - name: Segment 16 focused and cumulative regressions
        run: |
          node --check test-bank-new-only-allocation-v2.js
          node --check scripts/exam-reliability/run-segment16-database.cjs
          node --test --test-concurrency=1 \
            tests/test-bank-segment16-new-only-allocation.test.js \
            tests/test-bank-unseen-toggle.test.js \
            tests/test-bank-new-only-reservations.test.js \
            tests/test-bank-segment15-session-handoff.test.js \
            tests/test-bank-segment14-incremental-sync.test.js \
            tests/test-bank-segment14-sync-policy.test.js \
            tests/test-bank-segment13-timing.test.js \
            tests/test-bank-segment12-session-lifecycle.test.js
          npm test
          git diff --check
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: segment16_ci_only, POSTGRES_DB: segment03_test}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: '.node-version', cache: npm}
      - run: npm ci
      - name: Verify preinstalled PostgreSQL client
        run: psql --version
      - name: Apply full cumulative schema and database suite
        run: node scripts/exam-reliability/run-database.cjs
        env:
          SEG03_ALLOW_DISPOSABLE_DB: '1'
          SEG03_DB_URL: postgresql://postgres:segment16_ci_only@127.0.0.1:5432/segment03_test
      - name: Segment 16 allocation, exhaustion, ownership and race checks
        run: node scripts/exam-reliability/run-segment16-database.cjs
        env:
          SEG03_ALLOW_DISPOSABLE_DB: '1'
          SEG03_DB_URL: postgresql://postgres:segment16_ci_only@127.0.0.1:5432/segment03_test
  gate:
    name: Segment 16 acceptance gate
    if: always()
    needs: [node, database]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject any failed, skipped, cancelled, or incomplete lane
        env:
          NODE_RESULT: ${{ needs.node.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
        run: |
          test "$NODE_RESULT" = success
          test "$DATABASE_RESULT" = success
