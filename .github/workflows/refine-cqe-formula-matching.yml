name: Refine CQE formula matching

on:
  push:
    branches:
      - fix/cqe-context-aware-formula-pane
    paths:
      - .github/workflows/refine-cqe-formula-matching.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cqe-context-aware-formula-pane
      - name: Prefer stems and authored rationales over distractor options
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'test-bank-formulas.js';
          let source = fs.readFileSync(path, 'utf8');
          const beforeText = "return [question.stem || '', (question.options || []).join(' ')].join(' ');";
          const afterText = "return [question.stem || '', question.why || ''].join(' ');";
          if (!source.includes(beforeText)) throw new Error('questionText replacement anchor not found');
          source = source.replace(beforeText, afterText);
          const beforePattern = "/\\bCpk\\b|actual capability|off[- ]center|nearest specification|capability.*mean/i";
          const afterPattern = "/\\bCpk\\b|actual capability|off[- ]?center|capability.*center|nearest specification|capability.*mean/i";
          if (!source.includes(beforePattern)) throw new Error('Cpk pattern replacement anchor not found');
          source = source.replace(beforePattern, afterPattern);
          fs.writeFileSync(path, source);
          NODE
      - name: Commit matching refinement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-bank-formulas.js
          git commit -m "fix: avoid distractor-based formula recommendations"
          git push origin HEAD:fix/cqe-context-aware-formula-pane
