name: Apply CQE formula pane hardening

on:
  push:
    branches:
      - fix/cqe-context-aware-formula-pane
    paths:
      - scripts/patch-cqe-formula-pane-validation.js
      - .github/workflows/apply-cqe-formula-pane-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cqe-context-aware-formula-pane
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply hardening patch
        run: node scripts/patch-cqe-formula-pane-validation.js
      - name: Commit patched implementation
        run: |
          if git diff --quiet -- test-bank-formulas.js; then
            echo "No patch changes required."
            exit 0
          fi
          git config user.name "upskillsprint-agent"
          git config user.email "304186367+upskillsprint-agent@users.noreply.github.com"
          git add test-bank-formulas.js
          git commit -m "fix: harden CQE formula pane lifecycle and mappings"
          git push origin HEAD:fix/cqe-context-aware-formula-pane
