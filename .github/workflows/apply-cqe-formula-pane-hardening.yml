name: Apply CQE formula pane hardening

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/patch-cqe-formula-pane-validation.js
      - .github/workflows/apply-cqe-formula-pane-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cqe-context-aware-formula-pane
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply hardening patch
        run: node scripts/patch-cqe-formula-pane-validation.js
      - name: Commit patched implementation and tests
        run: |
          if git diff --quiet -- test-bank-formulas.js tests/test-bank-formula-pane-exhaustive.test.js; then
            echo "No patch changes required."
            exit 0
          fi
          git config user.name "upskillsprint-agent"
          git config user.email "304186367+upskillsprint-agent@users.noreply.github.com"
          git add test-bank-formulas.js tests/test-bank-formula-pane-exhaustive.test.js
          git commit -m "fix: expand CQE formula coverage and validation"
          git push origin HEAD:fix/cqe-context-aware-formula-pane
