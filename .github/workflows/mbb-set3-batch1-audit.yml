name: MBB Set 3 Batch 1 audit
on:
  push:
    branches: ['audit/mbb-set3-batch1-q001-q025']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mbb-set3-batch1-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply reviewed scoped integration
        if: hashFiles('.audit-mbb-set3-integrate.cjs') != ''
        run: |
          node .audit-mbb-set3-integrate.cjs
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const f='scripts/audit-mbb-set3-batch1.mjs';let s=fs.readFileSync(f,'utf8');
          const old='getUser:()=>({id:"audit-set3-isolated"}),getClient:';
          const replacement='isConfigured:()=>true,onChange:(cb)=>{queueMicrotask(()=>cb({id:"audit-set3-isolated"}));return ()=>{};},getUser:()=>({id:"audit-set3-isolated"}),getClient:';
          assert.ok(s.includes(old));s=s.replace(old,replacement);
          s=s.replace("await page.screenshot({path:path.join(out,label+'-'+theme+'.png'),fullPage:true})","await page.locator('.tb-quiz').screenshot({path:path.join(out,label+'-'+theme+'.png')})");
          fs.writeFileSync(f,s);
          NODE
          rm .audit-mbb-set3-integrate.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-bank-mbb-set3.js test-bank.html test-bank-feedback-loop.js scripts/audit-mbb-set3-batch1.mjs .audit-mbb-set3-integrate.cjs
          git commit -m 'fix: integrate accessible Set 3 batch 1 presentation and feedback'
          git push origin HEAD:audit/mbb-set3-batch1-q001-q025
      - run: npm ci
      - name: Batch 1 independent and existing Set 3 regression
        run: |
          mkdir -p audit-results
          set -o pipefail
          node --test tests/test-bank-mbb-set3.test.js tests/test-bank-mbb-set3-batch1-audit.test.js | tee audit-results/set3-tests.txt
      - name: Complete repository regression
        continue-on-error: true
        run: |
          set -o pipefail
          timeout 600 npm test > audit-results/full-regression.txt 2>&1
      - name: Capture current published baseline
        continue-on-error: true
        run: |
          curl --fail --location --max-time 45 https://upskillsprint.com/test-bank-mbb-set3.js -o audit-results/published-set3.js
          sha256sum audit-results/published-set3.js test-bank-mbb-set3.js > audit-results/source-hashes.txt
      - name: Browser validation
        if: always()
        run: |
          npm install --no-save --package-lock=false playwright @axe-core/playwright
          npx playwright install --with-deps chromium webkit
          node scripts/audit-mbb-set3-batch1.mjs
      - name: Capture audit evidence
        if: always()
        run: |
          mkdir -p audit-results
          git rev-parse HEAD > audit-results/commit.txt
          git archive --format=tar HEAD | gzip > audit-results/repository.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mbb-set3-batch1-evidence
          path: audit-results
          retention-days: 14
