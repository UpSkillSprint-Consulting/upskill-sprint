name: MBB Batch 3 source snapshot
on:
  push:
    branches: ['audit/mbb-set2-batch03']
    paths: ['.github/workflows/mbb-batch03-source.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6895f6a2a8c5643ef275b94c325ee4556efef2c1
          persist-credentials: false
      - run: git archive --format=tar.gz -o "$RUNNER_TEMP/mbb-batch03-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: mbb-batch03-source
          path: ${{ runner.temp }}/mbb-batch03-source.tar.gz
          retention-days: 7
