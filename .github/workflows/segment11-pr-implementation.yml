name: Segment 11 PR implementation
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  implement:
    if: github.head_ref == 'fix/segment-10-mastery-readiness-metrics'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/segment-10-mastery-readiness-metrics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply Segment 11 integration
        run: python scripts/segment11-integrate.py
      - name: Verify Segment 11 and preserved analytics/history contracts
        run: |
          node --test --test-concurrency=1 tests/test-bank-segment11-history.test.js tests/test-bank-segment11-history-integration.test.js
          node --test --test-concurrency=2 tests/test-bank-learning-events.test.js tests/test-bank-analytics-dashboard.test.js tests/test-bank-adaptive-mastery.test.js tests/test-bank-segment10-mastery-readiness.test.js tests/test-bank-segment09-grading.test.js
          node scripts/exam-reliability/build-catalog.cjs --check
          node scripts/run-test-bank-deploy-checks.mjs
      - name: Commit Segment 11 runtime integration
        shell: bash
        run: |
          git config user.name upskillsprint-agent
          git config user.email skillsprintconsulting@gmail.com
          git rm scripts/segment11-integrate.py
          git add test-bank-history-policy.js test-bank-learning-events.js test-bank-analytics-dashboard.js test-bank-adaptive-mastery-hardening.js netlify/edge-functions/test-bank-set-controls.js netlify/edge-functions/test-bank-mobile-picker.js tests/test-bank-segment11-history.test.js tests/test-bank-segment11-history-integration.test.js docs/exam-reliability/SEGMENT-11-TRENDS-HISTORY.md
          git diff --cached --check
          git commit -m "feat(history): implement Segment 11 trends and complete history [segment11-bot]"
          git push origin HEAD:fix/segment-10-mastery-readiness-metrics
