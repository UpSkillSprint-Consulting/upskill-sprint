name: Segment 18 dependency lock refresh
on:
  pull_request:
    paths:
      - '.github/workflows/segment18-lock-refresh.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with: {node-version-file: '.node-version', cache: npm}
      - name: Generate patched dependency lock
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.dependencies['@netlify/blobs'] = '10.7.13';
          pkg.devDependencies.jspdf = '4.2.1';
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
      - name: Verify production advisory gate
        run: npm audit --omit=dev --audit-level=high
      - name: Commit patched lock and remove one-shot workflow
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name 'upskillsprint-agent'
          git config user.email 'skillsprintconsulting@gmail.com'
          git rm .github/workflows/segment18-lock-refresh.yml
          git add package.json package-lock.json
          git diff --cached --check
          git commit -m 'fix: patch Segment 18 dependency advisories'
          git push origin HEAD:"$HEAD_BRANCH"
