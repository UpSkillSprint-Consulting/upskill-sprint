    try{const token=String(Math.max(0,Number(generation)||0));if(sessionStorage.getItem(RELOAD_KEY)===token)return false;sessionStorage.setItem(RELOAD_KEY,token);window.location.reload();return true;}catch(_){return false;}
  }

'''
          replace_once(security, "  async function fetchControl(force){\n", helper + "  async function fetchControl(force){\n")
          replace_once(security,
              "      clearLocalLearnerState(control);\n      document.dispatchEvent(new CustomEvent('tb:learning-data-deleted',{detail:{generation:generation,purgedAt:control.purgedAt}}));\n      announce('All exam learning history for this account was deleted. This browser has been cleared too.',false);\n      return {deleted:true,generation:generation,purgedAt:control.purgedAt,deletedCounts:data&&data.deleted||{}};\n",
