  check('18 purge serializes against an in-flight event insert',()=>{assert.ok(Date.now()-raceStarted>=250,'purge did not wait for the owner event transaction');assert.equal(ok(t,`SELECT count(*) FROM public.test_bank_learning_events WHERE user_id='${A}' AND event_id='seg18-race-event';`),'0');});
'''
          replace_once(dbtest, race_old, race_new)
          replace_once(dbtest,
              "  denied(t,'18 pre-purge offline event cannot be resurrected',role(A,`INSERT INTO public.test_bank_learning_events(user_id,event_id,device_id,event_type,exam_id,session_id,question_id,occurred_at,payload) VALUES('${A}','seg18-stale-event','seg18-device-a','question_exposed','cssbb','seg18-session-old','cssbb:seg18:old',(SELECT purged_at-interval '1 second' FROM public.test_bank_data_control WHERE user_id='${A}'),'{}');`),'40001');\n  check('18 genuinely post-purge learning event remains permitted',()=>ok(t,commit(role(A,`INSERT INTO public.test_bank_learning_events(user_id,event_id,device_id,event_type,exam_id,session_id,question_id,occurred_at,payload) VALUES('${A}','seg18-new-event','seg18-device-a','question_exposed','cssbb','seg18-session-new','cssbb:seg18:new',clock_timestamp()+interval '1 second','{}');`))));\n",
