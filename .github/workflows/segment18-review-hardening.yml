  assert.match(concurrency,/select \* into strict ctl from public\.test_bank_data_control where user_id = new\.user_id for update/i);
  assert.match(concurrency,/new\.payload->>'securityGeneration'/i);
  assert.match(concurrency,/create trigger a0_test_bank_guard_post_purge_event_v1/i);
  assert.doesNotMatch(concurrency,/new\.occurred_at\s*<=\s*ctl\.purged_at/i);
});

'''
          replace_once(test_path, "test('18 legacy reservation compatibility is explicit while Segment 16 stays authoritative',()=>{\n", insert_test + "test('18 legacy reservation compatibility is explicit while Segment 16 stays authoritative',()=>{\n")

          dbtest = 'scripts/exam-reliability/run-segment18-database.cjs'
          replace_once(dbtest,
              "const {spawnSync}=require('node:child_process');\n",
