          migration = Path('supabase/migrations/20260910050200_harden_security_reset_concurrency.sql')
          migration.write_text(r'''-- Segment 18 review hardening: serialize purge with account writes and use a
-- client-captured purge generation rather than browser wall-clock time.
begin;

create or replace function public.test_bank_guard_progress_generation_v1()
returns trigger
language plpgsql
security definer
set search_path = pg_catalog, public, private
as $$
declare
  ctl public.test_bank_data_control;
  marker bigint;
begin
  if current_setting('upskill.test_bank_security_purge', true) = 'on' then
    return new;
  end if;
  -- Preserve RLS as the authority for cross-owner attempts; a privileged
  -- trigger must not create or expose another owner's control row first.
  if auth.uid() is not null and auth.uid() <> new.user_id then
    return new;
  end if;
  insert into public.test_bank_data_control(user_id,generation,purged_at)
  values(new.user_id,0,null)
  on conflict(user_id) do nothing;
  -- This is the same owner row locked by delete_test_bank_learning_data_v1.
  -- Holding it through the write prevents a progress transaction from
  -- committing behind a purge that already claimed success.
  select * into strict ctl
    from public.test_bank_data_control
   where user_id = new.user_id
   for update;
  if ctl.generation = 0 then
    new.security_generation := 0;
    return new;
  end if;
  begin
    marker := (new.payload #>> '{values,tb-adaptive-security-control,purgeGeneration}')::bigint;
  exception when others then
    marker := null;
  end;
  if marker is distinct from ctl.generation then
    raise exception 'STALE_PROGRESS_GENERATION: refresh account state after learning-data deletion'
      using errcode = '40001';
  end if;
  if coalesce(new.security_generation, 0) < ctl.generation then
    if private.test_bank_progress_is_clean_for_generation_v1(new.payload, ctl.generation) then
      new.security_generation := ctl.generation;
    else
      new.payload := private.test_bank_security_tombstone_payload_v1(ctl.generation, ctl.purged_at);
      new.security_generation := greatest(0, ctl.generation - 1);
    end if;
  else
    new.security_generation := ctl.generation;
  end if;
  return new;
end;
$$;
revoke all on function public.test_bank_guard_progress_generation_v1()
  from public, anon, authenticated;

create or replace function public.test_bank_guard_post_purge_event_v1()
returns trigger
language plpgsql
security definer
set search_path = pg_catalog, public
as $$
declare
  ctl public.test_bank_data_control;
  marker bigint;
begin
  if auth.uid() is not null and auth.uid() <> new.user_id then
    return new;
  end if;
  insert into public.test_bank_data_control(user_id,generation,purged_at)
  values(new.user_id,0,null)
  on conflict(user_id) do nothing;
  -- Lock before any versioned-session trigger can lock its runtime row. Purge
  -- takes this control-row lock first as well, giving all paths one lock order.
  select * into strict ctl
    from public.test_bank_data_control
   where user_id = new.user_id
   for update;
  begin
    marker := coalesce((new.payload->>'securityGeneration')::bigint, 0);
  exception when others then
    marker := -1;
  end;
  if marker is distinct from ctl.generation then
    raise exception 'STALE_LEARNING_EVENT_AFTER_PURGE: refresh this device before syncing old work'
      using errcode = '40001';
  end if;
  return new;
end;
$$;
revoke all on function public.test_bank_guard_post_purge_event_v1()
  from public, anon, authenticated;

-- PostgreSQL fires same-kind triggers in name order. The security lock must be
-- acquired before aa_guard_versioned_event can lock a session-runtime row,
-- otherwise purge (control -> session) and insert (session -> control) can
-- deadlock.
drop trigger if exists aa_test_bank_guard_post_purge_event_v1 on public.test_bank_learning_events;
drop trigger if exists a0_test_bank_guard_post_purge_event_v1 on public.test_bank_learning_events;
create trigger a0_test_bank_guard_post_purge_event_v1
before insert on public.test_bank_learning_events
for each row execute function public.test_bank_guard_post_purge_event_v1();

comment on function public.test_bank_guard_post_purge_event_v1() is
  'Serializes learner-event inserts with purge and requires the purge generation captured when the event was created; browser occurred_at is not an authorization boundary.';
comment on function public.test_bank_guard_progress_generation_v1() is
  'Serializes progress writes with purge and enforces the server purge-generation acknowledgement protocol.';

commit;
''')
