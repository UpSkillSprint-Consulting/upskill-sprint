          replace_once(test_path,
              "const compatibility=fs.readFileSync(path.join(ROOT,'supabase/migrations/20260910050100_preserve_legacy_reservation_compat.sql'),'utf8');\n",
              "const compatibility=fs.readFileSync(path.join(ROOT,'supabase/migrations/20260910050100_preserve_legacy_reservation_compat.sql'),'utf8');\nconst concurrency=fs.readFileSync(path.join(ROOT,'supabase/migrations/20260910050200_harden_security_reset_concurrency.sql'),'utf8');\n")
          replace_once(test_path,
              "  const dom=new JSDOM('<!doctype html><body><div class=\"tb-data-actions\"></div></body>',{url:'https://segment18.invalid/test-bank',runScripts:'outside-only'});\n",
              "  const dom=new JSDOM('<!doctype html><body><div class=\"tb-data-actions\"></div></body>',{url:'https://segment18.invalid/test-bank',runScripts:'outside-only',virtualConsole:new VirtualConsole()});\n")
          old = "  w.localStorage.setItem('unrelated-setting','keep-me');\n  const result=await h.api.deleteLearningData({confirm:'DELETE'});\n"
          new = "  w.localStorage.setItem('unrelated-setting','keep-me');\n  const runtime=[];\n  w.__TBAccountSync={cancelSync:reason=>{runtime.push('account:'+reason);assert.equal(w.localStorage.getItem('tb-learning-events-v2'),'old-ledger');}};\n  w.__TBLearning={resetAfterSecurityPurge:async control=>{runtime.push('learning:'+control.generation);assert.equal(w.localStorage.getItem('tb-learning-events-v2'),'old-ledger');return {reset:true};}};\n  const result=await h.api.deleteLearningData({confirm:'DELETE'});\n"
          replace_once(test_path, old, new)
          replace_once(test_path,
              "  assert.equal(marker.purgeGeneration,3);assert.equal(w.localStorage.getItem('tb-security-purge-ack-v1'),'3');\n});\n",
