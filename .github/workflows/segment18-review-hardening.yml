          replace_once(dbtest,
              "function run(t,sql){const r=spawnSync('psql',cli(t),{env:t.env,input:sql,encoding:'utf8',timeout:30000,maxBuffer:6*1024*1024});if(r.error)throw r.error;return r;}\n",
              "function run(t,sql){const r=spawnSync('psql',cli(t),{env:t.env,input:sql,encoding:'utf8',timeout:30000,maxBuffer:6*1024*1024});if(r.error)throw r.error;return r;}\nfunction runAsync(t,sql){return new Promise((resolve,reject)=>{const child=spawn('psql',cli(t),{env:t.env,stdio:['pipe','pipe','pipe']});let stdout='',stderr='';const timer=setTimeout(()=>{try{child.kill('SIGKILL');}catch(_){}reject(new Error('psql concurrency fixture timed out'));},30000);child.stdout.on('data',chunk=>{stdout+=chunk;});child.stderr.on('data',chunk=>{stderr+=chunk;});child.on('error',error=>{clearTimeout(timer);reject(error);});child.on('close',code=>{clearTimeout(timer);resolve({status:code,stdout,stderr});});child.stdin.end(sql);});}\n")
          race_old = "  const deleted=ok(t,commit(role(A,'SELECT public.delete_test_bank_learning_data_v1(0);')));\n"
          race_new = r'''  const raceUpload=runAsync(t,commit(role(A,`INSERT INTO public.test_bank_learning_events(user_id,event_id,device_id,event_type,exam_id,session_id,question_id,occurred_at,payload) VALUES('${A}','seg18-race-event','seg18-device-a','question_exposed','cssbb','seg18-session-race','cssbb:seg18:race',clock_timestamp(),jsonb_build_object('securityGeneration',0)); SELECT pg_advisory_xact_lock(180018); SELECT pg_sleep(0.75);`)));
  let raceReady=false;
  for(let attempt=0;attempt<30&&!raceReady;attempt+=1){await new Promise(resolve=>setTimeout(resolve,50));raceReady=ok(t,"SELECT EXISTS(SELECT 1 FROM pg_locks WHERE locktype='advisory' AND granted AND classid=0 AND objid=180018);")==='t';}
  assert.equal(raceReady,true,'concurrent insert fixture did not reach its post-insert hold point');
  const raceStarted=Date.now();
  const deleted=ok(t,commit(role(A,'SELECT public.delete_test_bank_learning_data_v1(0);')));
  const raceUploadResult=await raceUpload;
