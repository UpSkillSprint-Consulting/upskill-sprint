name: Segment 18 review hardening
on:
  pull_request:
    paths:
      - '.github/workflows/segment18-review-hardening.yml'
permissions:
  contents: write
jobs:
  harden:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Apply reviewed security hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          learning = 'test-bank-learning-events.js'
          replace_once(learning,
              "  const STORE_KEY = 'tb-learning-events-v2';\n",
              "  const STORE_KEY = 'tb-learning-events-v2';\n  const SECURITY_CONTROL_KEY = 'tb-adaptive-security-control';\n")
          replace_once(learning,
              "  function clone(value) {\n    try { return JSON.parse(JSON.stringify(value)); } catch (error) { return value; }\n  }\n",
              "  function clone(value) {\n    try { return JSON.parse(JSON.stringify(value)); } catch (error) { return value; }\n  }\n  function currentSecurityGeneration() {\n    try {\n      const control = record(JSON.parse(localStorage.getItem(SECURITY_CONTROL_KEY) || '{}'));\n      const generation = Number(control.purgeGeneration);\n      return Number.isSafeInteger(generation) && generation >= 0 ? generation : 0;\n    } catch (error) { return 0; }\n  }\n  function eventSecurityGeneration(event) {\n    const captured = Number(event && event.securityGeneration);\n    if (Number.isSafeInteger(captured) && captured >= 0) return captured;\n    const payloadGeneration = Number(record(event && event.payload).securityGeneration);\n    return Number.isSafeInteger(payloadGeneration) && payloadGeneration >= 0 ? payloadGeneration : 0;\n  }\n  function wireEventPayload(event) {\n    return Object.assign({}, record(event && event.payload), { securityGeneration: eventSecurityGeneration(event) });\n  }\n")
          replace_once(learning,
              "      clientSequence: state.sequence,\n      occurredAt: timestamp,\n",
              "      clientSequence: state.sequence,\n      securityGeneration: currentSecurityGeneration(),\n      occurredAt: timestamp,\n")
          replace_once(learning,
              "        payload: event.payload\n",
              "        payload: wireEventPayload(event)\n")
          replace_once(learning,
              "        payload: { questionId: event.questionId, eventPayload: event.payload }\n",
              "        payload: { questionId: event.questionId, eventPayload: wireEventPayload(event) }\n")
          replace_once(learning,
              "      occurredAt: Date.parse(row.occurred_at) || now(), receivedAt: Date.parse(row.received_at) || null, payload: record(row.payload), syncedFor: [userId]\n",
              "      occurredAt: Date.parse(row.occurred_at) || now(), receivedAt: Date.parse(row.received_at) || null, securityGeneration: eventSecurityGeneration({payload: row.payload}), payload: record(row.payload), syncedFor: [userId]\n")
          reset_fn = r'''  function resetAfterSecurityPurge(control) {
    const generation = Number(control && control.generation);
    syncGeneration += 1;
    if (syncAbortController) { try { syncAbortController.abort(); } catch (error) {} }
    syncAbortController = null;
    if (retryTimer) { clearTimeout(retryTimer); retryTimer = 0; }
    if (mirrorWriteTimer) { clearTimeout(mirrorWriteTimer); mirrorWriteTimer = 0; }
    queuedSyncReason = '';
    retryNextAt = null;
    retryAttempts = 0;
    pendingWriteRevision = 0;
    mirrorWriteSnapshot = null;
    const pendingMirror = mirrorPromise;
    mirrorPromise = null;
    mirrorHydrated = true;
    mirrorAvailable = null;
    syncPromise = null;
    syncUserId = '';
    freshHistoryPromise = null;
    freshHistoryUserId = '';
    progressSnapshotPromise = null;
    progressSnapshotUserId = '';
    cachedState = freshState();
    cachedState.sync.phase = 'security-reset';
    cachedState.sync.lastCancelledAt = now();
    cachedState.sync.lastCancelReason = 'security-purge';
    lastSyncPhase = 'security-reset';
    lastWriteAheadSaved = true;
    lastWriteAheadAt = now();
    localRecovery = { required: false, failedAt: null, recoveredAt: lastWriteAheadAt, reason: null };
    const closeMirror = pendingMirror
      ? Promise.resolve(pendingMirror).then(function (db) { if (db && typeof db.close === 'function') db.close(); }).catch(function () {})
      : Promise.resolve();
    return closeMirror.then(function () {
      if (!mirrorSupported() || !window.indexedDB || typeof window.indexedDB.deleteDatabase !== 'function') {
        return { reset: true, generation: Number.isSafeInteger(generation) ? generation : 0, mirrorDeleted: false };
      }
      return new Promise(function (resolve) {
        let request;
        try { request = window.indexedDB.deleteDatabase(MIRROR_DB); }
        catch (error) { resolve({ reset: true, generation: Number.isSafeInteger(generation) ? generation : 0, mirrorDeleted: false, error: String(error && error.message || error) }); return; }
        let settled = false;
        function finish(deleted, blocked) {
          if (settled) return;
          settled = true;
          resolve({ reset: true, generation: Number.isSafeInteger(generation) ? generation : 0, mirrorDeleted: Boolean(deleted), blocked: Boolean(blocked) });
        }
        request.onsuccess = function () { finish(true, false); };
        request.onerror = function () { finish(false, false); };
        request.onblocked = function () { finish(false, true); };
      });
    });
  }

'''
          replace_once(learning, "  function status() {\n", reset_fn + "  function status() {\n")
          replace_once(learning,
              "    cancelSync: cancelSync,\n    ensureFreshHistory: ensureFreshHistory,\n",
