name: Stateless test bank

on:
  # Branch protection requires this workflow's "Node 22 full suite" check on
  # every pull request, so it must not be suppressed by a paths filter.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node 22 full suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - name: Syntax
        run: |
          node --check test-bank-memory-learning.js
          node --check netlify/edge-functions/test-bank-mobile-picker.js
          node --check scripts/validate-simple-test-bank.mjs
      - name: Validate stateless architecture
        run: node scripts/validate-simple-test-bank.mjs
      - name: Validate result screens
        run: node --test tests/test-bank-stateless-results.test.js
