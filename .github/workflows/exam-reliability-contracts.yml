name: Exam reliability contracts

on:
  pull_request:
    paths:
      - 'docs/exam-reliability/**'
      - 'tests/test-bank-segment0[12]-*.test.js'
      - 'tests/helpers/segment0[12]-*.cjs'
      - '.github/workflows/exam-reliability-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exam-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - name: Record exact tested revision
        run: |
          git rev-parse HEAD > segment02-revision.txt
          node --version >> segment02-revision.txt
          npm --version >> segment02-revision.txt
      - name: Validate contracts and preserve Segment 01 observations
        shell: bash
        run: |
          set -o pipefail
          node --test --test-concurrency=1 tests/test-bank-segment01-*.test.js tests/test-bank-segment02-*.test.js | tee segment02-contracts.log
      - name: Record advisory baseline without modifying dependencies
        if: always()
        shell: bash
        run: |
          set +e
          npm audit --json > segment02-npm-audit.json
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          node -e 'const r=require("./segment02-npm-audit.json"); if(r.error || !Number.isInteger(r.metadata?.vulnerabilities?.total)) process.exit(1);'
      - name: Preserve review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: segment02-contracts-${{ github.run_id }}
          path: |
            segment02-revision.txt
            segment02-contracts.log
            segment02-npm-audit.json
          retention-days: 14
