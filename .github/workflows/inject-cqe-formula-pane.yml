name: Inject CQE formula pane

on:
  push:
    branches:
      - fix/cqe-context-aware-formula-pane
    paths:
      - test-bank-formulas.js
      - .github/workflows/inject-cqe-formula-pane.yml

permissions:
  contents: write

jobs:
  inject:
    if: ${{ !contains(github.event.head_commit.message, '[formula-injected]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/cqe-context-aware-formula-pane

      - name: Load contextual formula script from the test bank
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'test-bank.html';
          const anchor = '  <script src="/site-sections.js"></script>';
          const tag = '  <script defer src="/test-bank-formulas.js"></script>';
          let html = fs.readFileSync(path, 'utf8');
          if (!html.includes(tag)) {
            if (!html.includes(anchor)) throw new Error('Could not find site-sections script anchor in test-bank.html');
            html = html.replace(anchor, anchor + '\n' + tag);
            fs.writeFileSync(path, html);
          }
          NODE

      - name: Commit injected script tag
        shell: bash
        run: |
          if git diff --quiet -- test-bank.html; then
            echo "Script tag already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-bank.html
          git commit -m "fix: load contextual CQE formula pane [formula-injected]"
          git push origin HEAD:fix/cqe-context-aware-formula-pane
