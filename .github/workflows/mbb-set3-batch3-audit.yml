name: MBB Set 3 Batch 3 audit
on:
  pull_request:
    paths: ['scripts/lib/student-audit-*.cjs', 'scripts/run-student-audit.cjs', 'scripts/student-audit-tools/**', 'tests/student-audit-*.test.js', 'test-bank-mbb-set3.js', 'test-bank-mbb-set3-batch3-ui.js', 'test-bank.html', 'test-bank-feedback-loop.js', 'tests/test-bank-mbb-set3*', 'scripts/audit-mbb-set3-batch3.mjs', '.github/workflows/mbb-set3-batch3-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mbb-set3-batch3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Batch 3 content, math, scope and every-option grading
        run: |
          mkdir -p audit-results-batch3
          set -o pipefail
          node --test --test-concurrency=1 tests/test-bank-mbb-set3-batch3-audit.test.js | tee audit-results-batch3/batch3-tests.txt
      - name: Full repository regression
        run: timeout 900 node --test --test-concurrency=2 tests/*.test.js > audit-results-batch3/full-regression.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mbb-set3-batch3-regression
          path: audit-results-batch3
          retention-days: 14
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        layout: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix scripts/student-audit-tools --ignore-scripts
      - run: scripts/student-audit-tools/node_modules/.bin/playwright install --with-deps ${{ matrix.engine }}
      - name: Every question, both themes, answer review and both sliders
        env:
          AUDIT_TOOLS_DIR: ${{ github.workspace }}/scripts/student-audit-tools
          AUDIT_SOURCE: ${{ github.sha }}
          AUDIT_ENGINE: ${{ matrix.engine }}
          AUDIT_LAYOUT: ${{ matrix.layout }}
        run: node scripts/run-student-audit.cjs batch3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mbb-set3-batch3-${{ matrix.engine }}-${{ matrix.layout }}
          path: audit-results-batch3
          retention-days: 14
