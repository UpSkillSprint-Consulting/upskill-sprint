name: Exam question identity
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: question-identity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: '.node-version', cache: npm}
      - run: npm ci
      - name: Validate every published identity and invalid-bank rejection
        shell: bash
        run: |
          set -o pipefail
          node --test --test-concurrency=1 tests/test-bank-question-identities.test.js tests/test-bank-segment04-identity.test.js | tee segment04-identity.log
          git rev-parse HEAD > segment04-revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: segment04-identity-${{ github.run_id }}
          path: |
            segment04-identity.log
            segment04-revision.txt
            docs/exam-reliability/identity/v1/published-baseline.json
          retention-days: 30
