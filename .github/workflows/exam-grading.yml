name: Exam canonical grading
# Segment 09 review regressions reject incomplete and noncanonical historical version references.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exam-canonical-grading-${{ github.ref }}
  cancel-in-progress: true
jobs:
  segment-09:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: '.node-version', cache: npm}
      - run: npm ci
      - name: Preserve catalogs and run independent grading regressions
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .segment09-results
          git rev-parse HEAD > .segment09-results/commit.txt
          git rev-parse HEAD^{tree} > .segment09-results/tree.txt
          git ls-tree -r HEAD > .segment09-results/files.txt
          git archive --format=tar HEAD .github docs scripts tests supabase test-bank.html 'test-bank*.js' package.json package-lock.json .node-version | gzip > .segment09-results/source.tgz
          sha256sum .segment09-results/source.tgz > .segment09-results/SHA256SUMS
          node scripts/exam-reliability/build-catalog.cjs --check | tee .segment09-results/catalog.log
          node --test --test-concurrency=2 tests/test-bank-segment09-*.test.js tests/test-bank-segment08-reconciliation.test.js tests/test-bank-segment07-ingestion.test.js tests/test-bank-segment06-durability.test.js tests/test-bank-segment05-versions.test.js tests/test-bank-analytics-dashboard.test.js | tee .segment09-results/grading.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: segment09-grading-${{ github.run_id }}
          path: .segment09-results
          include-hidden-files: true
          retention-days: 30
