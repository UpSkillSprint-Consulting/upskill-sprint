name: Exam canonical grading
# Segment 09 review regressions reject incomplete and noncanonical historical version references.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: exam-canonical-grading-${{ github.ref }}
  cancel-in-progress: true
jobs:
  segment-09:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: '.node-version', cache: npm}
      - run: npm ci
      - name: Preserve catalogs and run independent grading regressions
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .segment09-results
          git rev-parse HEAD > .segment09-results/commit.txt
          git rev-parse HEAD^{tree} > .segment09-results/tree.txt
          git ls-tree -r HEAD > .segment09-results/files.txt
          git archive --format=tar HEAD .github docs scripts tests supabase test-bank.html 'test-bank*.js' package.json package-lock.json .node-version | gzip > .segment09-results/source.tgz
          sha256sum .segment09-results/source.tgz > .segment09-results/SHA256SUMS
          node scripts/exam-reliability/build-catalog.cjs --check | tee .segment09-results/catalog.log
          node --test --test-concurrency=2 tests/test-bank-segment09-*.test.js tests/test-bank-segment08-reconciliation.test.js tests/test-bank-segment07-ingestion.test.js tests/test-bank-segment06-durability.test.js tests/test-bank-segment05-versions.test.js tests/test-bank-analytics-dashboard.test.js | tee .segment09-results/grading.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: segment09-grading-${{ github.run_id }}
          path: .segment09-results
          include-hidden-files: true
          retention-days: 30
  segment-10-integrate:
    if: github.head_ref == 'fix/segment-10-mastery-readiness-metrics'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/segment-10-mastery-readiness-metrics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply deterministic Segment 10 integration
        run: python scripts/segment10-integrate.py
      - name: Verify Segment 10 and preserved metric/deploy contracts
        run: |
          node --test --test-concurrency=1 tests/test-bank-segment10-mastery-readiness.test.js
          node --test --test-concurrency=2 tests/test-bank-adaptive-mastery.test.js tests/test-bank-analytics-dashboard.test.js tests/test-bank-segment09-grading.test.js
          node scripts/exam-reliability/build-catalog.cjs --check
          node scripts/run-test-bank-deploy-checks.mjs
      - name: Commit implementation and remove staging helpers
        shell: bash
        run: |
          git config user.name upskillsprint-agent
          git config user.email skillsprintconsulting@gmail.com
          git checkout origin/main -- .github/workflows/exam-grading.yml
          git rm -f .github/workflows/segment10-implementation.yml .github/workflows/segment10-pr-implementation.yml scripts/segment10-integrate.py
          git add test-bank-metrics-policy.js test-bank-adaptive-mastery-hardening.js netlify/edge-functions/test-bank-set-controls.js netlify/edge-functions/test-bank-mobile-picker.js tests/test-bank-segment10-mastery-readiness.test.js docs/exam-reliability/SEGMENT-10-MASTERY-READINESS.md .github/workflows/exam-mastery-readiness.yml .github/workflows/exam-grading.yml
          git diff --cached --check
          git commit -m "feat(metrics): implement Segment 10 mastery and readiness [segment10-bot]"
          git push origin HEAD:fix/segment-10-mastery-readiness-metrics
