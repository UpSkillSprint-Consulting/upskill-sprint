name: Exam security and data controls
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exam-security-reset-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: '.node-version', cache: npm}
      - run: npm ci
      - name: Segment 18 security and cumulative regressions
        run: |
          node --check test-bank-security-reset.js
          node --check scripts/exam-reliability/run-segment18-database.cjs
          node --test --test-concurrency=1 \
            tests/test-bank-segment18-security-reset.test.js \
            tests/test-bank-segment17-ux-accessibility.test.js \
            tests/test-bank-segment16-new-only-allocation.test.js \
            tests/test-bank-segment15-session-handoff.test.js \
            tests/test-bank-segment14-incremental-sync.test.js \
            tests/test-bank-segment13-timing.test.js \
            tests/test-bank-segment12-session-lifecycle.test.js \
            tests/test-bank-segment11-trends-history.test.js \
            tests/test-bank-segment10-mastery-readiness.test.js \
            tests/test-bank-segment09-grading.test.js
          npm test
          git diff --check
      - name: Block high or critical production dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Record complete dependency audit without hiding dev-tool advisories
        if: always()
        run: npm audit --json > segment18-npm-audit.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: segment18-node-security-${{ github.run_id }}
          path: segment18-npm-audit.json
          retention-days: 30
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: segment18_ci_only
          POSTGRES_DB: segment03_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: '.node-version', cache: npm}
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply every repository migration and retain cumulative DB checks
        run: node scripts/exam-reliability/run-database.cjs
        env:
          SEG03_ALLOW_DISPOSABLE_DB: '1'
          SEG03_DB_URL: postgresql://postgres:segment18_ci_only@127.0.0.1:5432/segment03_test
      - name: Segment 18 owner, purge, stale-device and RPC checks
        run: node scripts/exam-reliability/run-segment18-database.cjs
        env:
          SEG03_ALLOW_DISPOSABLE_DB: '1'
          SEG03_DB_URL: postgresql://postgres:segment18_ci_only@127.0.0.1:5432/segment03_test
  gate:
    name: Segment 18 acceptance gate
    if: always()
    needs: [node, database]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject failed, skipped, cancelled, or incomplete security lanes
        env:
          NODE_RESULT: ${{ needs.node.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
        run: |
          test "$NODE_RESULT" = success
          test "$DATABASE_RESULT" = success
