name: Apply verified quiz-set validation
on:
  push:
    branches: [feature/independent-quiz-set-selectors]
    paths: [.github/workflows/quiz-set-preparation.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feature/independent-quiz-set-selectors'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          test "$(git hash-object scripts/student-review-browser.py)" = b941748a9d2d155be16c4362213d3c8e210abe75
          python3 scripts/apply-quiz-set-validation.py
          test "$(git hash-object scripts/student-review-browser.py)" = 98863f54fdf31793653f74cbd711f1050cdcc868
          git diff --check
          git add scripts/student-review-browser.py
          git rm scripts/apply-quiz-set-validation.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Validate the actual mode-specific bank in every student journey'
          git push origin HEAD:feature/independent-quiz-set-selectors
