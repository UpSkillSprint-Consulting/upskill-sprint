name: Integrate and validate MBB Set 3 Batch 7
on:
  push:
    branches: ['automation/mbb-set3-batch7']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mbb-set3-batch7-numeric-visibility
  cancel-in-progress: true
jobs:
  integrate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair observed numeric visibility only on the unchanged PR170 head
        run: |
          git fetch origin audit/mbb-set3-batch1-q001-q025
          test "$(git rev-parse FETCH_HEAD)" = '47e8db72f294cfe191517fc911f15db67d3230c8'
          git checkout --detach FETCH_HEAD
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path.cwd();p=root/'test-bank-mbb-set3-batch7-ui.js';s=p.read_text()
          start=s.index(' function table(c)');end=s.index('\n',start)
          table=r''' function table(c){const numeric=c.columns.map((_,i)=>i>0&&c.rows.every(r=>/^[+\-−±]?(?:\d|\.\d)/.test(String(r[i]))));return '<p class="mbbs3b7-scroll-hint">Scroll or swipe horizontally when needed to read every table column.</p><div class="mbbs3b7-scroll" role="region" tabindex="0" aria-label="'+esc(c.title)+'; scroll horizontally if needed"><table class="mbbs3b7-table"><caption>'+esc(c.title)+'</caption><thead><tr>'+c.columns.map((s,i)=>'<th scope="col"'+(numeric[i]?' class="mbbs3b7-number"':'')+'>'+esc(s)+'</th>').join('')+'</tr></thead><tbody>'+c.rows.map(r=>'<tr>'+r.map((s,i)=>i===0?'<th scope="row">'+esc(s)+'</th>':'<td'+(numeric[i]?' class="mbbs3b7-number"':'')+'>'+esc(s)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';}'''
          s=s[:start]+table+s[end:]
          s=s.replace('`;document.head.appendChild(style);','.mbbs3b7-table .mbbs3b7-number{text-align:right;font-variant-numeric:tabular-nums}\n`;document.head.appendChild(style);')
          p.write_text(s)
          p=root/'scripts/audit-mbb-set3-batch7.mjs';s=p.read_text()
          old="await area.screenshot({path:path.join(out,label+'-'+phase+'-region'+i+'-right.png')});"
          new=r'''const numericVisibility=await area.evaluate(el=>{const a=el.getBoundingClientRect();return [...el.querySelectorAll('tbody td.mbbs3b7-number:last-child')].map(td=>{const r=document.createRange();r.selectNodeContents(td);const b=r.getBoundingClientRect();return {text:td.textContent,left:b.left,right:b.right,inside:b.left>=a.left&&b.right<=a.right};});});assert.ok(numericVisibility.every(v=>v.inside),'Rightmost numeric values must remain within the horizontal viewport');right.numericVisibility=numericVisibility;await area.screenshot({path:path.join(out,label+'-'+phase+'-region'+i+'-right.png')});'''
          assert s.count(old)==1;s=s.replace(old,new,1);p.write_text(s)
          p=root/'tests/test-bank-mbb-set3-batch7-audit.test.js';s=p.read_text();s+=r'''
          test('Rightmost numeric columns use tabular right alignment and rendered range-visibility checks',()=>{
           const c={window:{}};vm.runInNewContext(read('test-bank-mbb-set3-batch7-ui.js'),c);const ui=c.window.__MBBSet3Batch7UI;
           for(const index of [0,15,17,20]){const q=batch[index],h=ui.render(q,true);assert.ok((h.match(/class="mbbs3b7-number"/g)||[]).length>=q.chart.rows.length+1);}
           assert.match(read('test-bank-mbb-set3-batch7-ui.js'),/text-align:right;font-variant-numeric:tabular-nums/);
           assert.match(read('scripts/audit-mbb-set3-batch7.mjs'),/numericVisibility.every\(v=>v.inside\)/);
          });
          ''';p.write_text(s)
          D=root/'docs/audits/mbb-set3-batch07';r=json.loads((D/'revisions.json').read_text())
          r[0]['findings'].append('Final mobile right-edge inspection found that left-aligned numeric values could move off-screen at maximum scroll in the narrow review card. Numeric columns now align consistently to the right, with actual text-range visibility assertions and fresh captures.')
          (D/'revisions.json').write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n')
          PY
          node --check test-bank-mbb-set3-batch7-ui.js
          node --check scripts/audit-mbb-set3-batch7.mjs
          node --check tests/test-bank-mbb-set3-batch7-audit.test.js
      - run: npm ci
      - name: Validate every answer and the new numeric visibility guard
        run: node --test --test-concurrency=1 tests/test-bank-mbb-set3-batch7*.test.js
      - name: Push reviewed visual fix to PR170 only
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-bank-mbb-set3-batch7-ui.js scripts/audit-mbb-set3-batch7.mjs tests/test-bank-mbb-set3-batch7-audit.test.js docs/audits/mbb-set3-batch07/revisions.json
          git diff --cached --check
          git commit -m 'fix: keep Batch 7 numeric evidence visible at the mobile table scroll edge'
          git push origin HEAD:refs/heads/audit/mbb-set3-batch1-q001-q025
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Export exact workspace
        if: always()
        run: |
          mkdir -p /tmp/mbb7-workspace
          git rev-parse HEAD > /tmp/mbb7-workspace/commit.txt
          git diff HEAD > /tmp/mbb7-workspace/uncommitted.patch
          tar --exclude=.git --exclude=node_modules -czf /tmp/mbb7-workspace/repository.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mbb-set3-batch7-workspace
          path: /tmp/mbb7-workspace
          retention-days: 14
  regression:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Independent calculations, all-option grading, references, fallback and traversal
        run: |
          mkdir -p audit-results-batch7
          git rev-parse HEAD > audit-results-batch7/tested-commit.txt
          set -o pipefail
          node --test --test-concurrency=1 tests/test-bank-mbb-set3-batch7*.test.js tests/test-bank-mbb-set3.test.js | tee audit-results-batch7/batch7-tests.txt
      - name: Complete repository regression
        run: timeout 900 node --test --test-concurrency=2 tests/*.test.js > audit-results-batch7/full-regression.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mbb-set3-batch7-regression
          path: audit-results-batch7
          retention-days: 14
  browsers:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        layout: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright @axe-core/playwright
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Reopen every question and verify every numeric value at the scroll edge
        env:
          AUDIT_ENGINE: ${{ matrix.engine }}
          AUDIT_LAYOUT: ${{ matrix.layout }}
        run: |
          mkdir -p audit-results-batch7
          git rev-parse HEAD > audit-results-batch7/tested-commit.txt
          node scripts/audit-mbb-set3-batch7.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mbb-set3-batch7-${{ matrix.engine }}-${{ matrix.layout }}
          path: audit-results-batch7
          retention-days: 14
