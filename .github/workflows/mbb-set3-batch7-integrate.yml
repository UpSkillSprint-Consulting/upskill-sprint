name: Integrate and validate MBB Set 3 Batch 7
on:
  push:
    branches: ['automation/mbb-set3-batch7']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mbb-set3-batch7-reference-polish
  cancel-in-progress: true
jobs:
  integrate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair the item-specific study reference on the unchanged review head
        run: |
          git fetch origin audit/mbb-set3-batch1-q001-q025
          test "$(git rev-parse FETCH_HEAD)" = '87e04cd9a892f366b8642ebc2db27edccd9009da'
          git checkout --detach FETCH_HEAD
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path.cwd();p=root/'test-bank-mbb-set3-batch7-ui.js';s=p.read_text()
          helper=r'''
           function referenceLink(q){
            if(!isQuestion(q))return '';
            const r=Array.isArray(q.auditSources)?q.auditSources[1]:null;
            const allowed=/^https:\/\/(?:www\.itl\.nist\.gov|www\.gov\.uk|www\.postgresql\.org|scikit-learn\.org|asq\.org|www\.asq\.org|www\.nasa\.gov|www\.nrc\.gov)\//;
            if(!r||!r.title||!allowed.test(String(r.url)))return '<span class="tb-review-reference-unavailable">An item-specific reference link is not available.</span>';
            return '<a class="tb-review-lesson tb-review-reference" href="'+esc(r.url)+'">Reference: '+esc(r.title)+'</a>';
           }
          '''
          assert 'function referenceLink' not in s
          s=s.replace(' let lastId=',helper+' let lastId=',1).replace('isQuestion,render,rationales,wire','isQuestion,render,rationales,wire,referenceLink')
          s=s.replace('`;document.head.appendChild(style);','.tb-review-card:has(.mbbs3b7-question) .tb-review-reference{max-width:100%;overflow-wrap:anywhere;line-height:1.6}\n`;document.head.appendChild(style);')
          p.write_text(s)
          p=root/'test-bank-feedback-loop.js';s=p.read_text()
          old='\'<a class="tb-review-lesson" href="\' + esc(meta.lesson) + '\">Study: \' + esc(meta.lessonName) + \'</a>\''
          assert s.count(old)==1
          s=s.replace(old,'(window.__MBBSet3Batch7UI&&window.__MBBSet3Batch7UI.isQuestion(question)?window.__MBBSet3Batch7UI.referenceLink(question):'+old+')',1);p.write_text(s)
          p=root/'tests/test-bank-mbb-set3-batch7-audit.test.js';s=p.read_text();s+=r'''
          test('Every Batch 7 review gets its actual item reference; unsafe or out-of-scope links cannot be injected',()=>{
           const c={window:{}};vm.runInNewContext(read('test-bank-mbb-set3-batch7-ui.js'),c);const ui=c.window.__MBBSet3Batch7UI;
           for(const q of batch){const h=ui.referenceLink(q);assert.match(h,/Reference: /);assert.ok(h.includes(q.auditSources[1].url.replace(/&/g,'&amp;')));assert.doesNotMatch(h,/Study: Design of Experiments/);}
           assert.equal(ui.referenceLink(bank[0]),'');assert.doesNotMatch(ui.referenceLink({...batch[0],auditSources:[{}, {title:'bad',url:'javascript:alert(1)'}]}),/<a/);
           assert.doesNotMatch(ui.referenceLink({...batch[0],auditSources:[{}, {title:'bad',url:'https://www.nasa.gov.attacker.example/'}]}),/<a/);
           assert.match(ui.referenceLink({...batch[0],auditSources:[{}, {title:'<img onerror=bad>',url:'https://www.nasa.gov/reference/'}]}),/&lt;img/);
          });
          ''';p.write_text(s)
          p=root/'scripts/audit-mbb-set3-batch7.mjs';s=p.read_text()
          old="const card=page.locator('.tb-review-card');assert.equal"
          new="const card=page.locator('.tb-review-card');assert.equal(await card.locator('a.tb-review-reference').getAttribute('href'),q.auditSources[1].url);assert.equal(await card.locator('a.tb-review-reference').textContent(),'Reference: '+q.auditSources[1].title);assert.equal"
          assert old in s;s=s.replace(old,new,1);p.write_text(s)
          D=root/'docs/audits/mbb-set3-batch07';r=json.loads((D/'revisions.json').read_text())
          for row in r:row['findings'].append('Rendered review linked all advanced-analytics items to the DOE lesson; the final scoped footer now links the actual item-specific primary reference and labels it as a reference, not a platform lesson.')
          (D/'revisions.json').write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n')
          PY
          node --check test-bank-mbb-set3-batch7-ui.js
          node --check test-bank-feedback-loop.js
          node --check scripts/audit-mbb-set3-batch7.mjs
      - run: npm ci
      - name: Revalidate scoped references, every answer and both graphical paths
        run: node --test --test-concurrency=1 tests/test-bank-mbb-set3-batch7*.test.js
      - name: Push reviewed reference correction to PR170 only
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-bank-mbb-set3-batch7-ui.js test-bank-feedback-loop.js docs/audits/mbb-set3-batch07/revisions.json tests/test-bank-mbb-set3-batch7-audit.test.js scripts/audit-mbb-set3-batch7.mjs
          git diff --cached --check
          git commit -m 'fix: give final-batch review cards accurate item-specific reference links'
          git push origin HEAD:refs/heads/audit/mbb-set3-batch1-q001-q025
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Export exact workspace
        if: always()
        run: |
          mkdir -p /tmp/mbb7-workspace
          git rev-parse HEAD > /tmp/mbb7-workspace/commit.txt
          git diff HEAD > /tmp/mbb7-workspace/uncommitted.patch
          tar --exclude=.git --exclude=node_modules -czf /tmp/mbb7-workspace/repository.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mbb-set3-batch7-workspace
          path: /tmp/mbb7-workspace
          retention-days: 14
  regression:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Independent mathematics, all-option grading, references, fallback and Set 3 traversal
        run: |
          mkdir -p audit-results-batch7
          git rev-parse HEAD > audit-results-batch7/tested-commit.txt
          set -o pipefail
          node --test --test-concurrency=1 tests/test-bank-mbb-set3-batch7*.test.js tests/test-bank-mbb-set3.test.js | tee audit-results-batch7/batch7-tests.txt
      - name: Complete repository regression
        run: timeout 900 node --test --test-concurrency=2 tests/*.test.js > audit-results-batch7/full-regression.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mbb-set3-batch7-regression
          path: audit-results-batch7
          retention-days: 14
  browsers:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        layout: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright @axe-core/playwright
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Reopen all 25 questions, all five visuals and every corrected reference footer
        env:
          AUDIT_ENGINE: ${{ matrix.engine }}
          AUDIT_LAYOUT: ${{ matrix.layout }}
        run: |
          mkdir -p audit-results-batch7
          git rev-parse HEAD > audit-results-batch7/tested-commit.txt
          node scripts/audit-mbb-set3-batch7.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mbb-set3-batch7-${{ matrix.engine }}-${{ matrix.layout }}
          path: audit-results-batch7
          retention-days: 14
