name: PR173 review supervision candidate
on:
  push:
    branches: ['diagnostic/pr173-review-supervision']
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b03ebcdb218e2e0ac0ba0d6e0ac6428bd1935f0b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version-file: '.node-version', cache: npm}
      - name: Reconstruct and compare the complete candidate tree
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs'),zlib=require('node:zlib'),crypto=require('node:crypto'),assert=require('node:assert/strict'),{execFileSync}=require('node:child_process');
            const git=(...a)=>execFileSync('git',a,{encoding:'utf8'}).trim();
            assert.equal(git('rev-parse','HEAD'),'b03ebcdb218e2e0ac0ba0d6e0ac6428bd1935f0b');
            const repo={owner:context.repo.owner,repo:context.repo.repo};
            const chunks=['9461d9f252dc469431fbdc05408054a989317a59','3e9d4e15a0b7cb49c0805579b7da9892a96de7b5','e6705b29ba6fb407052140394d33981558b335b9','6f57cffbaba76a5da9db6336a6cd1e5bac537511'];
            let encoded='';
            for(const file_sha of chunks){const r=await github.rest.git.getBlob({...repo,file_sha});encoded+=Buffer.from(r.data.content,'base64').toString('utf8');}
            const patch=zlib.brotliDecompressSync(Buffer.from(encoded,'base64'));
            assert.equal(crypto.createHash('sha256').update(patch).digest('hex'),'9405a81521cec973c4061b055c5be779b7282ca795b5eb7e9c9e6e38c12d9062');
            fs.writeFileSync('/tmp/pr173-stability.patch',patch);git('apply','--index','/tmp/pr173-stability.patch');
            assert.equal(git('write-tree'),'0fb97efc1bc4663c721483d4bffb2ae8345b5a96');
            const paths=git('diff','--cached','--name-only').split('\n');assert.equal(paths.length,30);
            const entries=[];
            for(const path of paths){const bytes=fs.readFileSync(path);const b=await github.rest.git.createBlob({...repo,content:bytes.toString('base64'),encoding:'base64'});assert.equal(b.data.sha,git('hash-object',path));entries.push({path,mode:'100644',type:'blob',sha:b.data.sha});}
            fs.mkdirSync('/tmp/pr173-supervision-candidate',{recursive:true});fs.writeFileSync('/tmp/pr173-supervision-candidate/assembly.json',JSON.stringify({parent:git('rev-parse','HEAD'),tree:git('write-tree'),entries,refsUpdated:false,scope:'Working-tree candidate only; exact PR-head acceptance follows connector push'},null,2));
            // Only immutable objects created; no branch/ref or production changes.
      - run: npm ci
      - name: Focus, actual child-process freeze, evidence gate and batch compatibility regressions
        run: node --test --test-concurrency=1 tests/contrast-theme-race.test.js tests/test-bank-mbb-set3-final-student.test.js tests/student-audit-*.test.js tests/test-bank-mbb-set3-batch1-feedback.test.js tests/test-bank-mbb-set3-batch4-affordances.test.js > /tmp/pr173-supervision-candidate/tests.log 2>&1
      - name: Verify unchanged content-addressed catalogue
        run: node scripts/exam-reliability/build-catalog.cjs --check > /tmp/pr173-supervision-candidate/catalogue.json
      - name: Install exact lock without changing application dependencies
        run: npm ci --prefix scripts/student-audit-tools --ignore-scripts
      - run: scripts/student-audit-tools/node_modules/.bin/playwright install --with-deps webkit
      - name: Complete existing 25-item Batch4 WebKit-mobile audit under independent supervision
        env:
          AUDIT_TOOLS_DIR: ${{ github.workspace }}/scripts/student-audit-tools
          AUDIT_ENGINE: webkit
          AUDIT_LAYOUT: mobile
          AUDIT_SOURCE: 'candidate-tree-0fb97efc1bc4663c721483d4bffb2ae8345b5a96'
        run: node scripts/run-student-audit.cjs batch4
      - name: Construct scoped full-driver probe without editing the original acceptance test
        run: |
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          let s=fs.readFileSync('scripts/stress-mbb-set3-final175.mjs','utf8');
          const before='for(let i=0;i<175;i++){const q=bank[i]';assert.equal(s.split(before).length,3);
          s=s.split(before).join('for(const i of [0,42,138,139,140,174]){const q=bank[i]');
          s=s.replace('const correct=mixed?59:175;','const correct=6;');
          const a=s.indexOf(" for(const filter of ['all','correct','incorrect','unanswered','flagged'])"),b=s.indexOf(' verifyCoverage(report,bank);report.complete=true;',a);assert.ok(a>0&&b>a);
          s=s.slice(0,a)+' report.diagnosticOnly=true;report.complete=true;'+s.slice(b+' verifyCoverage(report,bank);report.complete=true;'.length);
          s=s.replace("scope:'All 175 canonical Set 3 items in one uninterrupted session'","scope:'DIAGNOSTIC ONLY: six selected items; full seven-profile PR acceptance runs separately'");
          fs.writeFileSync('scripts/pr173-supervision-probe.mjs',s);
          NODE
      - name: Verify real WebKit focus, current scanner equivalence and complete supervisor evidence on the scoped probe
        env:
          AUDIT_TOOLS_DIR: ${{ github.workspace }}/scripts/student-audit-tools
          AUDIT_ENGINE: webkit
          AUDIT_LAYOUT: mobile
          AUDIT_WIDTH: '390'
          AUDIT_AXE: '1'
          AUDIT_SOURCE: 'candidate-tree-0fb97efc1bc4663c721483d4bffb2ae8345b5a96'
          AUDIT_OUT: audit-pr173-supervision-probe
        run: |
          node <<'NODE'
          const path=require('node:path');
          require('./scripts/lib/student-audit-supervisor.cjs').supervise({args:['scripts/pr173-supervision-probe.mjs'],resultFile:path.resolve('audit-pr173-supervision-probe/supervisor.json'),totalMs:5*60000}).then(s=>{console.log(JSON.stringify(s));if(s.status!=='passed')process.exitCode=1;});
          NODE
      - name: Preserve test evidence with explicit candidate scope
        if: always()
        run: |
          mkdir -p /tmp/pr173-supervision-candidate
          if test -d audit-results-batch4; then cp -r audit-results-batch4 /tmp/pr173-supervision-candidate/batch4; fi
          if test -d audit-pr173-supervision-probe; then cp -r audit-pr173-supervision-probe /tmp/pr173-supervision-candidate/probe; fi
          if test -f scripts/pr173-supervision-probe.mjs; then cp scripts/pr173-supervision-probe.mjs /tmp/pr173-supervision-candidate/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr173-supervision-candidate-${{ github.run_id }}
          path: /tmp/pr173-supervision-candidate
          retention-days: 14
