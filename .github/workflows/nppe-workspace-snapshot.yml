name: NPPE branch workspace snapshot
on:
  push:
    branches: [codex/nppe-three-set-architecture]
    paths: [.github/workflows/nppe-workspace-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Archive current source for diagnostic integration
        run: |
          git rev-parse HEAD > nppe-source-head.txt
          git archive --format=tar.gz HEAD > nppe-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: nppe-source-current
          path: |
            nppe-source-head.txt
            nppe-source.tar.gz
          retention-days: 1
