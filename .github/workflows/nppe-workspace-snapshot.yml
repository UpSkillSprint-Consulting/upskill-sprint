name: NPPE branch workspace snapshot
on:
  push:
    branches: [codex/nppe-three-set-architecture]
    paths: [.github/workflows/nppe-workspace-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Archive concurrent form files for integration tests
        run: |
          git rev-parse HEAD > nppe-source-head.txt
          tar -czf nppe-concurrent-workspace.tar.gz nppe-source-head.txt exam-practice.html test-bank.html test-bank-memory-learning.js test-bank-nppe-set2.js netlify/edge-functions/test-bank-mobile-picker.js supabase/migrations tests/exam-directory.test.js tests/exam-practice-section.test.js tests/test-bank-nppe-architecture.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: nppe-concurrent-workspace
          path: nppe-concurrent-workspace.tar.gz
          retention-days: 1
