name: NPPE branch workspace snapshot
on:
  push:
    branches: [codex/nppe-three-set-architecture]
    paths: [.github/workflows/nppe-workspace-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - name: Archive lockfile-pinned dependencies for offline tests
        run: tar -czf nppe-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: nppe-dependencies
          path: nppe-dependencies.tar.gz
          retention-days: 1
