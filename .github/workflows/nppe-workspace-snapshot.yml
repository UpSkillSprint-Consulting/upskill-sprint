name: NPPE branch workspace snapshot
on:
  push:
    branches: [codex/nppe-three-set-architecture]
    paths: [.github/workflows/nppe-workspace-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - name: Archive current tracked source and pinned dependencies
        run: |
          git archive --format=tar HEAD > nppe-current-workspace.tar
          tar -rf nppe-current-workspace.tar node_modules
          gzip nppe-current-workspace.tar
      - uses: actions/upload-artifact@v4
        with:
          name: nppe-current-workspace
          path: nppe-current-workspace.tar.gz
          retention-days: 1
