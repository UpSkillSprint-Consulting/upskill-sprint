name: NPPE branch workspace snapshot
on:
  push:
    branches: [codex/nppe-three-set-architecture]
    paths: [.github/workflows/nppe-workspace-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source for offline implementation and tests
        run: git archive --format=zip --output=nppe-workspace.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: nppe-workspace
          path: nppe-workspace.zip
          retention-days: 1
