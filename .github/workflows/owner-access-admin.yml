name: Owner access admin validation
on:
  pull_request:
    paths:
      - 'admin-access.*'
      - 'admin-shell.js'
      - 'supabase/owner-access-admin.sql'
      - 'supabase/tests/owner-access-admin.sql'
      - 'tests/owner-admin.test.js'
      - '.github/workflows/owner-access-admin.yml'
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
      - run: node --check admin-access.js
      - run: node --test tests/owner-admin.test.js tests/access-notice.test.js tests/premium-simulator-access.test.js
