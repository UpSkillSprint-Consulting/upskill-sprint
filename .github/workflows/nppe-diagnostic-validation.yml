name: NPPE diagnostic validation
on:
  pull_request:
    paths:
      - 'test-bank*.js'
      - 'test-bank.html'
      - 'scripts/*exam*.mjs'
      - 'scripts/nppe*.mjs'
      - 'scripts/stage-public-site.mjs'
      - 'scripts/audit-exam-public-content.mjs'
      - 'exam-access-loader.js'
      - 'netlify/functions/exam-content.mjs'
      - 'tests/*nppe*.test.js'
      - '.github/workflows/nppe-diagnostic-validation.yml'
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: node --test --test-concurrency=1 tests/test-bank-nppe-diagnostic.test.js tests/test-bank-nppe-learning.test.js tests/test-bank-nppe-architecture.test.js tests/test-bank-nppe-assessment-policy.test.js tests/test-bank-nppe-mock-a.test.js tests/nppe-mock-a-review-packets.test.js tests/nppe-calibrate.test.js tests/nppe-mock-b-readiness.test.js tests/nppe-mock-b-batch1.test.js tests/nppe-mock-b-batch2.test.js tests/nppe-mock-b-batch3.test.js tests/nppe-mock-b-batch4.test.js tests/nppe-mock-b-batch5.test.js tests/nppe-mock-b-batch6.test.js tests/nppe-mock-b-batch7.test.js tests/nppe-mock-b-batch8.test.js tests/nppe-mock-b-batch9.test.js tests/exam-access-delivery.test.js tests/exam-directory.test.js tests/exam-practice-section.test.js
