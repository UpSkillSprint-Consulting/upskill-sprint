name: Exam local durability
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exam-local-durability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-durability:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: '.node-version', cache: npm}
      - run: npm ci
      - name: Draft, crash, quota, ownership and UI guards
        run: >-
          node --test --test-concurrency=1
          tests/test-bank-segment06-durability.test.js
          tests/test-bank-learning-events.test.js
          tests/test-bank-write-ahead-guard.test.js
          tests/test-bank-mobile-storage-quota.test.js
