name: Assemble short-run SPC lesson

on:
  push:
    branches:
      - agent/add-short-run-spc-lesson
    paths:
      - .lesson-build/short-run-spc/READY
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'feat: add short-run SPC lesson'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-short-run-spc-lesson

      - name: Reconstruct and verify files
        shell: bash
        run: |
          set -euo pipefail
          cat .lesson-build/short-run-spc/gz/lesson-*.b64 > /tmp/lesson.gz.b64
          echo 'e3f83e0d19ca2245e9c457c0f4edf33f33d673cc59c1d995514b4dd4663479dc  /tmp/lesson.gz.b64' | sha256sum -c -
          base64 --decode /tmp/lesson.gz.b64 | gzip -d > /tmp/short-run-spc-control-charts.html
          echo '8b37f8eb3a6f71f51ee4587c85a2a7597845703b5d453be7df132c32d41c82b8  /tmp/short-run-spc-control-charts.html' | sha256sum -c -

          cat .lesson-build/short-run-spc/gz/registry-*.b64 > /tmp/registry.gz.b64
          echo '74a6779f454054ace4b128c89e4d2740dea4629aa26b6ed5b32588c9d60744ea  /tmp/registry.gz.b64' | sha256sum -c -
          base64 --decode /tmp/registry.gz.b64 | gzip -d > /tmp/chi-square-lesson-library.js
          echo 'b8b04b832048f748f3b6e9c605ef80537c3b89f324276ba1b597dab0d5b9ae87  /tmp/chi-square-lesson-library.js' | sha256sum -c -

          mkdir -p lessons/lean-six-sigma
          mv /tmp/short-run-spc-control-charts.html lessons/lean-six-sigma/short-run-spc-control-charts.html
          mv /tmp/chi-square-lesson-library.js chi-square-lesson-library.js

      - name: Validate lesson integration
        shell: bash
        run: |
          set -euo pipefail
          node --check chi-square-lesson-library.js
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          lesson = Path('lessons/lean-six-sigma/short-run-spc-control-charts.html')
          html = lesson.read_text(encoding='utf-8')
          match = re.search(r'<!--\s*UPSKILLSPRINT_LESSON_META\s*\n([\s\S]*?)\n-->', html)
          assert match, 'Missing UPSKILLSPRINT_LESSON_META block'
          meta = json.loads(match.group(1))
          required = {
              'title', 'slug', 'category', 'category_slug', 'level',
              'estimated_minutes', 'interactive', 'card_title',
              'card_description', 'search_keywords', 'suggested_github_path'
          }
          assert required.issubset(meta), required - set(meta)
          assert meta['slug'] == 'short-run-spc-control-charts'
          assert meta['category'] == 'Lean Six Sigma'
          assert meta['category_slug'] == 'lean-six-sigma'
          assert meta['level'] == 'Intermediate'
          assert meta['interactive'] is True
          assert meta['suggested_github_path'] == 'lessons/lean-six-sigma/short-run-spc-control-charts.html'
          assert '<body data-lesson-page="true" data-category="lean-six-sigma" data-level="intermediate" data-interactive="true">' in html
          assert html.count('class="quiz-q"') == 5
          assert 'data-short-run-spc-control-charts' in Path('chi-square-lesson-library.js').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html)
          assert len(scripts) == 1, f'Expected one inline script, found {len(scripts)}'
          Path('/tmp/short-run-spc-inline.js').write_text(scripts[0], encoding='utf-8')
          print('Lesson metadata and integration checks passed.')
          PY
          node --check /tmp/short-run-spc-inline.js
          npm test

      - name: Commit final website files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .lesson-build/short-run-spc
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lessons/lean-six-sigma/short-run-spc-control-charts.html chi-square-lesson-library.js .lesson-build/short-run-spc
          git commit -m 'feat: add short-run SPC lesson'
          git push origin HEAD:agent/add-short-run-spc-lesson
