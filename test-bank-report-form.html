<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test bank report intake</title>
  <meta name="robots" content="noindex, nofollow">
  <script src="/theme.js"></script>
  <script src="/site-sections.js"></script>
</head>
<body data-site-chrome="minimal">
  <main>
  <h1 style="position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;">Test bank report intake</h1>
  <form name="test-bank-question-report" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="test-bank-question-report">
    <p hidden><label>Do not fill this out: <input name="bot-field"></label></p>
    <input name="report-id">
    <input name="exam">
    <input name="issue-type">
    <input name="question">
    <input name="stored-answer">
    <input name="page">
    <textarea name="reviewer-note"></textarea>
  </form>
  </main>
</body>
</html>
