# Netlify deployment configuration for UpSkill Sprint.
# Pretty URLs serve HTML pages without exposing the .html extension.

[build]
  command = "node --test --test-name-pattern='accuracy-distractor|accuracy-similar' tests/test-bank-deep-feedback-accuracy.test.js && node scripts/build-binomial-poisson-exponential-lesson.mjs && node scripts/validate-binomial-poisson-exponential-visual.mjs && node scripts/build-grade-specification-lookup.mjs && node scripts/build-interactive-sql-lesson.mjs && node scripts/focus-sql-clause-learning.mjs"
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true
