# Netlify deployment configuration for UpSkill Sprint.
# Pretty URLs serve HTML pages without exposing the .html extension.

[build]
  command = "npm run build:site"
  publish = "public-site"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[edge_functions]]
  path = "/test-bank"
  function = "test-bank-mobile-picker"

[[edge_functions]]
  path = "/test-bank/"
  function = "test-bank-mobile-picker"

[[edge_functions]]
  path = "/test-bank.html"
  function = "test-bank-mobile-picker"

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true
