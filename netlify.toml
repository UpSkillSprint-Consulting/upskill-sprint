# Netlify deployment configuration for UpSkill Sprint.
# Pretty URLs serve HTML pages without exposing the .html extension.

[build]
  command = "npm run build:site"
  publish = "public-site"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[edge_functions]]
  path = "/test-bank"
  function = "test-bank-mobile-picker"

[[edge_functions]]
  path = "/test-bank/"
  function = "test-bank-mobile-picker"

[[edge_functions]]
  path = "/test-bank.html"
  function = "test-bank-mobile-picker"

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

# Fragment and fallback HTML that is fetched by other pages at runtime but is
# not a standalone page: keep it out of search results.
[[headers]]
  for = "/lessons/assets/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/test-bank-assets/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Legacy duplicate URLs: send them to the one canonical lesson URL with a
# permanent redirect. force = true is needed because the old redirect stubs
# still exist as files (they stay as a client-side fallback).
# The DMAIC path contains spaces. Netlify's docs ask for URL-encoded paths;
# the literal-space splat rule is the form the Netlify CLI matches locally.
# Both are kept so the redirect works either way.
[[redirects]]
  from = "/lesson/Lean%20Six%20Sigma/DMAIC%20Formula%20Encyclopedia/*"
  to = "/lessons/lean-six-sigma/dmaic-formula-encyclopedia"
  status = 301
  force = true

[[redirects]]
  from = "/lesson/Lean Six Sigma/DMAIC Formula Encyclopedia/*"
  to = "/lessons/lean-six-sigma/dmaic-formula-encyclopedia"
  status = 301
  force = true

[[redirects]]
  from = "/lessons/minitab-control-chart-selection-analysis"
  to = "/lessons/power-bi-excel-sql/minitab-control-chart-selection-analysis"
  status = 301
  force = true

[[redirects]]
  from = "/lessons/minitab-control-chart-selection-analysis.html"
  to = "/lessons/power-bi-excel-sql/minitab-control-chart-selection-analysis"
  status = 301
  force = true
